# `cargo xtask feature-tests` (xtask/src/feature_tests.rs): the tests main's
# `cargo nextest run --workspace` leaves out, because a `[[test]]`'s
# `required-features` or a test's `cfg(feature …)` is off in that build, and
# the pass that runs each. Main CI's Tests job runs every pass after the
# workspace run (`--run`); the Lint job fails on a gated test no pass runs,
# a pass that runs nothing new, and a stale skip.
#
# A pass is one `cargo nextest run -p <packages> --features <features>`.
# `workspace = true` builds `--workspace` with the features and runs only
# its packages' tests: for a member high in the graph, whose `-p` build
# alone would resolve everything under it differently from the workspace
# run and so build it all a second time.
#
# No pass turns on `architect-app/wasi` (or uses `--all-features`): the
# sandbox-media goldens (apps/sandbox/media/tests/builtins.rs) are the default sandbox,
# and that feature adds the manager's Components kind to the extensions
# page on purpose. No test is gated on it, so the check needs no pass.

# The framework crate's feature-gated tests (the supervisor #299 fixed sat
# here), telemetry's OTel side and the flight recorder, the orgs opener on
# the Action List, and the derive's cfg'd-off action.
[[pass]]
name = "framework"
packages = ["architect", "architect-action-derive", "architect-telemetry", "architect-orgs"]
features = [
    "architect/atom",
    "architect/atom-persist",
    "architect/platform",
    "architect/local",
    "architect/settings",
    "architect/capability",
    "architect/release",
    "architect/snapshot",
    "architect/server-seaorm",
    "architect/testing",
    "architect/rt",
    "architect/schedule",
    "architect-action-derive/test-gated",
    "architect-telemetry/otel",
    "architect-telemetry/flight",
    "architect-orgs/commands",
]

# `CodeEditor`'s story played headlessly on Blitz against its golden
# (`features/editor/tests/story.rs`, #512): `architect-editor`'s `stories`
# feature, which nothing in the workspace build turns on. (Its `syntax`
# tests need no pass: the app's `native` turns `syntax` on there.)
[[pass]]
name = "editor-story"
packages = ["architect-editor"]
features = ["architect-editor/stories", "architect-editor/native"]

# Process views (#579, #641): the demo program and the frames test, its
# guest and host in one process tree. Without a Vulkan adapter that shares
# dma-bufs the test says so and returns. With `extension` (#838): an
# extension's `kind = "process"` view loaded installed and in development
# (tests/extension_kind.rs); without a Vulkan adapter it says so too.
[[pass]]
name = "process-view"
packages = ["architect-process-view"]
features = ["architect-process-view/demo", "architect-process-view/guest", "architect-process-view/host", "architect-process-view/extension"]

# The whole stack started as `devenv up` starts it (#541,
# `xtask/tests/dev_stack.rs`): the demo seed end to end (sign-in, the org's
# vault through the node, a share link per audience) and a mirror of a
# stand-in production with the guard's refusals. Its feature also lets the
# guard take a loopback port as production, so only this pass turns it on.
# It builds auth-server, mock-oauth and the headless node itself.
[[pass]]
name = "dev-stack"
packages = ["xtask"]
features = ["xtask/stack-test"]

# The web view kind's desk host (#222): the package protocol's origin
# check, navigation, host names and the overlay probes (src/desk.rs), in
# the wry build (WebKitGTK from the dev shell).

# What the Architect app's passes used to reach before the strip removed
# the app: the accounts' sign-in over HTTP, the keychain and the share
# actions, the editor's LSP, MCP over HTTP, presence's native and UI
# sides, and the workspace's paint documents.
[[pass]]
name = "framework-features"
packages = ["architect-accounts", "architect-editor", "architect-mcp", "architect-presence", "architect-workspace"]
features = [
    "architect-accounts/http",
    "architect-accounts/keychain",
    "architect-accounts/actions",
    "architect-editor/lsp-stub",
    "architect-editor/native",
    "architect-mcp/http",
    "architect-presence/native",
    "architect-presence/ui",
    "architect-workspace/paint",
    "architect-workspace/paint-ui",
]

# What the auth test crate's build turned on before auth left for
# FastTrackStudios/auth: the facade's HTTP and entity-storage tests, the
# orgs service against an in-process issuer, and the permission gate.
[[pass]]
name = "auth-consumers"
packages = ["architect", "architect-orgs", "architect-permissions"]
features = [
    "architect/server",
    "architect/vox",
    "architect/http",
    "architect/http-client",
    "architect/local",
    "architect/dispatch-tokio",
    "architect-orgs/auth",
    "architect-orgs/server",
    "architect-permissions/auth",
]
