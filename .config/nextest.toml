# cargo-nextest config: `just test` and main CI (.github/workflows/checks.yml).

[profile.ci]
# Report every failing test of a run, not just the first.
fail-fast = false
status-level = "fail"
final-status-level = "fail"
# A hung test fails with its name after 8 minutes instead of holding the
# Tests job to its 60-minute timeout (#520's hang). The slowest test of a
# green main run takes 60–90 s (the WASI tests build their components
# in-test, longer on a cold cache); flagged slow at 60 s, killed at 8 min.
slow-timeout = { period = "60s", terminate-after = 8 }

# The local stack's test (xtask/tests/dev_stack.rs, #541) builds the
# headless node and the auth server before it starts them: on a cold cache
# that alone can pass 8 minutes. Still bounded.
[[profile.ci.overrides]]
filter = "package(xtask) & binary(dev_stack)"
slow-timeout = { period = "60s", terminate-after = 20 }

# The process views' GPU tests take turns across their binaries too
# (features/process-view/tests: `frames`, `extension_kind`): each makes a
# GPU device and starts a program that makes another, and two such pairs
# at once stalled a driver (#838, frames.rs `gpu_alone`, which keeps them
# apart within one binary).
[test-groups]
process-view-gpu = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(architect-process-view) & (binary(frames) | binary(extension_kind))"
test-group = "process-view-gpu"
