# This file contains settings for `cargo hakari`.
# See https://docs.rs/cargo-hakari/latest/cargo_hakari/config for a full list of options.

hakari-package = "architect-workspace-hack"

# Format version for hakari's output. Version 4 requires cargo-hakari 0.9.22 or above.
dep-format-version = "4"

# Setting workspace.resolver = "2" or higher in the root Cargo.toml is HIGHLY recommended.
# Hakari works much better with the v2 resolver. (The v2 and v3 resolvers are identical from
# hakari's perspective, so you're welcome to set either.)
#
# For more about the new feature resolver, see:
# https://blog.rust-lang.org/2021/03/25/Rust-1.51.0.html#cargos-new-feature-resolver
resolver = "2"

# The targets the fleet builds (architect `skills/architect/references/xtask-tooling.md`,
# "Fleet toolchain"): Linux servers, desktops and CI; the macOS desktop
# (Apple Silicon and Intel); the iPhone apps; the web apps (wasm).
platforms = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
]

# The versions this workspace locks, as carets (`1.1.10`, not `1`): a
# consumer locked lower then moves up to architect's version instead of
# failing on a feature that version added, and the fleet shares one
# version of each crate.
exact-versions = true

# Host and target stay separate, as cargo builds them. Every fleet repo
# sets the same, so a crate a build script or proc macro uses resolves the
# same in each of them (the fleet union in workspace-hack/Cargo.toml).
unify-target-host = "none"

# Members that never take the hack. The repo tooling depends on nothing
# the members build; with the hack it would compile the whole union before
# `cargo xtask` could run. A proc macro is built for the host, so with the
# hack it would build the whole target union a second time, for the host;
# the hack's build-dependencies already unify what build scripts and proc
# macros use.
[traversal-excludes]
workspace-members = [
    "xtask",
    "architect-action-derive",
    "architect-derive",
    "architect-rpc-derive",
    "architect-settings-derive",
    "architect-story-macros",
    "crdt-derive",
    # The WASI guests: built for wasm32-wasip2 only, and their wit-bindgen
    # is not a host dependency.
    "architect-extension-wasi",
    "architect-extension-wasi-hazards",
    "architect-lab-wasi-counter",
]

# The optional WASI runtime (`architect-extensions`' `wasi` feature, Wasmtime
# and its compiler and parsers) and the WIT parser its tests read the world
# with: their crates stay out of the hack, so a build without `wasi` compiles
# none of them, and the fleet hack is the same for every repo that does not
# enable it.
third-party = [
    { name = "wasmtime" },
    { name = "wasmtime-wasi" },
    { name = "wit-parser" },
]
