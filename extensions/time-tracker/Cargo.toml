[package]
name = "architect-time-tracker"
description = "The Time Tracker, a first-party architect extension: timers and time entries on vault notes (TaskNotes' timeEntries), totals per task, project, day and week, a timesheet base view and a report, linked in or run as a process; it provides `time` (extensions/time-tracker/extension.toml)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "architect-time-tracker"
path = "src/main.rs"

[dependencies]
# The trait and the guest (its process copy); the app adds `linked`.
# The trait (`linked-core`): linked into an app, a browser's too (#495);
# off the browser also its process copy (`guest`, vox and tokio).
architect-extensions = { workspace = true, features = ["linked-core"] }
# Its navigator provider (MIT; never the GPL navigator itself).
architect-navigator-api = { workspace = true }
# A capture's shape (its model only).
architect-capture = { workspace = true }
chrono = { workspace = true }
dioxus = { workspace = true }
futures-timer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
architect = { workspace = true, features = ["action-list"] }
architect-extensions = { workspace = true, features = ["host", "linked", "process"] }
architect-settings = { workspace = true }
# The app's side in a test: a vault's actions and Bases' over a folder.
architect-bases = { workspace = true, features = ["actions"] }
vault = { workspace = true, features = ["actions"] }
architect-capture = { workspace = true, features = ["actions"] }
# The rest of the bundle, to test it together.
architect-projects = { workspace = true }
architect-tasks = { workspace = true }
futures = "0.3"
serde_yaml = { workspace = true }
tempfile = "3"

[lints]
workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
architect-extensions = { workspace = true, features = ["guest"] }

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../workspace-hack" }
