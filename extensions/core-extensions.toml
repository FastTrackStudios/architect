# sums    = "https://codeberg.org/jane/metronome-plus/releases/download/v1.4.2/SHA256SUMS"
# minisig = "https://codeberg.org/jane/metronome-plus/releases/download/v1.4.2/SHA256SUMS.minisig"
# comment = "metronome-plus v1.4.2 SHA256SUMS"
#
# [core.packaged]
# platforms = ["desktop", "node", "ios", "web"]
# archive   = "https://codeberg.org/jane/metronome-plus/releases/download/v1.4.2/metronome-plus-1.4.2.archext"
# sha256    = "<its sha256>"
