[package]
name = "architect-dayplan"
description = "Day Plans, a first-party architect extension: Task's day templates as vault notes (time blocks in categories: three allocatable work/free-time blocks, meals, reset, sleep), rules that pick a day's template (weekday, RRULE, date range, an event's tag) with overrides, per-date plans whose blocks are given to a task, a project, a label or a recipe, and Task's resolver; a change reaches only today and after (extensions/dayplan)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "architect-dayplan"
path = "src/main.rs"

[dependencies]
# The trait and the guest (its process copy); the app adds `linked`.
architect-extensions = { workspace = true, features = ["guest"] }
# Its RRULEs (`architect_calendar::recur`).
architect-calendar = { workspace = true }
chrono = { workspace = true }
dioxus = { workspace = true }
futures-timer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
architect = { workspace = true, features = ["action-list"] }
architect-extensions = { workspace = true, features = ["host", "linked", "process"] }
architect-settings = { workspace = true }
# The app's side in a test: a vault's actions and Bases' over a folder.
architect-bases = { workspace = true, features = ["actions"] }
vault = { workspace = true, features = ["actions"] }
# The Time Tracker beside it, to test tracked time against a block.
architect-time-tracker = { workspace = true }
futures = "0.3"
tempfile = "3"

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../workspace-hack" }
