# architect — the entity/RPC framework, extracted from the FastTrackStudio
# monorepo into its own repo. ONE workspace, one lockfile, one target/.
#
# Every intra-repo dependency is declared once below as a path dep and
# consumed as `x.workspace = true`. External pins are copied verbatim from
# the FastTrackStudio root workspace so the two trees stay on the same
# facet/vox/dioxus fleet.

[workspace]
resolver = "2"
members = [
    # ── the umbrella crate ────────────────────────────────────────────
    "crates/architect",
    # ── core features ─────────────────────────────────────────────────
    "features/atom",
    "features/form",
    "features/input",
    "features/permissions",
    "features/permissions/proto",
    "features/mcp",
    "features/control",
    # ── proc-macros ───────────────────────────────────────────────────
    "crates/architect-derive",
    "crates/architect-rpc-derive",
    "crates/architect-action-derive",
    # ── the reference example ─────────────────────────────────────────
    "examples/greeter",
    "examples/scripting",
    "examples/extension/host",
    "examples/extension/counter",
    # ── apps ──────────────────────────────────────────────────────────
    "apps/auth-server",
    "apps/mock-oauth",
    # ── auth ──────────────────────────────────────────────────────────
    "features/auth/architect-auth",
    "features/auth/auth",
    "features/auth/auth-proto",
    "features/auth/auth-db",
    "features/auth/auth-client",
    "features/auth/auth-ui",
    "features/auth/tests/native",
    # ── crdt ──────────────────────────────────────────────────────────
    "features/crdt/crdt",
    "features/crdt/crdt-derive",
    "features/crdt/crdt-seaorm",
    "features/crdt/tests/derive",
    # ── ui ────────────────────────────────────────────────────────────
    "features/ui/architect-ui",
    "features/workspace",
    "features/commands",
    "features/settings",
    "features/settings/derive",
    "features/orgs",
    "features/scripting",
    "features/extensions",
    "features/extensions/wasi-guest",
    "features/extensions/archive",
    "features/extensions/tests/wasi-hazards",
    "features/canvas",
    "features/a2ui",
    "features/pages",
    "features/files",
    "features/attachments",
    "features/spaces",
    "features/ui/showcase",
    "features/ui/ui-snapshot",
    "features/shell",
    "features/theme",
    "features/theme/picker",
    "features/settings/sheet",
    "features/guide",
    "features/presence",
    "features/devices",
    "apps/lab/ui",
    "apps/lab/desktop",
    "apps/lab/mobile",
    "apps/lab/clicker",
    "apps/lab/board",
    "apps/lab/wasi-counter",
    "apps/lab/web",
    "apps/lab/media",
    # ── story (component workbench) ───────────────────────────────────
    "features/story/architect-story-core",
    "features/story/architect-story-macros",
    "features/story/architect-story-runtime",
    "features/story/architect-story-shell",
    "features/story/architect-story-snapshots",
    "features/story/architect-story-parity",
    "features/story/architect-story-fuzz",
    # ── telemetry ─────────────────────────────────────────────────────
    "features/telemetry",
    # ── launcher ──────────────────────────────────────────────────────
    "features/launcher/architect-launcher-core",
    "features/launcher/architect-launcher-ui",
    "features/launcher/architect-launcher-providers",
    # ── the fleet's feature union (hakari + `cargo xtask fleet-deps`) ──
    "workspace-hack",
    # ── repo tooling ──────────────────────────────────────────────────
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["FastTrack Studio"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/FastTrackStudios/architect"

[workspace.dependencies]
# The editor's extension surface as data (FastTrackStudios/editor's
# crates/editor-ext): what `architect-extensions`' editor calls carry, at
# FastTrackStudios/editor#28's head, like the rest of the editor below.
editor-ext = { git = "https://github.com/FastTrackStudios/editor", rev = "f8137a9326825361e2046254790758dc516caa44" }
# The editor's view, for the lab's note editor (native, on Blitz). Its
# source is patched to the pinned editor below, like Keyflow's.
editor-view = { git = "https://github.com/FastTrackStudios/editor", rev = "f8137a9326825361e2046254790758dc516caa44", default-features = false }
# SMTP for the auth server's verification and password-reset mail.
# rustls, not native-tls, so the build carries no OpenSSL dependency.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }
# ── Internal — every crate in this repo, path declared ONCE ───────────
architect = { path = "crates/architect" }
architect-atom = { path = "features/atom" }
architect-form = { path = "features/form" }
architect-input = { path = "features/input" }
architect-permissions = { path = "features/permissions" }
architect-permissions-proto = { path = "features/permissions/proto" }
architect-mcp = { path = "features/mcp" }
architect-control = { path = "features/control" }
architect-derive = { path = "crates/architect-derive" }
architect-rpc-derive = { path = "crates/architect-rpc-derive" }
architect-action-derive = { path = "crates/architect-action-derive" }
architect-auth = { path = "features/auth/architect-auth" }
auth-server = { path = "apps/auth-server" }
auth = { path = "features/auth/auth" }
auth-proto = { path = "features/auth/auth-proto" }
auth-db = { path = "features/auth/auth-db" }
auth-client = { path = "features/auth/auth-client" }
auth-ui = { path = "features/auth/auth-ui" }
crdt = { path = "features/crdt/crdt" }
crdt-derive = { path = "features/crdt/crdt-derive" }
crdt-seaorm = { path = "features/crdt/crdt-seaorm" }
# Renamed on extraction (member manifests + their consumers renamed to
# match): fts-ui → architect-ui, fts-story-* → architect-story-*,
# task-telemetry → architect-telemetry.
architect-ui = { path = "features/ui/architect-ui" }
architect-telemetry = { path = "features/telemetry" }
architect-ui-showcase = { path = "features/ui/showcase" }
ui-snapshot = { path = "features/ui/ui-snapshot" }
# guide media: scenarios as films, tests and tours.
architect-guide = { path = "features/guide" }
architect-presence = { path = "features/presence" }
architect-theme = { path = "features/theme" }
architect-theme-picker = { path = "features/theme/picker" }
architect-settings-sheet = { path = "features/settings/sheet" }
# story — the component workbench (stories, snapshots, parity, fuzz).
architect-story-core = { path = "features/story/architect-story-core" }
architect-story-macros = { path = "features/story/architect-story-macros" }
architect-story-runtime = { path = "features/story/architect-story-runtime" }
architect-story-shell = { path = "features/story/architect-story-shell" }
architect-story-snapshots = { path = "features/story/architect-story-snapshots" }
architect-story-parity = { path = "features/story/architect-story-parity" }
architect-story-fuzz = { path = "features/story/architect-story-fuzz" }
# launcher — the app launcher (core engine, providers, dioxus UI).
# Renamed on vendoring: launcher-core → architect-launcher-core,
# launcher-ui → architect-launcher-ui, providers →
# architect-launcher-providers.
architect-launcher-core = { path = "features/launcher/architect-launcher-core" }
architect-launcher-ui = { path = "features/launcher/architect-launcher-ui" }
architect-launcher-providers = { path = "features/launcher/architect-launcher-providers" }

# ── Facet reflection + vox RPC — the rc.7 fleet ───────────────────────
# Caret ranges: the version is a FLOOR, the lockfile holds the exact one.
# The fleet (architect, task, session, keyflow, fasttrackstudio) moves
# together because a vox client and server on different rcs fail the
# handshake ("schema decode consumed N of M bytes"); the rc.7 floor keeps
# every consumer of architect off the older ones.
facet = { version = "0.50.0-rc.7", features = ["reflect", "chrono", "uuid"] }
vox = { version = "0.10.0-rc.7", default-features = false, features = ["runtime"] }
vox-types = { version = "0.10.0-rc.7" }
vox-core = { version = "0.10.0-rc.7" }
# Styx config language (facet-backed) — the fleet's facet-styx.
facet-styx = { version = "5.0.0-rc.7" }
iroh = { version = "1" }
# LAN address lookup for iroh (mDNS-like, via swarm-discovery): lets two
# endpoints on one network dial each other by bare EndpointId with no
# internet. iroh 1.x moved mDNS out of core into this crate.
iroh-mdns-address-lookup = { version = "0.6.1" }

# ── Server / storage ──────────────────────────────────────────────────
axum = { version = "0.8", features = ["ws"] }
# `set-header`: the COOP/COEP pair that makes a served page
# cross-origin isolated (EngineHost::cross_origin_isolated) —
# SharedArrayBuffer, and so wasm threads, depend on it.
tower-http = { version = "0.6", features = ["fs", "set-header"] }
include_dir = "0.7"
sea-orm = { version = "1", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
sea-orm-migration = { version = "1", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
async-trait = "0.1"
# Local database engine for device persistence (crdt `turso`, atom
# `turso`). Default features off: `mimalloc` installs a global allocator,
# which is the host application's call, not a library's.
turso = { version = "0.8.3", default-features = false }
loro = { version = "1.12", default-features = false }

# ── Auth primitives ───────────────────────────────────────────────────
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
cookie = "0.18"
hkdf = "0.12"
jsonwebtoken = "9"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
# WebAuthn. `danger-allow-state-serialisation` lets the challenge state be
# held in the verification table between the two halves of a ceremony —
# which is the safe use it is named for: the state stays server-side and
# is never handed to the browser. `resident-key-support` +
# `conditional-ui` are what discoverable (usernameless) passkeys need.
webauthn-rs = { version = "0.5", features = [
    "danger-allow-state-serialisation",
    "resident-key-support",
    "conditional-ui",
] }

# ── UI framework ──────────────────────────────────────────────────────
# dioxus 0.8 line — git rev pinned (main 430cfb56, the 0.8.0-alpha.3 line);
# it must stay in lockstep across every dioxus-* entry AND the FTS fork tags
# of primitives, lucide and sdk (dioxus-sdk-time, through primitives), which
# pin the same rev, and the vendor fork's dioxus crates in the `[patch]`
# below.
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", default-features = false, features = ["lib"] }
dioxus-native = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", features = ["prelude", "system-fonts", "svg", "autofocus", "data-uri"] }
dioxus-native-dom = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
# Server-side rendering, for pages that must exist before the viewer has
# run any script — the auth server's sign-in and sign-up screens. Same
# pinned rev as the rest of the line.
dioxus-ssr = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
blitz-dom = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
# The workspace's pop-out windows drive Blitz's window views themselves
# (architect-workspace `native`), and serve the bundle's assets to them.
blitz-shell = "=0.3.0-beta.4"
# The windows' HTML parser: `dangerous_inner_html` makes nodes (architect-workspace `native`).
blitz-html = "=0.3.0-beta.4"
dioxus-asset-resolver = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
dioxus-devtools = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
dioxus-primitives = { git = "https://github.com/FastTrackStudios/dioxus-components", package = "dioxus-primitives", tag = "fts-upstream-2026-11", default-features = false }
lucide-dioxus = { git = "https://github.com/FastTrackStudios/lucide", tag = "fts-upstream-2026-11", features = ["all-icons"] }
clsx = "0.1.1"
tw_merge = "0.1.21"
nucleo-matcher = "0.3"
palette = "0.7.6"
linkme = "0.3"
architect-shell = { path = "features/shell", default-features = false }
architect-workspace = { path = "features/workspace" }
architect-commands = { path = "features/commands" }
architect-settings = { path = "features/settings" }
architect-settings-derive = { path = "features/settings/derive" }
architect-orgs = { path = "features/orgs" }
architect-scripting = { path = "features/scripting" }
architect-extensions = { path = "features/extensions" }
architect-extension-wasi = { path = "features/extensions/wasi-guest" }
architect-extension-archive = { path = "features/extensions/archive" }
architect-canvas = { path = "features/canvas" }
architect-a2ui = { path = "features/a2ui" }
architect-pages = { path = "features/pages" }
architect-files = { path = "features/files" }
architect-attachments = { path = "features/attachments" }
architect-devices = { path = "features/devices" }
architect-spaces = { path = "features/spaces" }
architect-lab-ui = { path = "apps/lab/ui" }
# iOS: the UIScene lifecycle the lab app adopts (apps/lab/mobile).
objc2 = "0.6"
objc2-ui-kit = "0.3"
futures-timer = "3"
# The platform's file pickers (architect-extensions `pickers`); blitz-shell
# builds it already, with these (default) features.
rfd = "0.17.2"

# ── Plugin framework (features/ui) ────────────────────────────────────
# The ONE sanctioned non-path exception in the monorepo; carried verbatim.
nice-plug = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
nice-plug-dioxus = { git = "https://github.com/FastTrackStudios/nice-plug.git", branch = "fts-baseview-03" }
atomic_float = "1.1"

# ── Rendering / snapshot gate (features/ui/ui-snapshot) ───────────────
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
peniko = "0.6"
kurbo = "0.13"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
dify = "0.8"
# Perceptual image diff — the story snapshot/parity gates score with it.
dssim-core = "3"

# ── Proc-macro toolkit ────────────────────────────────────────────────
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

# ── Async runtime ─────────────────────────────────────────────────────
tokio = { version = "1.48", features = ["full"] }

# ── Serialization ─────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
percent-encoding = "2"
# QR rendering for the two-factor enrolment page. Pure Rust, no image
# crate: the page draws SVG, so nothing is rasterised or base64-inlined.
qrcodegen = "1"
# Sign-In With Ethereum. `k256` recovers the signing key from a
# signature; `sha3` is keccak-256, which is what Ethereum hashes with
# (and is NOT the SHA-3 of the same name — the padding differs).
k256 = { version = "0.14", features = ["ecdsa"] }
sha3 = "0.12"
hex = "0.4"
serde_json = "1.0"
toml = "0.8"
# xtask fleet-deps: the resolver cargo-hakari uses, per platform.
guppy = "0.19"
thiserror = "2.0"
# `serde` because architect-launcher-core derives Serialize/Deserialize on
# `DateTime<Utc>` (history.rs, userdata.rs). Without it that crate only
# compiles when some other crate in the graph happens to turn the feature
# on — so it built in the full workspace and failed the moment anything
# depended on it in a narrower graph.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind", "serde"] }
fake = { version = "4", features = ["derive", "uuid", "chrono"] }

# ── Observability ─────────────────────────────────────────────────────
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", default-features = false, features = [
  "http-proto",
  # BLOCKING is deliberate: the SDK's batch processors run on their own
  # dedicated OS threads, which have no Tokio reactor — the async client
  # panics them with "there is no reactor running" on first flush.
  "reqwest-blocking-client",
  # Bundled Mozilla roots, not the OS's. `reqwest-rustls` turns on
  # reqwest's `rustls-tls-native-roots`, and features unify: EVERY
  # reqwest client the application builds then loads the platform's
  # trust store on construction — on macOS a `trustd` round trip
  # (`SecTrustSettingsCopyCertificates`) that takes seconds on a busy
  # machine, paid per client, on the boot path of anything that makes
  # an HTTP client per tenant. An OTLP exporter needs public roots only.
  "reqwest-rustls-webpki-roots",
  "trace",
  "logs",
  "metrics",
] }
opentelemetry-appender-tracing = "0.30"
tracing-opentelemetry = "0.31"
# Sentry error/crash telemetry — rustls (not native-tls) for iOS.
sentry = { version = "0.44", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-tracing = "0.44"

# ── Utilities ─────────────────────────────────────────────────────────
eyre = "0.6"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
clap = { version = "4", features = ["derive"] }
proptest = "1"

# ── Patches ───────────────────────────────────────────────────────────
[patch.crates-io]
# Blitz from the FTS fork: DioxusLabs/blitz main (0.3.0-beta.4+) with
# fts-focus (focus follows pointerdown), fts-pointer (touch as pointer
# events), the iOS safe-area and pacing work (BLITZ_SAFE_AREA=0: the page
# is the whole window; the safe area re-read every frame; a finger's tap
# slop), layered compositing of texture widgets, and fts-measure (a measure
# leaves an inline layout's lines as laid out); its FTS.md lists where it
# departs from upstream's tests. dioxus git pins `=0.3.0-beta.4`. One tag
# across all blitz crates, and anyrender (0.14 + the compositing seam)
# from the same tag.
blitz-dom = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-traits = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-paint = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-shell = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-net = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
blitz-html = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
anyrender = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
# The renderer and windowing forks a Blitz app needs (each one's reason is
# in vendor's README): Vello's window renderer and the compositor, the
# hybrid renderer's resize, Vello's surface on Metal, winit's UIKit
# backend, wgpu's Metal layer. Only the lab apps (apps/lab) reach the iOS
# ones.
anyrender_vello = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
anyrender_vello_hybrid = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
winit-uikit = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
wgpu-hal = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
raw-window-metal = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
# Vendored one-line fix: quote scalars containing `<`/`>` — upstream
# styx-format emits them bare but styx-parse rejects them.
styx-format = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.1.0" }
# The FastTrackStudios/vendor forks on the rc.7 fleet (each one's reason
# is in vendor's README). phon and facet-core carry their rc.7
# forward-ports from vendor v0.4.0; phon-jit and vox-phon were already on
# rc.7 at earlier tags.
#
# phon rc.7 + derive support for parse/display opaque scalars (Uuid,
# chrono DateTime/NaiveDate, url, …). Upstream PANICS the first time a vox
# RPC reply contains such a field.
phon = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.4.0" }
# phon-jit rc.7 with a build.rs fix: build the tail-call stencils on the
# pinned stable rustc (upstream's nightly detection misfires on it →
# E0658 on `become`).
phon-jit = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.2.3" }
# facet-core rc.7: chrono's display fns keep sub-second precision
# (upstream rounds every timestamp on every vox RPC to the second).
facet-core = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.4.0" }
# vox-phon rc.7 without the bogus post-decode length check: upstream fails
# every real schema exchange with "schema decode consumed N of M bytes".
vox-phon = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.3.0" }

# The Dioxus crates from the FTS vendor fork (each one's reason is in its
# UPSTREAM.md): dioxus-native — the iOS simulator's renderer, winit beta.4
# to match Blitz main; dioxus-native-dom — `text_input_focused`, focus and
# measurements that never panic on a busy document; dioxus-vdom (upstream's
# renamed dioxus-core) — a dropped handler's owner is not a panic, and a
# suspense boundary inside a still-suspended boundary's background does not
# write to the renderer (the core half of upstream #5668, Task#410: the
# wasm-split web build's blank pages).
[patch."https://github.com/DioxusLabs/dioxus"]
dioxus-native = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }
dioxus-native-dom = { git = "https://www.github.com/FastTrackStudios/vendor", rev = "25bf4bcdfd0b6acb268ca91a93bc8ff8da683a96" }
dioxus-vdom = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.1" }

# The editor, through Keyflow (the lab's Keyflow chart and source editor,
# `keyflow-lab`), at FastTrackStudios/editor#28's head (the extension
# surface, architect#312), which has #26's: #25 (a click past
# the end of a line puts the caret at its end on Blitz), and the editor's
# own Blitz/vendor pins moved to the IME revs architect pins below (its
# native_ime tests, and its dev shell on macOS). Keyflow pins the editor at
# 554b713; `www.` is the same repository under another source, as a patch
# needs. Drop this once Keyflow pins a merged editor that has it.
