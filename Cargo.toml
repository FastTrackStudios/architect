# ── Lints ─────────────────────────────────────────────────────────────
[workspace.lints.rust]
dead_code = "warn"
unused = "warn"
unused_unsafe = "warn"
# The derives emit `#[cfg(feature = "vox" | "server" | "fake")]` into
# consumer crates; a crate that declares none of them (an app, an
# example) should not warn about it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("vox", "server", "fake"))'] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"

[workspace.lints.clippy]
# ── The house style (namtao.com/rust) ─────────────────────────────────
# `priority = -1` so the individual `allow`s further down win over the
# group. Members opt in with `[lints] workspace = true` — a crate without
# that line inherits NOTHING, which is how the pre-existing allow-list
# below sat inert in `architect`, the three proc-macro crates, atom,
# form, auth, crdt and telemetry until 2026-09-09.
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# ── No panics in shipped code ─────────────────────────────────────────
# architect is a library that runs inside other people's processes — a
# REAPER extension, an audio pump thread, a long-lived server. A panic
# here is not a stack trace, it is a dead host. Tests are exempt via
# `clippy.toml`.
# The one lint from the set that is turned off, deliberately.
#
# architect's fallible APIs return typed `thiserror` enums whose variants
# carry their own docs (`RepoError`, `AuthFlowError`, `DispatchError`,
# `LayerPlanError`, …). `# Errors` fired on 230 functions, and the honest
# section for almost all of them is "returns the error type in the
# signature, whose variants are documented" — 230 copies of which makes
# the docs worse, not better, and buries the handful of methods that
# genuinely have something to say.
#
# `missing_panics_doc` stays ON: a function that CAN panic must say so,
# and after this cleanup there are few enough of those to keep honest.
missing_errors_doc = "allow"

# New in clippy 1.99 (pedantic). It wants `assert!(v.is_empty())` written
# as `assert_eq!(v, [])`, which for a `Vec<T>` needs `[] as [T; 0]` and
# then trips `as_conversions`. `assert!(v.is_empty())` reads fine.
assert_is_empty = "allow"

# The `async` on these is not the impl's to choose. Every site is either
# a trait method whose signature the trait owns (`Link::close`,
# `PermissionCheck::can`), or a repo-shaped inherent API whose callers
# must be able to `.await` it regardless of whether *today's* body
# happens to be synchronous — `LoroRepo::get`/`list` mirror the async
# `Repo` surface the derive emits. Dropping `async` would be a breaking
# change that also forbids the next implementation from awaiting.
unused_async_trait_impl = "allow"

# Fires on macro attribute structs (`ContainerAttrs`, `FieldAttrs`),
# Dioxus component props, and config builders. The lint's suggested fix
# is a state enum, which is right when the bools are mutually exclusive
# states — and wrong here, where they are independent, individually
# settable flags. Modelling `#[architect(primary_key, filterable,
# sortable, fulltext)]` as an enum would be a worse API, not a better one.
struct_excessive_bools = "allow"

# Counts lines, which in this tree measures the size of a *template*
# rather than the complexity of a function. Of the 21 sites it flagged,
# 18 are declarative emitters — proc-macro `quote!` builders
# (`architect-derive::build_*_block`, `architect-rpc-derive::emit_*`),
# SeaORM `create_tables`/`create_indexes` DDL, a theme-preset table, a
# story registry. Splitting those at the 100-line mark would cut a single
# template in half for no gain in readability.
#
# The three that are real control flow were reviewed individually;
# `architect_launcher_core::query::query_filtered` is the one worth an
# actual refactor, and it is a launcher concern, not a framework one.
too_many_lines = "allow"

unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

# ── Pre-existing per-lint relaxations (priority 0 — these win) ────────
field_reassign_with_default = "allow"
redundant_closure = "allow"
nonminimal_bool = "allow"
clone_on_copy = "allow"
useless_vec = "allow"
type_complexity = "allow"
manual_clamp = "allow"
needless_range_loop = "allow"
not_unsafe_ptr_arg_deref = "allow"
only_used_in_recursion = "allow"
unnecessary_sort_by = "allow"
unusual_byte_groupings = "allow"
manual_c_str_literals = "allow"
branches_sharing_code = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
collapsible_if = "allow"
map_clone = "allow"
unnecessary_map_or = "allow"
if_same_then_else = "allow"
redundant_locals = "allow"
large_enum_variant = "allow"
explicit_counter_loop = "allow"
manual_strip = "allow"
too_many_arguments = "allow"
double_must_use = "allow"
vec_init_then_push = "allow"
collapsible_match = "allow"
filter_next = "allow"

# ── Profiles ──────────────────────────────────────────────────────────
[profile.dev]
opt-level = 1

# Debuginfo discipline. Full DWARF was the single biggest cost in the
# monorepo: a `debug` test binary measured 1.62 GB, of which 98% was
# `.debug_*` sections, copied into every artifact on every relink.
#
#   line-tables-only  keeps file:line in backtraces + profiler symbols
#                     (samply/perf still work); drops variable/type DWARF,
#                     so a *debugger* can't inspect locals.
#   unpacked          leaves the remaining DWARF in the .o files under
#                     deps/ instead of copying it into each artifact.
#
# Need a real debugger session? Build with `--profile dev-dbg`.
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Escape hatch: full DWARF for stepping in gdb/lldb.
[profile.dev-dbg]
inherits = "dev"
debug = 2
split-debuginfo = "packed"

# dx web builds: native debuginfo in the wasm module blows past Chrome's
# 1 GiB WebAssembly module cap. Wasm dev builds don't need it.
[profile.wasm-dev]
inherits = "dev"
debug = false
strip = "debuginfo"

[profile.wasm-dev.package."*"]
opt-level = 3

# ── Dependencies: the fleet's settings ──
# Everything from here to the end of the profiles is the fleet's dev
# profile for DEPENDENCIES, the same in architect, Task, studio, keyflow
# and frame (skills/architect/references/xtask-tooling.md, "Fleet
# toolchain"). kache keys a crate on its opt-level and debuginfo, and on
# the bytes of every crate it links against, so one differing line here
# rebuilds that crate and everything above it in each repo instead of
# sharing one build.
#
# Opt-level 1: gets rid of the pathological O0 debug codegen at a fraction
# of the compile cost. No debuginfo: a backtrace through a dependency still
# names the function, and our own crates keep `line-tables-only` (above).
# Applies to dependencies only: workspace members are governed by
# profile.dev's base opt-level.
[profile.dev.package."*"]
opt-level = 1
debug = false

# Full DWARF for dependencies too in the debugger profile.
[profile.dev-dbg.package."*"]
debug = 2

# Dependencies kept at opt-level 3: the crates that run per sample or per
# frame. phon is vox's JIT DSP engine; the rest is studio's list (audio
# path, the Blitz/Vello renderer and the Dioxus core under it), kept here
# for the crates this tree also builds.
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.phon]
opt-level = 3
[profile.dev.package.phon-engine]
opt-level = 3
[profile.dev.package.phon-jit]
opt-level = 3
[profile.dev.package.num-complex]
opt-level = 3
[profile.dev.package.dioxus-core]
opt-level = 3
[profile.dev.package.dioxus-native-dom]
opt-level = 3
[profile.dev.package.blitz-dom]
opt-level = 3
[profile.dev.package.blitz-paint]
opt-level = 3
[profile.dev.package.blitz-shell]
opt-level = 3
[profile.dev.package.blitz-traits]
opt-level = 3
[profile.dev.package.anyrender]
opt-level = 3
[profile.dev.package.anyrender_vello]
opt-level = 3
[profile.dev.package.vello]
opt-level = 3
[profile.dev.package.vello_encoding]
opt-level = 3
[profile.dev.package.wgpu]
opt-level = 3
[profile.dev.package.wgpu-core]
opt-level = 3
[profile.dev.package.wgpu-hal]
opt-level = 3
[profile.dev.package.naga]
opt-level = 3
[profile.dev.package.stylo]
opt-level = 3
[profile.dev.package.selectors]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
[profile.dev.package.parley]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.fontique]
opt-level = 3
[profile.dev.package.peniko]
opt-level = 3
[profile.dev.package.kurbo]
opt-level = 3

# Build scripts + proc macros and their deps. `package."*"` does NOT cover
# these — cargo routes them through build-override, where they land at
# opt-level 0 with full debuginfo. This tree IS proc-macros (facet,
# architect, dioxus rsx), executed thousands of times per build.
[profile.dev.build-override]
opt-level = 3
debug = false

