[package]
name = "architect"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Facet-native, vox-friendly entity framework. One #[derive(Entity)] → wire types + SeaORM Model + auto-generated repo trait, all in one source struct."
repository.workspace = true

# `architect` is the user-facing crate. It re-exports the derive macro
# from `architect-derive`, and provides the runtime traits / helper
# types the macro's output references (`RepoError`, `CrudStorage`, etc).
#
# Wasm-clean by default. The `server` feature pulls in sea-orm + the
# server-side storage glue so the same `#[derive(Entity)]` user struct
# also gets a full ORM-backed repository implementation.

[features]
# architect itself stays minimal. Feature crates (e.g. example-proto)
# pull `architect/vox` when they want the RPC stack so the choice
# happens at the contract crate's level, not by accident.
default = []
# `dep:tracing` rides along because `permissions_gate` — which is on
# whenever `vox` is — reports its coverage through `tracing` at wrap
# time. A gate that can only tell you about its blind spots when some
# *other* feature happens to have pulled a logger is not much of a gate.
vox = ["dep:vox", "dep:tracing", "dep:async-channel"]

# Client-side optimistic / stale-while-revalidate state for Dioxus,
# re-exported as `architect::atom`. Pulls Dioxus (via architect-atom), so
# it's off by default and left out of `full` — server builds never see it.
# UI crates may also depend on `architect-atom` directly. See
# `docs/content/architecture/optimistic.md`.
atom = ["dep:architect-atom"]
# Device persistence for atom stores (`architect::LocalRows`,
# `use_persisted_store_list`, the durable `CallQueue` +
# `Mutation::run_queued`), with memory and browser `localStorage`
# backends. See architect-atom's `persist` feature.
atom-persist = ["atom", "architect-atom/persist"]
# …plus `architect::TursoRows`, the native backend over a local Turso
# database (local engine only). Compiles to nothing on wasm.
atom-turso = ["atom-persist", "architect-atom/turso"]

# Typed, validated form state for Dioxus, re-exported as `architect::form`
# (effect-form analog). Pulls Dioxus via architect-form + architect-atom;
# off by default, left out of `full`. See
# `docs/content/architecture/forms.md`.
form = ["dep:architect-form", "atom"]

# Adds #[derive(fake::Dummy)] to every architect-emitted struct
# (Create/Update/List/Model). Pure test-data scaffolding; enable it
# in your proto crate and the wire structs become trivially seedable.
fake = ["dep:fake"]

# `full` enables every architect optional — vox, SeaORM bridge, axum
# adapter, fake. Matches tokio's `full` convention: when you just want
# everything turned on for development or a single-binary build.
full = ["vox", "server-seaorm", "server-axum", "fake", "platform", "schedule", "rt"]

# Platform layer (`architect::platform`): a `Clock` (async `sleep` + `now`)
# and task `spawn`, abstracted native (tokio) <-> wasm (browser timers).
# Centralizes the cfg-split scattered across resource/local/axum_ws and
# ships a deterministic `TestClock` for testable scheduled code.
#
#   native  tokio::time / tokio::task::spawn (needs a running tokio rt)
#   wasm    gloo-timers TimeoutFuture / wasm_bindgen_futures::spawn_local
#
# `web-time` provides a monotonic `Instant` on both targets.
platform = ["dep:web-time", "dep:async-channel", "tokio/time", "tokio/rt", "dep:gloo-timers", "dep:wasm-bindgen-futures", "dep:tracing"]

# Schedule layer (`architect::schedule`): composable retry/repeat policies
# (exponential backoff, jitter, caps, recurrence limits) + drivers that run
# a plain `async FnMut() -> Result` under them. Implies `platform` (it sleeps
# between attempts through a `Clock`).
# Kept as an alias so `features = ["schedule"]` still resolves. The
# module itself is now gated on `platform`: `reconnect::Backoff` is a
# `Schedule` preset, so the layer is no longer optional relative to it,
# and "opt in to get retry policies" was a feature nothing in the fleet
# ever opted into while fifteen files hand-rolled their own backoff.
schedule = ["platform"]

# Two server-side features, deliberately independent so a binary can
# pick storage and transport à la carte:
#
#   server-seaorm   the SeaORM bridge — pulls sea-orm + async-trait,
#                   exposes `architect::storage::DbConn`, and lets the
#                   derive emit `<T>RepoStorage<C>`.
#
#   server-axum     the axum WebSocket adapter — pulls axum + tokio +
#                   futures + tracing + vox-core + vox-types, exposes
#                   `architect::axum_ws::{AxumWsLink, serve, ...}`.
#
# A consumer that brings its own repo impl (or fronts a remote API)
# enables `server-axum` only and never compiles sea-orm.

# Rig-backend glue (`architect::rig`): the `RigBackend` trait — provided
# `router()`, the sliding event hub, and the shared meter/status pump
# (interval + once-guard + running-edge + MIDI hot-plug rescan) that every
# instrument-rig backend serves through. Native only (the pump is an OS
# thread).
rig = ["vox", "dep:tracing"]

# In-process transport (`architect::local`): serve a `LayerRouter` over a
# vox in-memory link so a typed client consumes a local backend with no
# server/socket. Native serves over `vox_core::memory_link_pair`; wasm over
# architect's own `memory_link` (vox's `MemoryLink` is `#[cfg(not(wasm))]`),
# with the server task on `platform::spawn` (spawn_local). Pulls `platform`
# + vox-types (for the wasm `Link` impl).
local = ["vox", "dep:vox-core", "dep:vox-types", "dep:tracing", "tokio/rt", "platform"]

# Client-side connection establishment (`architect::connect`) — the twin
# of `server-axum`'s `axum_ws::serve`. One connection per
# (endpoint, identity), single-flighted, liveness-checked; typed clients
# are cheap views over its caller.
#
# Target-split under the hood: `tokio-tungstenite` natively,
# `web-sys`/`js-sys` in the browser. Both ride `vox-websocket`.
connect = [
  "vox",
  "dep:vox-core",
  "dep:vox-websocket",
  "dep:tracing",
  "dep:tokio-tungstenite",
  "dep:wasm-bindgen",
  "dep:web-sys",
  "dep:js-sys",
  "platform",
]

# iroh p2p transport (`architect::iroh_link`): serve/consume a vox
# router over an iroh QUIC endpoint — same acceptor dance as `server-axum`,
# but the "socket" is a bi-directional QUIC stream reachable by bare
# EndpointId across networks (n0 relays + address lookup). The client
# side (connect / IrohLink / iroh_link_source) also compiles on wasm32 —
# browsers dial relay-only over WebSockets; serving is native only.
# `tokio/rt` (not rt-multi-thread) so the wasm build stays legal; the
# native server fns spawn onto whatever runtime the consumer provides.
iroh = [
    "vox",
    "dep:iroh",
    "tokio/rt",
    "dep:tracing",
    "dep:vox-core",
    "dep:vox-types",
]
# LAN peer discovery for `iroh_link` (`PeerLookup::Lan` /
# `PeerLookup::N0AndLan`): mDNS-style address lookup so endpoints on one
# network dial each other by bare EndpointId with the internet down.
# Native only (multicast UDP); a no-op on wasm32, where browsers dial
# relay-only.
iroh-lan = ["iroh", "dep:iroh-mdns-address-lookup"]

server-seaorm = ["dep:sea-orm", "dep:sea-orm-migration", "dep:async-trait"]
server-axum = [
    "dep:axum",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "dep:tracing",
    "dep:vox-core",
    "dep:vox-types",
    "telemetry",
]

# One `tracing` span per dispatched RPC call, at the LayerRouter choke
# point (see `LayerRouter::call_span`). Without it a served WebSocket is
# one opaque span and the calls inside it are invisible; with it every
# call is named, timed, and correlatable with the logs it emits.
#
# Implied by `server-axum` — anything serving RPC over the network wants
# this, and that feature already pulls `tracing`. Separate so an
# in-process router (a DAW dispatcher, a wasm LocalServer) can opt in or
# stay out. Costs a disabled-span check per call when no subscriber is
# installed.
telemetry = ["vox", "dep:tracing"]

# ── Umbrella features — the two common consumer profiles ─────────────
#
# À la carte features stay for fine-grained builds; these are the
# one-liners an app crate reaches for. See
# docs/content/architecture/features.md for the full matrix.
#
#   client   what a UI (wasm or desktop shell) crate wants: typed RPC
#            clients (vox) + optimistic store hooks (atom) + validated
#            form state (form). Wasm-clean.
#
#   server   what a native server binary wants: RPC (vox) + the SeaORM
#            storage bridge + the axum WS transport + the tokio
#            blocking dispatcher. Strict superset of the old
#            `server = ["server-seaorm"]` back-compat alias, so
#            consumers that wrote `features = ["server"]` keep working.
client = ["vox", "atom", "form"]
server = ["vox", "server-seaorm", "server-axum", "dispatch-tokio", "http"]

# The HTTP+JSON face (`architect::http`): the axum router the rpc derive
# emits per service (`http::router(backend)`), the `Call<Args>` extractor,
# the `ErrorBody` envelope and the `BindHttp` / `HttpLayer` composition
# twins of `Bind` / `Layer`. Pulls axum + facet-json. Implied by `server`
# and `host` — anything serving vox over a socket wants the same services
# reachable by a plain `fetch`.
http = ["dep:axum", "dep:facet-json", "dep:async-channel"]

# The Action List (`architect::action::ActionList`): the one registry
# every key, menu, CLI and MCP server runs an app's commands through,
# typed by facet and described as JSON Schema (`architect::schema`).
# Pulls facet-json, and facet-value (`ActionList::validate` reads the
# schemas back).
action-list = ["dep:facet-json", "dep:facet-value", "dep:tracing"]

# The typed HTTP client the rpc derive emits per service
# (`<Trait>HttpClient`), over `reqwest` — native and wasm (`fetch`).
# Implied by `client`.
http-client = ["dep:reqwest", "dep:facet-json"]

# `architect::host` — assemble a headless vox engine binary from a router:
# the multi-thread runtime, tracing + panic-logger bootstrap, and an
# `EngineHost` that serves a `LayerRouter` over `/vox` (+ `/health`, optional
# iroh, optional static SPA bundle). Native only — folds the boilerplate every
# engine binary otherwise repeats. Add `iroh` alongside for p2p serving.
host = [
    "server-axum",
    "http",
    "dep:tracing-subscriber",
    "dep:tower-http",
    "dep:include_dir",
]

# Dispatcher impls (see `architect::dispatch`). The current-thread
# dispatcher is always available; runtime-specific impls are gated.
#
#   dispatch-tokio   spawn_blocking-backed dispatcher. Right for
#                    server-side binaries wrapping sync work behind an
#                    async service.
dispatch-tokio = ["tokio/rt-multi-thread"]

# Real-time publisher bridge (`architect::rt`): a wait-free SPSC ring
# (rtrb) for handing events from a real-time thread (audio callback,
# device ISR) to a normal thread that fans them out via `PubSub`.
# `PubSub::publish` itself takes a mutex and must NEVER run on a
# real-time thread — this feature is the sanctioned escape hatch.
rt = ["dep:rtrb"]

# Capability tokens (`architect::capability`): Ed25519-signed, expiring
# `purpose|expiry|subject` grants for signed URLs and the like, plus a
# `ServerKeypair` that loads or creates a 0600 key file. Native only (a key
# file and the OS random source).
capability = ["dep:ed25519-dalek", "dep:base64", "dep:getrandom", "dep:zeroize"]

# Blob lane (`architect::blob`): `ResumableFetch` (`.part` resume, sha256
# verify, `<file>.sha256` sidecar skip, atomic rename, one transfer per
# file) and the content-addressed `BlobStore` trait with its `LocalFs`
# backend. Native only for now; the wasm OPFS ledger is a follow-up.
blob = ["dep:sha2"]

# Signed self-update (`architect::release`): check GitHub Releases for a
# newer `<prefix>X.Y.Z`, verify the minisign signature over `SHA256SUMS`
# with the release key the app compiles in, the asset's sha256, a
# `--version` smoke test, then an atomic rename over the running binary
# and an optional `--then` hook. Native only. Reuses `blob::Sha256`.
release = [
    "blob",
    "dep:minisign-verify",
    "dep:reqwest",
    "dep:facet-json",
    "dep:tempfile",
    "tokio/process",
    "tokio/time",
]

# Snapshot quiesce (`architect::snapshot`): `WriteGate` (bounded hold,
# default 30 s), `GatedLayer` / `LayerRouter::gated` parking vox calls at
# the gate, `quiesce` (pause -> checkpoint -> step), and with
# `server-seaorm` the sqlite `wal_checkpoint` callback. Native only.
snapshot = ["vox", "tokio/time", "dep:tracing"]

# Blocking client facade (`architect::sync_client` + the emitted
# `<Trait>SyncClient`s): drive the async vox client from sync code over
# a background tokio runtime. Native only — wasm has no blocking.
sync-client = ["vox", "tokio/rt"]

# App settings on the device (`architect::settings`): `Store<T>`, one
# facet value as JSON in the app's config dir (`$<APP>_CONFIG_DIR`
# override; atomic write-then-rename, skipped when unchanged; optional
# 0600) or `localStorage` on wasm, and `FileKv`, the directory-of-files
# key/value store under it. With `atom-persist` too, `FileKv` implements
# architect-atom's `Kv`, so `KvRows<FileKv>` is a native `LocalRows`.
settings = ["dep:facet-json", "dep:dirs", "dep:web-sys"]

# Test support for an app's own test binaries (`architect::testing`).
# Both are for `[dev-dependencies]` only.
#
#   testing-alloc  `testing::alloc::Counting`, a counting `GlobalAlloc`, and
#                  its readings (live, peak). std only. architect never
#                  installs it; a test binary opts in with
#                  `#[global_allocator]`.
#   testing        the sandbox boot: `testing::sandbox_server(seed)` points
#                  HOME and the XDG/AppData dirs inside a tempdir under one
#                  process-wide env lock, then serves the seeded app on
#                  127.0.0.1:0. Native only; pulls `host` + tempfile.
testing-alloc = []
testing = ["testing-alloc", "host", "dep:tempfile"]

[dependencies]
architect-derive.workspace = true
architect-permissions.workspace = true
architect-rpc-derive.workspace = true
architect-action-derive.workspace = true
facet.workspace = true
thiserror.workspace = true
# Resource handles (`architect::handle`): the id behind `RawHandle`.
# Wasm-clean (v4 generation needs the consumer to wire getrandom's js
# backend on wasm32, same as every other uuid-minting wire crate here).
uuid = { workspace = true, features = ["js"] }

# Optional client-state primitive, re-exported as `architect::atom` under
# the `atom` feature. Pulls Dioxus, so it stays optional + off by default.
architect-atom = { workspace = true, optional = true }
# Optional form-state primitive, re-exported as `architect::form` under the
# `form` feature.
architect-form = { workspace = true, optional = true }

# Construction layer (`architect::resource`): the default error type for
# `Resource<T, E = eyre::Report>`, and a `sync`-only tokio for the async
# `OnceCell` that backs memoization. `sync` is wasm-safe; the runtime
# features (rt-multi-thread/macros) are added by `server-axum` /
# `dispatch-tokio` so the wasm client never pulls a non-wasm runtime.
eyre.workspace = true
# Direct (not workspace) so we get sync-only — the workspace tokio pins
# rt-multi-thread, which doesn't build on wasm32. server-axum /
# dispatch-tokio add the runtime features on top for native builds.
tokio = { version = "1", default-features = false, features = ["sync"] }

# Vox RPC stack — optional. When the `vox` feature is off, the macro
# emits a plain async trait instead of a `#[vox::service]`-decorated one,
# and the dispatcher/client types simply don't exist.
vox = { workspace = true, optional = true }
fake = { workspace = true, optional = true }

# Wait-free SPSC ring backing `architect::rt` — the audio-world standard
# (powers cpal-adjacent stacks). Optional; only the `rt` feature pulls it.
rtrb = { version = "0.3", optional = true }

# Platform layer. `web-time` gives a monotonic `Instant` that works on
# both native and wasm (std on native, performance.now() on wasm). The
# native timer/spawn path rides the base `tokio` dep (the `platform`
# feature adds `tokio/time` + `tokio/rt`); the wasm path uses the
# target-cfg deps below.
web-time = { version = "1", optional = true }
# Runtime-agnostic MPMC channel backing `platform::Queue` — wasm-clean
# (no executor assumptions), unlike tokio's single-consumer mpsc. The
# rest of `platform`'s primitives (Deferred/Semaphore/CancellationToken)
# ride tokio's `sync` (already in the base dep).
async-channel = { version = "2", optional = true }

# Server-side only — sea-orm + async-trait are gated.
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }

# server-axum bundle. All optional; only pulled when the feature is on.
axum = { workspace = true, optional = true }
# Required: the HTTP facade's `EventStream` is a `futures::Stream` in
# every configuration, so the derive-emitted clients have one shape.
futures = "0.3"
tracing = { workspace = true, optional = true }

# `host` bundle — the engine-binary bootstrap. All optional; only the `host`
# feature (native engine binaries) pulls them, so the wasm client never sees
# a global subscriber init or a static-file server.
tracing-subscriber = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
include_dir = { workspace = true, optional = true }
vox-core = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }
vox-websocket = { version = "0.10.0-rc.5", optional = true }
facet-json = { version = "0.50.0-rc.5", optional = true }
facet-value = { version = "0.50.0-rc.7", optional = true }
# `default-features = false` keeps the wasm build free of the native TLS
# and blocking stacks; the browser target goes through `fetch` anyway.
reqwest = { version = "0.12", default-features = false, features = ["stream"], optional = true }

# iroh p2p bundle. Only pulled by the `iroh` feature. Target-split
# because iroh's defaults (portmapper etc.) don't build on wasm32: the
# native side rides the workspace dep, the wasm side takes the same
# version with defaults off + a TLS provider (relay-only in browsers).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `http::ranged::{serve_file, reader_body}` stream a file / an AsyncRead
# as a response body. Native only: tokio refuses `fs` on wasm32.
tokio = { version = "1", default-features = false, features = ["fs", "io-util"] }
# `capability` bundle. ed25519-dalek 3 is already in the graph through iroh.
ed25519-dalek = { version = "3", optional = true }
base64 = { workspace = true, optional = true }
getrandom = { version = "0.3", optional = true }
zeroize = { version = "1", optional = true }
# `blob`: sha256 of every transfer and stored blob (already in the graph
# through auth).
sha2 = { workspace = true, optional = true }
iroh = { workspace = true, optional = true }
iroh-mdns-address-lookup = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
# `connect`'s native dial. Native builds its own handshake request so the
# bearer can ride an `Authorization` header.
# Must track `vox-websocket`'s own tungstenite: `WsLink::new` takes
# that crate's stream type, so a version skew is a type mismatch.
tokio-tungstenite = { version = "0.29", optional = true }
# `settings`: the platform config dir behind `settings::app_dir`.
dirs = { version = "6", optional = true }
# `testing`: the sandbox's tempdir; `release`: the staged binary.
tempfile = { version = "3", optional = true }
# `release`: verify the release key's signature over `SHA256SUMS`
# (no dependencies of its own; Task's self-update already used it).
minisign-verify = { version = "0.2", optional = true }

# Wasm-only platform deps. Browser timers (gloo-timers' `TimeoutFuture`
# is a real async sleep backed by setTimeout) and `spawn_local` for the
# `spawn` primitive. Both optional, pulled by the `platform` feature.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", default-features = false, features = ["futures"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
# `connect`'s browser dial. A browser cannot set request headers, so the
# bearer rides the subprotocol list — see `connect::ws`.
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3.98", features = ["WebSocket", "BinaryType", "Event", "CloseEvent", "MessageEvent", "Window", "Storage"], optional = true }
js-sys = { version = "0.3", optional = true }
iroh = { version = "1", default-features = false, features = ["tls-ring"], optional = true }

[dev-dependencies]
futures-lite = "2"
# The reconnect-supervisor integration test mounts a headless VirtualDom
# over the in-process vox transport (LocalServer) and kills/recreates the
# server side. Same minimal dioxus profile as architect-atom.
dioxus = { workspace = true }
vox-core = { workspace = true }
vox-types = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# rpc_spans.rs installs a capturing subscriber to assert the dispatch span.
tracing-subscriber = { workspace = true }
# http_face.rs drives the generated axum router in-process (`oneshot`).
tower = { version = "0.5", features = ["util"] }
# settings_*.rs, capability.rs and blob.rs: a throwaway directory per test.
tempfile = "3"
# release.rs: the fake releases server, and a test signer that writes
# minisign signatures (Ed25519 over the BLAKE2b-512 prehash).
axum = { workspace = true }
ed25519-dalek = "3"
blake2 = "0.10"
base64 = { workspace = true }

