# `cargo xtask boundaries`: the layer table for docs/content/architecture/layout.md.
#
# A feature is one crate; its roles are cargo features. Each [[row]] is a
# package resolved with a feature set (`cargo tree -p <package>`, so cargo's
# per-package resolution), checked at its layer:
#
#   L0  contract (default set, `vox`): resolved for `contract-target`, must not
#       reach [forbidden] engine / ui packages, a tokio runtime, or a
#       transport-host / server `architect` feature.
#   L4  ui: must not reach engine packages or a transport-host / server
#       `architect` feature. Dioxus and `architect/client` are fine.
#   L1-L3 rows are recorded (and keep `unmapped` honest) but not constrained.
#
# Workspace-wide rules: no member outside `host-dirs` enables a transport host
# in its default set; every member has `[lints] workspace = true`; Cargo.lock
# has one source for every `single-source` package; every non-proc-macro
# crate under features/ has a row here.
#
# Sibling crates that predate the one-crate ADR (auth-*, launcher-*,
# crdt-seaorm, permissions/proto) keep explicit rows until they fold in.
#
# [baseline] holds today's count per rule. A count above it fails; a count
# below it fails until you lower it here, so numbers only go down.

contract-target = "wasm32-unknown-unknown"
host-dirs = ["apps"]
unmapped-ok = ["features/auth/tests", "features/crdt/tests"]
single-source = ["architect", "architect-*", "auth", "auth-*", "crdt", "crdt-*", "ui-snapshot"]

[forbidden]
engine = [
    "sea-orm", "sea-orm-migration", "sqlx", "rusqlite", "libsql", "turso",
    "axum", "tower-http", "iroh", "tokio-tungstenite",
]
ui = ["dioxus", "dioxus-core", "dioxus-web", "dioxus-desktop", "blitz-dom", "vello"]
tokio-runtime = ["rt", "rt-multi-thread"]
transport-host = ["host", "server", "server-axum", "http", "iroh", "dispatch-tokio"]
architect-server = ["server-seaorm"]

[baseline]
# 2026-10-21 first run. ui-reach: auth-ui pulls the auth server stack (7);
# story fuzz/parity/snapshots and ui-snapshot reach tower-http (4).
# transport-host: auth-ui (server-axum), example-greeter (host, http,
# server-axum). lints: architect-mcp.
ui-reach = 11
transport-host = 4
lints = 1

