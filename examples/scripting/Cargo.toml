[package]
name = "example-scripting"
version.workspace = true
edition.workspace = true
publish = false
description = "Architect's scripting API in one small crate: a task board's actions, Luau scripts that drive them as one undo step, a saved script as its own action, and an agent doing the same over MCP."

[dependencies]
architect = { workspace = true, features = ["action-list"] }
# `luau` is the runtime and the SCRIPT_* actions; `crdt` makes a run one
# step of the board's `crdt::History`.
architect-scripting = { workspace = true, features = ["luau", "crdt"] }
architect-mcp = { path = "../../features/mcp" }
# `scripting actions …` and `scripting serve`: the board from the command
# line, the same as over MCP.
architect-control = { workspace = true, features = ["server", "cli"] }
architect-permissions.workspace = true
crdt.workspace = true
facet.workspace = true
futures = "0.3"
serde_json.workspace = true

[dev-dependencies]
architect-mcp = { path = "../../features/mcp", features = ["parity"] }

[[bin]]
name = "scripting"
path = "src/main.rs"

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../workspace-hack" }
