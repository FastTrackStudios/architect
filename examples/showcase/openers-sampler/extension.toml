# The showcase's Openers sampler (#710: C6, C7, C8): a ⌘O source (the
# showcase's capability notes by id), a URL it claims, a project type, a
# capture target and a base view type.
id = "showcase.openers"
name = "Openers sampler"
version = "0.1.0"
kind = "luau"
api = "0.1"
description = "A ⌘O source (`show:` finds a capability note by its id), links it opens, a Showcase project type, a capture target and a Checklist base view. Stands in for Homepage, Omnisearch's ⌘O, QuickAdd's captures and Bases view plugins."
authors = ["FastTrackStudios"]

[capabilities]
actions = ["VAULT_LIST", "VAULT_CREATE"]
# host.open: a note, opened as a person would.
reads = ["documents"]
effect = "mutating"

[[actions]]
id = "SHOWCASE_OPENERS_FIND"
name = "Openers sampler: find"
description = "The showcase's capability notes whose id or title has `query`'s words: {items: [{id, label, detail, group}]}."
group = "Showcase"
params = '{"type":"object","properties":{"query":{"type":"string"}}}'
script = "find.luau"

[[actions]]
id = "SHOWCASE_OPENERS_GO"
name = "Openers sampler: open"
description = "Opens capability note `id` (its vault path)."
group = "Showcase"
params = '{"type":"object","properties":{"id":{"type":"string"}},"required":["id"]}'
script = "go.luau"

[[actions]]
id = "SHOWCASE_OPENERS_URL"
name = "Openers sampler: open a link"
description = "Opens a showcase link (https://showcase.example/<capability id>) as that capability's note."
group = "Showcase"
params = '{"type":"object","properties":{"url":{"type":"string"}}}'
script = "url.luau"

[[actions]]
id = "SHOWCASE_OPENERS_CAPTURE"
name = "Openers sampler: capture a capability note"
description = "The `capability` capture target's action: a note in Inbox/ from a capture's {title, body}."
group = "Showcase"
effect = "mutating"
params = '{"type":"object","properties":{"title":{"type":"string"},"body":{"type":"string"}},"required":["title"]}'
script = "capture.luau"

# ⌘O and the palette: `show:` asks only it.
[[palette_sources]]
id = "show"
title = "Showcase"
action = "SHOWCASE_OPENERS_FIND"
run = "SHOWCASE_OPENERS_GO"
ranking = "open"

# Links it opens inside the app.
[[openers]]
id = "link"
title = "Showcase link"
urls = ['^https://showcase\.example/[A-Z][0-9]+$']
action = "SHOWCASE_OPENERS_URL"

[[project_types]]
id = "showcase"
name = "Showcase"
icon = "presentation"
description = "A demo: the capabilities it shows and where it runs."
properties = [
    { key = "capabilities", name = "Capabilities", kind = "list" },
    { key = "platforms", name = "Platforms", kind = "list" },
]
template = "templates/showcase.md"

[[capture_targets]]
id = "capability"
name = "Capability note"
icon = "puzzle"
description = "A note about a capability, in Inbox/."
action = "SHOWCASE_OPENERS_CAPTURE"
chips = ["tags"]

# A base's view of `type: checklist`: its rows as a checklist, done when
# a row's `status` is done.
[[base_views]]
id = "checklist"
name = "Checklist"
icon = "list-checks"
page = "pages/checklist.tsx"
options = [{ key = "doneWhen", name = "Done when status is", kind = "text", default = '"done"' }]
