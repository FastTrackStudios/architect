# The showcase's Services sampler (#710: H12): Calendar, Day Plans and
# Tasks called through their services, which it [requires]: it loads only
# with them, after them.
id = "showcase.services"
name = "Services sampler"
version = "0.1.0"
kind = "luau"
api = "0.1"
description = "Today from Calendar, Day Plans and Tasks through their services ([requires]), and a task and an event made through them. Stands in for Day Planner, Calendar and Tasks integrations, and Health's meal plans (#371)."
authors = ["FastTrackStudios"]

[requires]
"architect.calendar" = "^0.1"
"architect.dayplan" = "^0.1"
"architect.tasks" = "^0.1"

[capabilities]
effect = "mutating"
ui = ["notify"]

[[actions]]
id = "SHOWCASE_SERVICES_TODAY"
name = "Services sampler: today"
description = "Today's events, day plan and tasks, each from its extension's service, said in a toast. Answers {events, blocks, tasks}."
group = "Showcase"
script = "today.luau"

[[actions]]
id = "SHOWCASE_SERVICES_PLAN"
name = "Services sampler: plan"
description = "Makes a task (`title`) through Tasks and an event at `start` (today at 15:00 when left out) through Calendar. Answers both."
group = "Showcase"
effect = "mutating"
params = '{"type":"object","properties":{"title":{"type":"string"},"start":{"type":"string"}}}'
script = "plan.luau"
