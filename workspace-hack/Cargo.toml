# architect's workspace-hack: every member depends on it (under a gate:
# off on wasm and under `--cfg no_workspace_hack`), so every crate below
# builds with one feature set in every member, and, because consumers
# depend on architect, in every fleet repo (Task, studio, keyflow, frame).
# kache then shares one build of each across the fleet. See
# `skills/architect/references/xtask-tooling.md`, "Fleet feature union".
#
# Two generated sections, each regenerated, never edited by hand:
# - HAKARI: this workspace's union. `cargo hakari generate` after a
#   dependency change; `cargo hakari manage-deps` gives a new member its
#   line, then `cargo xtask fleet-deps` gates it.
# - FLEET: the consumers' features on top. `cargo xtask fleet-deps --repo
#   ../task --repo ../studio --repo ../keyflow --repo ../frame`, after
#   `cargo hakari generate`.

[package]
name = "architect-workspace-hack"
version = "0.1.0"
edition.workspace = true
description = "workspace-hack package, managed by hakari and cargo xtask fleet-deps"
# A git dependency of the consumers; never published.
publish = false

[lints]
workspace = true

