[package]
name = "auth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
architect-permissions.workspace = true
auth-proto.workspace = true
auth-db = { workspace = true, optional = true }
architect = { workspace = true, optional = true }
async-trait.workspace = true
argon2.workspace = true
axum = { workspace = true, optional = true }
base64.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
cookie.workspace = true
hkdf.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
sha2.workspace = true
sha1.workspace = true
thiserror.workspace = true
totp-rs.workspace = true
uuid.workspace = true
vox = { workspace = true, optional = true }

[features]
default = []
backend-db = ["dep:auth-db", "dep:sea-orm", "dep:sea-orm-migration", "auth-proto/server"]
vox = ["dep:vox", "auth-proto/vox"]
axum = ["dep:architect", "dep:axum", "architect/server-axum"]
full = ["backend-db", "vox", "axum", "auth-proto/full"]

[dev-dependencies]
proptest.workspace = true
tokio.workspace = true
