name: pr

# A PR's checks: the fast ones, on a hosted runner. The full
# suite (clippy, tests, wasm, boundaries, docs, tags) runs on main after the
# merge (checks.yml). Branch protection requires this job's `check` status.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A PR's new push supersedes its old run.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # The repo's devenv shell (devenv.nix): the same nix rustc as a local
    # shell and main's checks.
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # devenv 2.4.0, from the nixpkgs revision devenv-fleet's pins.json
      # names (`devenv.nixpkgs`); cache.nixos.org has it.
      - name: devenv
        shell: bash
        run: |
          set -euo pipefail
          out=$(nix build --no-link --print-out-paths \
            github:NixOS/nixpkgs/e62746b0b472753ef019baceab6f1e2e52014980#devenv)
          echo "$out/bin" >> "$GITHUB_PATH"
      # Evaluates the shell once and asserts its rustc is devenv-fleet's
      # pinned store path.
      - name: toolchain
        run: fleet-doctor
      - name: fmt
        run: cargo fmt --all -- --check
      # The committed lockfile is the one cargo resolves: a merge that left
      # it stale fails here, not on main.
      - name: lockfile
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.committed"
          cargo metadata --format-version 1 > /dev/null
          if ! diff -u "$RUNNER_TEMP/Cargo.lock.committed" Cargo.lock; then
            echo "::error::Cargo.lock is out of date: run cargo metadata and commit the result"
            exit 1
          fi
      # Every crate the PR changes needs a cargo-rail change file
      # (.changes/README); release notes are built from them, never from
      # commits. cargo-rail 0.32.0 is the dev shell's (devenv-fleet's
      # `rust` module), the version Task and studio pin; the check
      # compiles nothing.
      - name: change files
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch -q --no-tags --depth=1 origin "$BASE"
          cargo rail change check --since "$BASE"
