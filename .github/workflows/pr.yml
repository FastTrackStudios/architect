name: pr

# A PR's checks: the fast ones, about a minute on a hosted runner. The full
# suite (clippy, tests, wasm, boundaries, docs, tags) runs on main after the
# merge (checks.yml). Branch protection requires this job's `check` status.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A PR's new push supersedes its old run.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The pin in rust-toolchain.toml; rustup reads it.
      - name: toolchain
        run: rustup show active-toolchain
      - name: fmt
        run: cargo fmt --all -- --check
      # The committed lockfile is the one cargo resolves: a merge that left
      # it stale fails here, not on main.
      - name: lockfile
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.committed"
          cargo metadata --format-version 1 > /dev/null
          if ! diff -u "$RUNNER_TEMP/Cargo.lock.committed" Cargo.lock; then
            echo "::error::Cargo.lock is out of date: run cargo metadata and commit the result"
            exit 1
          fi
      # Every crate the PR changes needs a cargo-rail change file
      # (.changes/README); release notes are built from them, never from
      # commits. cargo-rail is the released binary at the version Task and
      # studio pin, checksum-verified; the check compiles nothing.
      - name: change files
        if: ${{ !cancelled() }}
        env:
          RAIL: "0.32.0"
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/cargo-rail"
          mkdir -p "$dl"
          url="https://github.com/loadingalias/cargo-rail/releases/download/v${RAIL}"
          curl -fsSL -o "$dl/rail.zip" "$url/cargo-rail-x86_64-unknown-linux-gnu.zip"
          curl -fsSL -o "$dl/SHA256SUMS" "$url/SHA256SUMS"
          (cd "$dl" && grep ' cargo-rail-x86_64-unknown-linux-gnu.zip$' SHA256SUMS \
            | sed 's/cargo-rail-x86_64-unknown-linux-gnu.zip$/rail.zip/' | sha256sum -c --quiet)
          unzip -q -o "$dl/rail.zip" -d "$dl"
          export PATH="$dl/cargo-rail:$PATH"
          git fetch -q --no-tags --depth=1 origin "$BASE"
          cargo rail change check --since "$BASE"
