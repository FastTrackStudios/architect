name: checks

# The full suite runs after a PR merges, on every push to main (studio's
# shape). A PR runs only the fast checks in pr.yml; whoever merges watches
# main and reverts or fixes forward when it goes red.
#
# Tests are selected the way Task's main CI does it: on a push to main,
# `cargo rail plan` between the base and this commit names the packages
# the diff reaches, and nextest runs only those (scripts/ci-rail-plan.py).
# The base is the newest ancestor whose own push-to-main run finished
# green (scripts/ci_plan_base.py), not the previous push: a newer push
# cancels an older run, so the commits since the last green run, cancelled
# and red ones included, are all in this run's diff. The whole workspace
# still builds, so the artifacts are the ones a full run uses. Every test
# runs on the nightly schedule, on a `v*` tag and on a manual dispatch,
# and whenever the plan can't be read exactly (no green ancestor among the
# newest 100 green runs, Actions API failing, CI inputs changed,
# workspace-wide change, rail failing).
on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Pushes to main share one group and a newer push cancels the older run:
# only the newest main commit is checked, and its plan (above) covers the
# commits whose runs were cancelled. A `v*` tag, the nightly schedule and
# a manual dispatch each get a group of their own (the run id), so nothing
# cancels them, nor queues behind them, and they always finish.
concurrency:
  group: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'checks-main' || format('checks-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Any warning fails the job (cargo's `build.warnings`). Not
  # `RUSTFLAGS: -D warnings`: that env replaces .cargo/config.toml's
  # rustflags and changes every crate's kache key, so nothing built here
  # would be shared with a local build or another fleet repo.
  CARGO_BUILD_WARNINGS: deny
  # Debug info is most of a cold target dir and nobody reads it in CI.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

# Build jobs use the shared THEBATTLESHIP pool, and every `run` step runs
# in the repo's devenv shell (devenv.nix, set up by
# .github/actions/shared-rust): the same nix rustc, store path and all, as
# a local shell, so kache shares CI's builds with local ones. The job gate provides
# repo-scoped CI_CACHE_DIR/CARGO_HOME; targets are isolated by kind and
# slot, while kache restores reusable artifacts across slots and repos.
# The status-only aggregator and public PR fast checks remain hosted.
jobs:
  lint:
    name: Lint (fmt + clippy + boundaries + docs)
    runs-on: [self-hosted, thebattleship]
    timeout-minutes: 45
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/shared-rust
        with:
          kind: lint

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets

      # The crate-layout ADR (docs/content/architecture/layout.md) as a
      # check: layer table in boundaries.toml, counts ratcheted.
      - name: boundaries
        if: ${{ !cancelled() }}
        run: cargo run -q -p xtask -- boundaries

      # Every path, page link, `just` recipe, `cargo xtask` command and
      # `-p` package the docs name must exist (docs/content, README.md,
      # skills/).
      - name: docs
        if: ${{ !cancelled() }}
        run: cargo run -q -p xtask -- docs

      # Everything an app serves over MCP it serves on the command line
      # too, each app with a parity test (docs/content/guide/cli-and-mcp.md).
      - name: surfaces
        if: ${{ !cancelled() }}
        run: cargo run -q -p xtask -- surfaces

      # One trait, three ways (#272): every built-in extension crate builds
      # linked in and as a process (WASI once its runner lands).
      - name: builtins
        if: ${{ !cancelled() }}
        run: cargo run -q -p xtask -- builtins

      # Every test a feature keeps out of the workspace run (a
      # `required-features`, a `cfg(feature …)`) is run by a pass in
      # feature-tests.toml or skipped there with its reason. Resolves the
      # build with guppy; compiles nothing.
      - name: feature-tests
        if: ${{ !cancelled() }}
        run: cargo run -q -p xtask -- feature-tests

      # The fleet feature union (workspace-hack/Cargo.toml, FLEET section):
      # every member's hack line is gated off on wasm, and every entry is
      # still a crate this workspace builds. Refreshing it from the
      # consumers is `cargo xtask fleet-deps --repo …` (xtask-tooling.md).
      - name: fleet-deps
        if: ${{ !cancelled() }}
        run: cargo run -q -p xtask -- fleet-deps --check

  test:
    name: Tests
    runs-on: [self-hosted, thebattleship]
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    steps:
      - uses: actions/checkout@v4
        with:
          # The plan diffs against the newest green main ancestor, and
          # ci_plan_base.py asks git whether a run's commit is one.
          fetch-depth: 0
      - uses: ./.github/actions/shared-rust
        with:
          kind: test

      # Fail open: anything but a push to main with a green ancestor and a
      # readable plan runs every test.
      - name: plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          # Reads this workflow's runs (the job's `actions: read`).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          full() {
            echo "plan: $1 -> every test"
            printf 'full=true\ntests=true\ntest_filter=\n' >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] || full "$EVENT on $REF"
          base="$(python3 scripts/ci_plan_base.py "$(git rev-parse HEAD)")" || full "base lookup failed"
          [ -n "$base" ] || full "no green main ancestor"
          echo "plan: base $base ($(git rev-list --count "$base..HEAD") commit(s) since)"
          plan="$RUNNER_TEMP/rail-plan.json"
          cargo rail plan --from "$base" --to HEAD --json > "$plan" || full "cargo rail plan failed"
          gates="$(python3 scripts/ci-rail-plan.py "$plan")" || full "plan parse failed"
          [ -n "$gates" ] || full "plan parse produced no gates"
          echo "$gates" | tee -a "$GITHUB_OUTPUT"

      # nextest runs each test in its own process, in parallel across every
      # binary; the build is `--workspace` either way.
      # The WASI extension tests build their components in `devenv
      # --profile wasi shell` and run the browser's shape under its node;
      # here a component that does not build, or no node, fails them
      # instead of letting them say so and pass.
      - name: test
        if: ${{ steps.plan.outputs.tests == 'true' }}
        env:
          FILTER: ${{ steps.plan.outputs.test_filter }}
          ARCHITECT_WASI_REQUIRED: "1"
          ARCHITECT_WASI_WEB_REQUIRED: "1"
        run: |
          if [ -n "$FILTER" ]; then
            cargo nextest run --workspace --profile ci --no-tests=pass -E "$FILTER"
          else
            cargo nextest run --workspace --profile ci --no-tests=pass
          fi

      # The tests the workspace run leaves out, one `cargo nextest run -p …
      # --features …` per pass in feature-tests.toml, under the same plan
      # filter. Runs after a failed workspace run too.
      - name: feature passes
        if: ${{ !cancelled() && steps.plan.outputs.tests == 'true' }}
        env:
          FILTER: ${{ steps.plan.outputs.test_filter }}
        run: cargo run -q -p xtask -- feature-tests --run --filter "$FILTER" -- --profile ci --no-tests=pass

      # nextest does not run doctests; they follow a full run only.
      - name: doctests
        if: ${{ steps.plan.outputs.full == 'true' }}
        run: cargo test --workspace --doc

  # The framework half must stay wasm-clean, and so must the UI the web
  # app (apps/web, dioxus-web) mounts (#172). The Blitz hosts (`native`
  # features), the vault's filesystem backend and the extension host
  # (Luau, #495) are native only.
  wasm:
    name: wasm check
    runs-on: [self-hosted, thebattleship]
    timeout-minutes: 30
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/shared-rust
        with:
          kind: wasm

      - name: check wasm
        run: |
          cargo check --target wasm32-unknown-unknown \
            -p architect -p architect-atom -p architect-form \
            -p architect-permissions -p architect-permissions-proto \
            -p auth-proto -p auth-client -p crdt -p architect-input \
            -p architect-presence -p architect-web
          # The generated HTTP clients (`<Trait>HttpClient`, over reqwest's
          # fetch backend) are what a browser app signs in through, so
          # their wasm build is load-bearing.
          cargo check --target wasm32-unknown-unknown -p auth-proto
          # Files' contract and its client run in browser apps.
          cargo check --target wasm32-unknown-unknown -p architect-files
          cargo check --target wasm32-unknown-unknown -p architect-files --features vox
          # Attachments' model, a document's list and the client: browser
          # apps attach to documents too.
          cargo check --target wasm32-unknown-unknown -p architect-attachments
          cargo check --target wasm32-unknown-unknown -p architect-attachments --features vox
          # Devices: who a node lets in, pairing tickets and the services'
          # clients, read by browser apps too.
          cargo check --target wasm32-unknown-unknown -p architect-devices
          cargo check --target wasm32-unknown-unknown -p architect-devices --features vox
          # Spaces' model and service: a browser share sheet reads them.
          cargo check --target wasm32-unknown-unknown -p architect-spaces
          cargo check --target wasm32-unknown-unknown -p architect-spaces --features vox
          # A guide scenario's model: a browser tour reads the same file.
          cargo check --target wasm32-unknown-unknown -p architect-guide
          # The keymap engine's Dioxus hook runs in browser shells.
          cargo check --target wasm32-unknown-unknown \
            -p architect-input --features dioxus
          # Agents' generated UI: the model, and the renderer a web host
          # draws (architect-ui, dioxus-primitives, Loro).
          cargo check --target wasm32-unknown-unknown -p architect-a2ui
          cargo check --target wasm32-unknown-unknown -p architect-a2ui --features ui
          # WASI component extensions in a browser (jco-transpiled, Web
          # Workers), and the web app's page that runs the WASI Counter.
          cargo check --target wasm32-unknown-unknown -p architect-extensions --features web
          cargo check --target wasm32-unknown-unknown -p architect-web
          # The app's UI on dioxus-web (#172): the shell, the workspace,
          # the commands and palette slot, settings, the navigator over a
          # MemorySource, orgs and accounts, the theme, the editor's web
          # view, and the vault's model without its filesystem backend.
          cargo check --target wasm32-unknown-unknown \
            -p architect-ui -p architect-theme --features architect-theme/dioxus \
            -p architect-shell --features architect-shell/ui \
            -p architect-workspace --features architect-workspace/ui,architect-workspace/home \
            -p architect-commands --features architect-commands/ui \
            -p architect-settings --features architect-settings/ui,architect-settings/store,architect-settings/appearance \
            -p architect-navigator --features architect-navigator/ui \
            -p architect-navigator-api \
            -p architect-orgs --features architect-orgs/ui \
            -p architect-accounts --features architect-accounts/ui \
            -p architect-guide --features architect-guide/ui \
            -p architect-capture --features architect-capture/ui \
            -p architect-editor --features architect-editor/web
          cargo check --target wasm32-unknown-unknown -p vault --no-default-features

  # The one status main's branch protection requires (context `check`).
  # It passes only when every job above succeeded; a skipped or cancelled
  # job fails it, so a skip never counts as a pass.
  check:
    name: check
    if: ${{ always() }}
    needs: [lint, test, wasm]
    runs-on: ubuntu-latest
    steps:
      - name: all checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lint/test/wasm: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  # The lint config denies the panic-shaped lints, so a `--all-features`
  # build would be the stricter gate. It is not run here: turning on every
  # feature pulls `dioxus/desktop` (tao + wry) into `architect-atom`, and no
  # feature combination the fleet ships pulls that in. `scratchpad/gate.sh`
  # runs it locally.

  # Release tags are the only thing consuming repos can reason about, and
  # the only useful question they ask is "am I ahead of or behind that
  # other repo?" — which has an answer only while the numbering matches
  # what the graph says. `v0.0.2` already names a commit sitting between
  # v0.5.0 and v0.6.0; this stops the next one.
  tags:
    runs-on: [self-hosted, thebattleship]
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    steps:
      - uses: actions/checkout@v4
        with:
          # The check walks every tag, so it needs the whole history.
          fetch-depth: 0
      - uses: ./.github/actions/shared-rust
        with:
          kind: tags
      - name: tag ordering
        run: cargo run -p xtask -- tags --verbose
