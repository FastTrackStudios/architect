name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # System headers the UI and storage crates link against.
      - name: apt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libasound2-dev libudev-dev pkg-config \
            libxdo-dev libayatana-appindicator3-dev
          # libxdo / appindicator are dioxus-desktop's (global-hotkey, muda,
          # tray-icon). `cargo check` does not link, so they only bite at the
          # `test` step — which never ran until fmt started passing.

      # rust-toolchain.toml drives the version; this action honours it.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: check
        run: cargo check --workspace --all-targets

      - name: clippy
        run: cargo clippy --workspace --all-targets

      - name: test
        run: cargo test --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # The framework half must stay wasm-clean; the ui/story crates pull
      # native rendering (blitz/vello) and are checked natively only.
      - name: check wasm
        run: |
          cargo check --target wasm32-unknown-unknown \
            -p architect -p architect-atom -p architect-form \
            -p architect-permissions -p architect-permissions-proto \
            -p auth-proto -p auth-client -p crdt
          # auth-http is what a browser app signs in through (Keyflow does),
          # so its wasm build is load-bearing — with the `browser` feature,
          # which is the localStorage token store a web app actually uses.
          cargo check --target wasm32-unknown-unknown \
            -p auth-http --features auth-http/browser
