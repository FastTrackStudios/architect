name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR's new push supersedes its old run. A push to main never cancels a
# running check: it waits as the one pending run, so every run that starts
# on main finishes and says whether that commit is green.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The fleet toolchain the consumers build with (Task's `.#ci` shell),
  # which is what the self-hosted runner used. It overrides
  # rust-toolchain.toml's older pin for CI only.
  RUSTUP_TOOLCHAIN: "1.98.1"
  # Debug info is most of a cold target dir and nobody reads it in CI.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

# Every job runs on GitHub-hosted ubuntu-latest: the repo is public, so
# the runners cost nothing, and three jobs run side by side instead of one
# serial job queued behind the other repos on THEBATTLESHIP.
#
# CACHE BUDGET: the repo has 10 GB of Actions cache, evicted LRU across
# branches. rust-cache SAVES only on main; PRs restore main's entry. Each
# job has its own shared-key, so check-mode (lint), test and wasm32
# artifacts never overwrite each other.
jobs:
  lint:
    name: Lint (fmt + clippy + boundaries + docs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hosted-rust
        with:
          kind: lint

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets

      # The crate-layout ADR (docs/content/architecture/layout.md) as a
      # check: layer table in boundaries.toml, counts ratcheted.
      - name: boundaries
        if: ${{ !cancelled() }}
        run: cargo run -q -p xtask -- boundaries

      # Every path, page link, `just` recipe, `cargo xtask` command and
      # `-p` package the docs name must exist (docs/content, README.md,
      # skills/).
      - name: docs
        if: ${{ !cancelled() }}
        run: cargo run -q -p xtask -- docs

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hosted-rust
        with:
          kind: test

      - name: test
        run: cargo test --workspace

  # The framework half must stay wasm-clean; the ui/story crates pull
  # native rendering (blitz/vello) and are checked natively only.
  wasm:
    name: wasm check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hosted-rust
        with:
          kind: wasm

      - name: check wasm
        run: |
          cargo check --target wasm32-unknown-unknown \
            -p architect -p architect-atom -p architect-form \
            -p architect-permissions -p architect-permissions-proto \
            -p auth-proto -p auth-client -p crdt -p architect-input
          # The generated HTTP clients (`<Trait>HttpClient`, over reqwest's
          # fetch backend) are what a browser app signs in through, so
          # their wasm build is load-bearing.
          cargo check --target wasm32-unknown-unknown -p auth-proto
          # The keymap engine's Dioxus hook runs in browser shells.
          cargo check --target wasm32-unknown-unknown \
            -p architect-input --features dioxus

  # The lint config denies the panic-shaped lints, so a `--all-features`
  # build would be the stricter gate. It is not run here: turning on every
  # feature pulls `dioxus/desktop` (tao + wry) into `architect-atom`, and no
  # feature combination the fleet ships pulls that in. `scratchpad/gate.sh`
  # runs it locally.

  # Release tags are the only thing consuming repos can reason about, and
  # the only useful question they ask is "am I ahead of or behind that
  # other repo?" — which has an answer only while the numbering matches
  # what the graph says. `v0.0.2` already names a commit sitting between
  # v0.5.0 and v0.6.0; this stops the next one.
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check walks every tag, so it needs the whole history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks-tags
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: tag ordering
        run: cargo run -p xtask -- tags --verbose
