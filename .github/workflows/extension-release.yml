# Extension release — a reusable workflow an extension's repository calls
# to ship it to the FTS registry (docs/content/architecture/extensions.md,
# "Distribution"):
#
#   plan   reads the package's extension.toml: id, version, kind, its
#          program (`[entry] path = "bin/<name>"`), the platforms to build;
#   build  a process extension only: builds its program once per platform
#          (matrix), each on a runner of that platform;
#   pack   puts the package and each build (`bin/<target-triple>/<name>`)
#          into one unsigned .archext with `cargo xtask ext-pack`. Runs the
#          caller's `prepare` command (a WASI component, generated Luau);
#          holds no secret;
#   sign   in the caller's release-signing environment: `cargo xtask
#          ext-sign --expect <org key>` (a secret that is not the org key's is
#          refused), `ext-verify`, then uploads the archive to the release;
#          runs nothing of the caller's;
#   index  opens a pull request on the registry adding the version's entry
#          (archive URL, sha256, platforms, changelog) to its index
#          (`<registry-dir>/index.toml`); the registry's own CI checks it
#          with `cargo xtask ext-index`. The FastTrackStudios store is
#          `registry: FastTrackStudios/architect`, `registry-dir: extensions`
#          (architect's `extension-index.yml` checks it).
#
# A caller (in the extension's repository, on its release tag):
#
#   jobs:
#     extension:
#       uses: FastTrackStudios/architect/.github/workflows/extension-release.yml@<architect tag>
#       with:
#         package: extension            # the folder with extension.toml
#         build: cargo build --release --locked --target "$TARGET" -p studio-extension
#         binary: target/$TARGET/release/studio-extension
#         architect-ref: <architect tag>
#         registry: FastTrackStudios/architect
#         registry-dir: extensions
#       secrets:
#         EXT_SIGNING_KEY: ${{ secrets.TASK_RELEASE_MINISIGN_KEY }}
#         REGISTRY_TOKEN: ${{ secrets.FTS_REGISTRY_TOKEN }}
#
# Secrets are passed by name: a called job that declares `environment:`
# still sees that environment's secrets only through what the caller passes
# (Task's node-binaries.yml learned this the hard way), so the caller passes
# the key from its own release-signing environment's secret.

name: Extension release

on:
  workflow_call:
    inputs:
      package:
        description: "The package folder (its extension.toml at the top), relative to the caller's repository."
        type: string
        required: true
      build:
        description: >-
          A process extension's build command, run once per platform with
          TARGET set to the target triple (and the Rust target installed).
          Empty for data, Luau and WASI extensions.
        type: string
        required: false
        default: ""
      binary:
        description: "Where `build` leaves the program; `$TARGET` is expanded (target/$TARGET/release/my-ext)."
        type: string
        required: false
        default: ""
      platforms:
        description: "The target triples to build a process extension for (a JSON array)."
        type: string
        required: false
        default: '["aarch64-apple-darwin","x86_64-apple-darwin","x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu"]'
      runners:
        description: "The runner per target triple (a JSON object); the default maps the four platforms to GitHub-hosted runners (x86_64 macOS cross-built on Apple silicon)."
        type: string
        required: false
        default: '{"aarch64-apple-darwin":"macos-15","x86_64-apple-darwin":"macos-15","x86_64-unknown-linux-gnu":"ubuntu-24.04","aarch64-unknown-linux-gnu":"ubuntu-24.04-arm"}'
      prepare:
        description: "A command run in the package job before packing (build a WASI component into the package, generate files). No secret is in that job."
        type: string
        required: false
        default: ""
      tag:
        description: "The release to attach the archive to. Empty = the tag the run is on."
        type: string
        required: false
        default: ""
      changelog:
        description: "The version's changelog line in the registry. Empty = the release notes' first line."
        type: string
        required: false
        default: ""
      architect-ref:
        description: "The architect ref whose `cargo xtask ext-*` packs and signs (pin the tag this workflow is called at)."
        type: string
        required: false
        default: main
      expect-key:
        description: "The public key the signing key must be (the base64 line of a minisign .pub). Default: the org release key."
        type: string
        required: false
        default: RWRh9Gk9qaStQMhku4THMidEYrQsmAEsm2dDprUkZxShEtqfIcroM8Od
      environment:
        description: "The caller's environment the sign job runs in (where the key is kept)."
        type: string
        required: false
        default: release-signing
      registry:
        description: "The registry repository (owner/name) the index pull request goes to. Empty = no pull request."
        type: string
        required: false
        default: FastTrackStudios/extensions
      registry-dir:
        description: "The folder of `registry` holding its index.toml (the store's: `extensions`). Empty = the repository's root."
        type: string
        required: false
        default: ""
      registry-branch:
        description: "The registry's branch the pull request targets."
        type: string
        required: false
        default: main
    secrets:
      EXT_SIGNING_KEY:
        description: "The minisign secret key (unencrypted, `minisign -G -W`) the archive is signed with: the org release key."
        required: true
      REGISTRY_TOKEN:
        description: "A token that can push a branch and open a pull request on `registry`. Without it, the entry is printed instead."
        required: false
    outputs:
      archive:
        description: "The archive's release asset URL."
        value: ${{ jobs.sign.outputs.url }}
      sha256:
        description: "The archive's SHA-256."
        value: ${{ jobs.sign.outputs.sha256 }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.plan.outputs.id }}
      version: ${{ steps.plan.outputs.version }}
      kind: ${{ steps.plan.outputs.kind }}
      program: ${{ steps.plan.outputs.program }}
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
      native: ${{ steps.plan.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the manifest
        id: plan
        env:
          PACKAGE: ${{ inputs.package }}
          BUILD: ${{ inputs.build }}
          PLATFORMS: ${{ inputs.platforms }}
          RUNNERS: ${{ inputs.runners }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys, tomllib
          with open(os.path.join(os.environ["PACKAGE"], "extension.toml"), "rb") as f:
              m = tomllib.load(f)
          kind = m["kind"]
          program = ""
          entry = (m.get("entry") or {}).get("path", "")
          native = kind == "process" and bool(os.environ["BUILD"])
          if native:
              if not entry.startswith("bin/"):
                  sys.exit(f"::error::a process extension's [entry] path must be bin/<name> (it is {entry!r})")
              program = entry.removeprefix("bin/")
          runners = json.loads(os.environ["RUNNERS"])
          include = []
          for t in json.loads(os.environ["PLATFORMS"]) if native else []:
              if t not in runners:
                  sys.exit(f"::error::no runner for {t}: add it to `runners`")
              include.append({"target": t, "runner": runners[t]})
          print(f"id={m['id']}")
          print(f"version={m['version']}")
          print(f"kind={kind}")
          print(f"program={program}")
          print(f"tag={os.environ['TAG']}")
          print(f"native={'true' if native else 'false'}")
          print("matrix=" + json.dumps({"include": include}))
          PY
          cat "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.native == 'true'
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          BUILD: ${{ inputs.build }}
        run: bash -euo pipefail -c "$BUILD"
      - name: Stage bin/${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ inputs.binary }}
          PROGRAM: ${{ needs.plan.outputs.program }}
        run: |
          set -euo pipefail
          bin="${BINARY//\$TARGET/$TARGET}"
          [ -f "$bin" ] || { echo "::error::the build left no $bin"; exit 1; }
          mkdir -p "stage/bin/$TARGET"
          cp "$bin" "stage/bin/$TARGET/$PROGRAM"
      - uses: actions/upload-artifact@v4
        with:
          name: ext-bin-${{ matrix.target }}
          path: stage
          if-no-files-found: error

  pack:
    needs: [plan, build]
    # `build` is skipped for a platform-neutral extension.
    if: always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FastTrackStudios/architect
          ref: ${{ inputs.architect-ref }}
          path: .architect
      # architect's .cargo/config.toml links with mold.
      - name: mold
        run: sudo apt-get install -y --no-install-recommends mold
      - name: Prepare
        if: inputs.prepare != ''
        env:
          PREPARE: ${{ inputs.prepare }}
        run: bash -euo pipefail -c "$PREPARE"
      - name: Stage the package
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage"
          cp -R "$PACKAGE"/. "$RUNNER_TEMP/stage/"
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.native == 'true'
        with:
          pattern: ext-bin-*
          path: ${{ runner.temp }}/stage
          merge-multiple: true
      - name: ext-pack
        working-directory: .architect
        env:
          OUT: ${{ runner.temp }}/dist/${{ needs.plan.outputs.id }}-${{ needs.plan.outputs.version }}.archext
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUT")"
          cargo run -q -p xtask -- ext-pack "$RUNNER_TEMP/stage" --out "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ext-unsigned
          path: ${{ runner.temp }}/dist/*.archext
          if-no-files-found: error

  sign:
    needs: [plan, pack]
    if: always() && needs.pack.result == 'success'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    outputs:
      url: ${{ steps.upload.outputs.url }}
      sha256: ${{ steps.upload.outputs.sha256 }}
    steps:
      # Only architect's code runs here, never the caller's.
      - uses: actions/checkout@v4
        with:
          repository: FastTrackStudios/architect
          ref: ${{ inputs.architect-ref }}
          path: .architect
      - uses: actions/download-artifact@v4
        with:
          name: ext-unsigned
          path: ${{ runner.temp }}/dist
      # architect's .cargo/config.toml links with mold.
      - name: mold
        run: sudo apt-get install -y --no-install-recommends mold
      - name: Build xtask
        working-directory: .architect
        run: cargo build -q -p xtask
      - name: ext-sign
        working-directory: .architect
        env:
          EXT_SIGNING_KEY: ${{ secrets.EXT_SIGNING_KEY }}
          EXPECT: ${{ inputs.expect-key }}
        run: |
          set -euo pipefail
          if [ -z "$EXT_SIGNING_KEY" ]; then
            echo "::error::EXT_SIGNING_KEY is empty: pass the release-signing key from the caller (secrets: EXT_SIGNING_KEY: ...)"
            exit 1
          fi
          for a in "$RUNNER_TEMP"/dist/*.archext; do
            # The key is read from the environment, never written or printed.
            cargo run -q -p xtask -- ext-sign "$a" --expect "$EXPECT"
            cargo run -q -p xtask -- ext-verify "$a" --no-org --key "$EXPECT"
          done
      - name: Upload to the release
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REPO: ${{ github.repository }}
          TITLE: ${{ needs.plan.outputs.id }} ${{ needs.plan.outputs.version }}
          NOTES: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          # The tag's Release, made here when the repository's own release
          # workflow makes none for this tag (an extension's own tag).
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TITLE" \
              --notes "${NOTES:-$TITLE}"
          fi
          a="$(ls "$RUNNER_TEMP"/dist/*.archext)"
          name="$(basename "$a")"
          gh release upload "$TAG" "$a" --clobber --repo "$REPO"
          sha="$(sha256sum "$a" | cut -d' ' -f1)"
          url="https://github.com/$REPO/releases/download/$TAG/$name"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### $name attached to $TAG"
            echo
            echo "- sha256: \`$sha\`"
            echo "- $url"
          } >> "$GITHUB_STEP_SUMMARY"

  index:
    needs: [plan, sign]
    if: always() && needs.sign.result == 'success' && inputs.registry != ''
    runs-on: ubuntu-24.04
    steps:
      - name: The release notes' first line
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REPO: ${{ github.repository }}
          GIVEN: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          line="$GIVEN"
          if [ -z "$line" ]; then
            line="$(gh release view "$TAG" --repo "$REPO" --json body -q .body \
              | sed -e 's/^[#*-]*[[:space:]]*//' | grep -m1 -v '^[[:space:]]*$' || true)"
          fi
          {
            echo "line<<EOF_NOTES"
            echo "$line"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: ${{ inputs.package }}
      - name: Check for a registry token
        id: token
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -n "$REGISTRY_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          repository: ${{ inputs.registry }}
          ref: ${{ inputs.registry-branch }}
          token: ${{ secrets.REGISTRY_TOKEN }}
          path: registry
      - name: The entry
        id: entry
        env:
          ID: ${{ needs.plan.outputs.id }}
          VERSION: ${{ needs.plan.outputs.version }}
          KIND: ${{ needs.plan.outputs.kind }}
          URL: ${{ needs.sign.outputs.url }}
          SHA: ${{ needs.sign.outputs.sha256 }}
          PLATFORMS: ${{ needs.plan.outputs.native == 'true' && inputs.platforms || '[]' }}
          CHANGELOG: ${{ steps.notes.outputs.line }}
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/entry.toml"
          import json, os, tomllib
          def q(s):
              return json.dumps(s, ensure_ascii=False)
          e = os.environ
          with open(os.path.join("source", e["PACKAGE"], "extension.toml"), "rb") as f:
              m = tomllib.load(f)
          lines = ["", "[[extensions]]",
                   f"id = {q(e['ID'])}",
                   f"name = {q(m.get('name') or e['ID'])}",
                   f"version = {q(e['VERSION'])}",
                   f"kind = {q(e['KIND'])}"]
          if m.get("description"):
              lines.append(f"description = {q(' '.join(m['description'].split()))}")
          lines += [f"archive = {q(e['URL'])}", f"sha256 = {q(e['SHA'])}"]
          platforms = sorted(json.loads(e["PLATFORMS"]))
          if platforms:
              lines.append("platforms = [" + ", ".join(q(p) for p in platforms) + "]")
          if e["CHANGELOG"].strip():
              lines.append(f"changelog = {q(e['CHANGELOG'].strip())}")
          print("\n".join(lines))
          PY
          cat "$RUNNER_TEMP/entry.toml" >> "$GITHUB_STEP_SUMMARY"
      - name: Open the registry pull request
        if: steps.token.outputs.present == 'true'
        working-directory: registry
        env:
          INDEX: ${{ inputs.registry-dir && format('{0}/index.toml', inputs.registry-dir) || 'index.toml' }}
          GH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          ID: ${{ needs.plan.outputs.id }}
          VERSION: ${{ needs.plan.outputs.version }}
          BASE: ${{ inputs.registry-branch }}
          REGISTRY: ${{ inputs.registry }}
          SOURCE: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          listed="$(python3 -c 'import os, tomllib
          i = tomllib.load(open(os.environ["INDEX"], "rb"))
          print(any(e.get("id") == os.environ["ID"] and e.get("version") == os.environ["VERSION"] for e in i.get("extensions", [])))')"
          if [ "$listed" = "True" ]; then
            echo "::notice::$ID $VERSION is already in the index"
            exit 0
          fi
          branch="ext/$ID-$VERSION"
          git switch -c "$branch"
          [ -f "$INDEX" ] || { echo "::error::$REGISTRY has no $INDEX"; exit 1; }
          cat "$RUNNER_TEMP/entry.toml" >> "$INDEX"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "$ID $VERSION"
          git push -q origin "$branch"
          gh pr create --repo "$REGISTRY" --base "$BASE" --head "$branch" \
            --title "$ID $VERSION" \
            --body "Released from $SOURCE $TAG by extension-release.yml. The registry's CI checks the archive's hash and signature."
      - name: No registry token
        if: steps.token.outputs.present != 'true'
        env:
          REGISTRY: ${{ inputs.registry }}
          INDEX: ${{ inputs.registry-dir && format('{0}/index.toml', inputs.registry-dir) || 'index.toml' }}
        run: |
          echo "::warning::REGISTRY_TOKEN was not passed, so no pull request was opened on $REGISTRY; add this entry to its $INDEX by hand (it is in this run's summary too):"
          cat "$RUNNER_TEMP/entry.toml"
