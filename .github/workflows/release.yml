name: release

# Consumers (task, fasttrackstudio) pin architect by tag, so a tag is the
# unit of release. Push `vX.Y.Z` and this publishes (#431):
#
#   the GitHub release, notes from .changes/                 job release
#   ghcr.io/fasttrackstudios/architect:<v>|sha-|latest       job node (the headless node)
#     + architect-node-<tag>-x86_64-linux.tar.gz
#   ghcr.io/fasttrackstudios/architect-web:<v>|sha-|latest   job web (landing page, docs, web app)
#     + architect-web-<X.Y.Z>.tar.gz
#   Architect-linux-x86_64.AppImage + latest-linux.json      job linux
#   a PR bumping nix/desktop/source.json (the flake's app)     job nix-bump
#   Architect-macos-arm64.dmg + latest-macos.json            job macos (UNTESTED, off by default)
#   the iOS app on TestFlight, noted in the release's notes   job ios (ios.yml; never blocks)
#   SHA256SUMS (+ SHA256SUMS.minisig, the org key)           job sums
#   @fasttrackstudio/architect(-cli) on npm (features/extensions/web)  jobs npm-pack, npm-publish
#     (npm-publish inert until the NPM_TOKEN secret is set)
#
# Windows desktop builds are a follow-up (#431).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Reserved capacity: normal CI cannot occupy the release slots.
    runs-on: [self-hosted, thebattleship-release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The notes are the cargo-rail change files added since the previous
      # tag (.changes/README), never the commits: `just release-notes <tag>`
      # prints the same thing locally.
      - name: notes
        run: bash scripts/release-notes.sh notes "${GITHUB_REF_NAME}" > "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md

  # The Architect app, headless: `architect-desktop serve`, the always-on
  # node (apps/desktop/src/node). A tag publishes its image to GHCR and
  # attaches its binary to the release above.
  #
  #   ghcr.io/fasttrackstudios/architect:<X.Y.Z>   (the tag without its `v`)
  #   ghcr.io/fasttrackstudios/architect:sha-<short>
  #   ghcr.io/fasttrackstudios/architect:latest    (the highest release only)
  #
  # The binary is built in the dev shell (the runner's warm target dir);
  # Nix only assembles the image around it (flake.nix
  # `architect-image-prebuilt`, the same contents as the pure
  # `architect-image`), and skopeo pushes it: no Docker. Packages pushed
  # with GITHUB_TOKEN start PRIVATE: make `architect` public once in the
  # org's package settings, or the cluster cannot pull it.
  node:
    needs: release
    runs-on: [self-hosted, thebattleship-release]
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    env:
      # Newer skopeo rejects some hosts' v1 registries.conf; the registry
      # is named explicitly everywhere.
      CONTAINERS_REGISTRIES_CONF: /dev/null
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release runners have no devenv of their own (v0.11.0 failed
      # with `devenv: command not found`).
      - uses: ./.github/actions/devenv

      - name: Plan the tags
        id: plan
        run: |
          set -euo pipefail
          git fetch --quiet --tags --force origin
          tag="${GITHUB_REF_NAME}"
          v="${tag#v}"
          tags="$v sha-$(git rev-parse --short HEAD)"
          highest="$(git -c versionsort.suffix=- tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          [ "$tag" != "$highest" ] || tags="$tags latest"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "### architect image: \`$tags\`" >> "$GITHUB_STEP_SUMMARY"

      # Without the window (no Blitz, wgpu or wayland), and without the
      # workspace-hack, which would pull the GUI stack's features back in.
      - name: Build the node
        id: build
        run: |
          set -euo pipefail
          dir="${CI_CACHE_DIR:-$RUNNER_TEMP}/architect-node/$RUNNER_NAME/target"
          mkdir -p "$dir"
          # The Architect distribution's node, as any distribution's is
          # built (xtask/src/dist.rs: --no-default-features, no_workspace_hack).
          devenv shell -- cargo xtask dist node --target-dir "$dir" --out "$RUNNER_TEMP/dist" \
            | tee "$RUNNER_TEMP/dist-node.txt"
          bin="$(sed -n 's/^node=//p' "$RUNNER_TEMP/dist-node.txt")"
          "$bin" serve --help > /dev/null
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
        env:
          ARCHITECT_BUILD_REV: ${{ github.sha }}

      - name: Push the image
        env:
          ARCHITECT_PREBUILT_BIN: ${{ steps.build.outputs.bin }}
          ARCHITECT_BUILD_REV: ${{ github.sha }}
          ARCHITECT_RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          TAGS: ${{ steps.plan.outputs.tags }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/ghcr-auth.json"
          skopeo() { nix run nixpkgs#skopeo -- "$@"; }
          printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io -u "$GHCR_USER" --password-stdin
          read -r -a tags <<<"$TAGS"
          dest="docker://ghcr.io/fasttrackstudios/architect"
          streamer="$(nix build --impure .#architect-image-prebuilt --no-link --print-out-paths)"
          "$streamer" | skopeo --insecure-policy copy docker-archive:/dev/stdin "$dest:${tags[0]}"
          for tag in "${tags[@]:1}"; do
            skopeo --insecure-policy copy "$dest:${tags[0]}" "$dest:$tag"
          done
          rm -f "$REGISTRY_AUTH_FILE"

      - name: Attach the binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIN: ${{ steps.build.outputs.bin }}
        run: |
          set -euo pipefail
          name="architect-node-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "$RUNNER_TEMP/$name"
          cp "$BIN" "$RUNNER_TEMP/$name/architect-desktop"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$name.tar.gz" "$name"
          (cd "$RUNNER_TEMP" && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$name.tar.gz" "$RUNNER_TEMP/$name.tar.gz.sha256" --clobber

  # The web front end: the landing page at /, the docs at /docs/ and the
  # web app at /app/ as one static site (scripts/web-bundle.sh), its own
  # image behind static-web-server (flake.nix `architect-web-image-prebuilt`,
  # the same contents as the pure `architect-web-image`), and the same
  # bundle attached as architect-web-<X.Y.Z>.tar.gz. Starts PRIVATE on
  # GHCR like `architect`: make it public once in the org's package settings.
  #
  #   ghcr.io/fasttrackstudios/architect-web:<X.Y.Z> | sha-<short> | latest
  web:
    needs: release
    runs-on: [self-hosted, thebattleship-release]
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    env:
      CONTAINERS_REGISTRIES_CONF: /dev/null
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release runners have no devenv of their own (v0.11.0 failed
      # with `devenv: command not found`).
      - uses: ./.github/actions/devenv

      - name: Plan the tags
        id: plan
        run: |
          set -euo pipefail
          git fetch --quiet --tags --force origin
          tag="${GITHUB_REF_NAME}"
          v="${tag#v}"
          tags="$v sha-$(git rev-parse --short HEAD)"
          highest="$(git -c versionsort.suffix=- tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          [ "$tag" != "$highest" ] || tags="$tags latest"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "### architect-web image: \`$tags\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the bundle
        id: build
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="${CI_CACHE_DIR:-$RUNNER_TEMP}/architect-web/$RUNNER_NAME/target"
          mkdir -p "$CARGO_TARGET_DIR"
          out="$RUNNER_TEMP/architect-web-${{ steps.plan.outputs.version }}"
          # The Architect distribution's bundle, as any distribution's is
          # built: its node says which distribution it is
          # (/app/distribution.json), then scripts/web-bundle.sh.
          devenv shell -- cargo xtask dist web --out "$RUNNER_TEMP/dist-web" \
            | tee "$RUNNER_TEMP/dist-web.txt"
          mv "$(sed -n 's/^web=//p' "$RUNNER_TEMP/dist-web.txt")" "$out"
          echo "bundle=$out" >> "$GITHUB_OUTPUT"

      - name: Push the image
        env:
          ARCHITECT_WEB_BUNDLE: ${{ steps.build.outputs.bundle }}
          ARCHITECT_BUILD_REV: ${{ github.sha }}
          ARCHITECT_RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          TAGS: ${{ steps.plan.outputs.tags }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/ghcr-auth.json"
          skopeo() { nix run nixpkgs#skopeo -- "$@"; }
          printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io -u "$GHCR_USER" --password-stdin
          read -r -a tags <<<"$TAGS"
          dest="docker://ghcr.io/fasttrackstudios/architect-web"
          streamer="$(nix build --impure .#architect-web-image-prebuilt --no-link --print-out-paths)"
          "$streamer" | skopeo --insecure-policy copy docker-archive:/dev/stdin "$dest:${tags[0]}"
          for tag in "${tags[@]:1}"; do
            skopeo --insecure-policy copy "$dest:${tags[0]}" "$dest:$tag"
          done
          rm -f "$REGISTRY_AUTH_FILE"

      - name: Attach the bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.build.outputs.bundle }}
          V: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          name="architect-web-$V"
          tar -C "$(dirname "$BUNDLE")" -czf "$RUNNER_TEMP/$name.tar.gz" "$(basename "$BUNDLE")"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$name.tar.gz" --clobber

  # The desktop app for Linux: an AppImage (scripts/desktop/linux.sh: the
  # Nix-built binary with its libraries, nothing pointing at /nix/store,
  # a glibc floor it refuses to raise) and latest-linux.json, the updater's
  # manifest: the version, the AppImage's URL on this release, its sha256.
  linux:
    needs: release
    runs-on: [self-hosted, thebattleship-release]
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The release runners have no devenv of their own (v0.11.0 failed
      # with `devenv: command not found`).
      - uses: ./.github/actions/devenv

      - name: Build the AppImage
        id: build
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="${CI_CACHE_DIR:-$RUNNER_TEMP}/architect-desktop/$RUNNER_NAME/target"
          mkdir -p "$CARGO_TARGET_DIR"
          export VERSION="${GITHUB_REF_NAME#v}" OUT_DIR="$RUNNER_TEMP/desktop"
          # The Architect distribution, as any distribution's desktop app
          # is built: the window's build, then scripts/desktop/linux.sh.
          devenv shell -- cargo xtask dist desktop --out "$OUT_DIR" --version "$VERSION"
          echo "out=$OUT_DIR" >> "$GITHUB_OUTPUT"
        env:
          ARCHITECT_BUILD_REV: ${{ github.sha }}

      - name: Manifest and attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: ${{ steps.build.outputs.out }}
        run: |
          set -euo pipefail
          cd "$OUT"
          app=Architect-linux-x86_64.AppImage
          sha="$(sha256sum "$app" | awk '{print $1}')"
          printf '{\n  "version": "%s",\n  "appimage": "https://github.com/%s/releases/download/%s/%s",\n  "sha256": "%s"\n}\n' \
            "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$app" "$sha" > latest-linux.json
          cat latest-linux.json
          gh release upload "$GITHUB_REF_NAME" "$app" latest-linux.json --clobber --repo "$GITHUB_REPOSITORY"
          echo "### Linux: \`$app\` (glibc floor $(cat "$app-glibc-floor.txt"))" >> "$GITHUB_STEP_SUMMARY"

  # The flake's architect-desktop wraps the release's AppImage
  # (nix/desktop/package.nix, #523): after the Linux asset is up, open a PR
  # (branch chore/nix-desktop-<tag>) that points nix/desktop/source.json at
  # it, written by nix/desktop/update.sh from latest-linux.json. Only for
  # the highest release, never a push to main, and never a failed release:
  # anything that goes wrong is a warning.
  nix-bump:
    needs: linux
    runs-on: [self-hosted, thebattleship-release]
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Open the bump pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          warn() { echo "::warning::nix-bump: $*"; echo "### Nix bump: $*" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          highest="$(git -c versionsort.suffix=- tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          [ "$TAG" = "$highest" ] || { echo "$TAG is not the highest release ($highest); no bump"; exit 0; }
          nix shell nixpkgs#jq nixpkgs#curl --command bash nix/desktop/update.sh "$TAG" \
            || warn "update.sh failed for $TAG; run nix/desktop/update.sh $TAG by hand"
          if git diff --quiet -- nix/desktop/source.json; then
            echo "nix/desktop/source.json already names $TAG"; exit 0
          fi
          branch="chore/nix-desktop-$TAG"
          git switch -c "$branch"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "architect-desktop (nix): $TAG" -- nix/desktop/source.json
          git push -q --force origin "$branch" \
            || warn "could not push $branch; run nix/desktop/update.sh $TAG and open the PR by hand"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "a PR from $branch is open already"; exit 0
          fi
          gh pr create --base main --head "$branch" \
            --title "architect-desktop (nix): $TAG" \
            --body "Points the flake's \`architect-desktop\` (\`nix/desktop/source.json\`) at $TAG's AppImage, written by \`nix/desktop/update.sh $TAG\` from the release's \`latest-linux.json\`. Opened by release.yml (job nix-bump). A PR opened with the workflow token starts no checks of its own: close and reopen it, or push to the branch, to run them." \
            || warn "could not open a PR from $branch (does the repo let Actions open PRs?); open it by hand"
          echo "### Nix bump: PR from \`$branch\`" >> "$GITHUB_STEP_SUMMARY"

  # The desktop app for macOS: Developer-ID signed, notarized and stapled
  # (scripts/desktop/macos.sh, Studio's flow), and latest-macos.json.
  #
  # Runs on airlock's generic org runner (`airlock` label, user rat, kache
  # on the build disk), which has the Developer ID identity in its
  # fts-build keychain and the App Store Connect key in
  # ~/.appstoreconnect/config.env (what Task's and Studio's Mac jobs use).
  # On while the repo variable ARCHITECT_MACOS_RELEASE is `true`; set it to
  # anything else to release without waiting on airlock. It never blocks the
  # other jobs.
  macos:
    needs: release
    if: ${{ vars.ARCHITECT_MACOS_RELEASE == 'true' }}
    runs-on: [self-hosted, macOS, airlock]
    timeout-minutes: 240
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      - name: Build, sign and notarize
        id: build
        env:
          KEYCHAIN: fts-build.keychain
          KEYCHAIN_PW: fts-build
        run: |
          set -euo pipefail
          export PATH="/nix/var/nix/profiles/default/bin:/opt/homebrew/bin:$PATH"
          export VERSION="${GITHUB_REF_NAME#v}" OUT_DIR="$PWD/target/dmg"
          # The Architect distribution, as any distribution's desktop app
          # is built: the window's build, then scripts/desktop/macos.sh.
          devenv shell -- cargo xtask dist desktop --out "$OUT_DIR" --version "$VERSION"
          echo "out=$OUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Manifest and attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: ${{ steps.build.outputs.out }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          cd "$OUT"
          app=Architect-macos-arm64.dmg
          sha="$(shasum -a 256 "$app" | awk '{print $1}')"
          printf '{\n  "version": "%s",\n  "dmg": "https://github.com/%s/releases/download/%s/%s",\n  "sha256": "%s"\n}\n' \
            "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$app" "$sha" > latest-macos.json
          gh release upload "$GITHUB_REF_NAME" "$app" latest-macos.json --clobber --repo "$GITHUB_REPOSITORY"

  # The Architect app (apps/mobile) to TestFlight on airlock: ios.yml,
  # also dispatchable for an existing tag (`gh workflow run ios.yml -f
  # tag=vX.Y.Z`). The runner holds the App Store Connect key, the
  # distribution identity and the profile: no secrets. Nothing needs it and
  # its job is continue-on-error, so a failed upload never holds the
  # release. Off while the repo variable ARCHITECT_IOS_RELEASE is `false`.
  ios:
    needs: release
    if: ${{ vars.ARCHITECT_IOS_RELEASE != 'false' }}
    uses: ./.github/workflows/ios.yml

  # SHA256SUMS over every asset the release carries, signed with the org's
  # minisign key (the one Task's and Studio's updaters pin) when the
  # tag-only `release-signing` environment has FTS_RELEASE_MINISIGN_KEY;
  # without it the sums go out unsigned, with a warning. Runs after the
  # Mac job too when that one is on (and whether it passed or not).
  # The site (#534): landing, download, changelog, the store and the docs,
  # deployed to Vercel by site.yml once the desktop manifests it reads are
  # up. Without the Vercel secrets its deploy skips with a notice.
  site:
    needs: [web, linux, macos]
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    uses: ./.github/workflows/site.yml
    secrets: inherit

  sums:
    needs: [node, web, linux, macos]
    if: ${{ !cancelled() && needs.node.result == 'success' && needs.web.result == 'success' && needs.linux.result == 'success' }}
    runs-on: [self-hosted, thebattleship-release]
    environment: release-signing
    permissions:
      contents: write
    env:
      # The org key's public half (task apps/server/src/self_update.rs
      # RELEASE_SIGNING_KEY): nothing is signed with any other key.
      ORG_RELEASE_KEY: RWRh9Gk9qaStQMhku4THMidEYrQsmAEsm2dDprUkZxShEtqfIcroM8Od
    steps:
      - name: Sum and sign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_KEY: ${{ secrets.FTS_RELEASE_MINISIGN_KEY }}
        run: |
          set -euo pipefail
          gh() { nix run --quiet nixpkgs#gh -- "$@"; }
          dir="$RUNNER_TEMP/assets"
          rm -rf "$dir" && mkdir -p "$dir" && cd "$dir"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          rm -f SHA256SUMS SHA256SUMS.minisig ./*.sha256
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          assets=(SHA256SUMS)
          if [ -n "$MINISIGN_KEY" ]; then
            minisign() { nix run --quiet nixpkgs#minisign -- "$@"; }
            key="$RUNNER_TEMP/release.key"
            ( umask 077; printf '%s\n' "$MINISIGN_KEY" > "$key" )
            minisign -S -s "$key" -m SHA256SUMS -x SHA256SUMS.minisig -t "architect $GITHUB_REF_NAME SHA256SUMS"
            rm -f "$key"
            minisign -V -P "$ORG_RELEASE_KEY" -m SHA256SUMS -x SHA256SUMS.minisig
            assets+=(SHA256SUMS.minisig)
          else
            echo "::warning::release-signing has no FTS_RELEASE_MINISIGN_KEY: SHA256SUMS goes out unsigned"
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  # @fasttrackstudio/architect (the runtime, no dependencies) and
  # @fasttrackstudio/architect-cli (build-web, with jco), from
  # features/extensions/web (docs/content/guide/extensions-in-your-web-app.md):
  # their version is the tag's; a pre-release (`v1.2.0-rc.1`) goes out
  # under the `next` dist-tag, never `latest`.
  #
  # Three jobs, so the token is near nothing that runs code, and what is
  # published is what was packed before anything else ran:
  # - npm-pack: the version set, the repo's own build script, `npm pack
  #   --ignore-scripts`; no install, no test, no dev dependency has run
  #   when the tarballs are made. Their SHA-256 are its outputs.
  # - npm-test: `npm ci --ignore-scripts` and the unit tests, apart.
  # - npm-publish: in the `npm` environment (restricted to v* tags) that
  #   holds the token, read in ONE step; it checks each tarball's digest
  #   against npm-pack's before `npm publish` (no install, no scripts),
  #   with `id-token: write` (provenance needs a GitHub-hosted runner).
  # Third-party actions are pinned by commit. None of the three feeds the
  # release's assets, so a failed publish cannot fail them, and it shows
  # red. Without NPM_TOKEN on the environment, npm-publish says so and
  # stops. After the first publish (by hand), switch to trusted publishing
  # and drop the token.
  npm-pack:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      runtime_sha256: ${{ steps.pack.outputs.runtime_sha256 }}
      cli_sha256: ${{ steps.pack.outputs.cli_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # Nothing installed, nothing of a test or a dev dependency run: the
      # version, the repo's own build script (instance.js as a string, the
      # licences), the tarballs.
      - name: Pack
        id: pack
        working-directory: features/extensions/web
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --ignore-scripts
          (cd cli && npm version "$version" --no-git-tag-version --ignore-scripts)
          node scripts/build.mjs
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm"
          (cd cli && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm")
          cd "$RUNNER_TEMP/npm"
          sha256sum ./*.tgz
          echo "runtime_sha256=$(sha256sum "fasttrackstudio-architect-$version.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "cli_sha256=$(sha256sum "fasttrackstudio-architect-cli-$version.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm/*.tgz
          retention-days: 7

  npm-test:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Unit tests
        working-directory: features/extensions/web
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:unit

  npm-publish:
    needs: [npm-pack, npm-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NPM_TOKEN lives on this environment (restricted to v* tags), never
    # on the repo: only this job can read it, in one step.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarballs
          path: npm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RUNTIME_SHA256: ${{ needs.npm-pack.outputs.runtime_sha256 }}
          CLI_SHA256: ${{ needs.npm-pack.outputs.cli_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set on the npm environment: @fasttrackstudio/architect was not published for $GITHUB_REF_NAME"
            echo "### npm: not published (no NPM_TOKEN)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          runtime="npm/fasttrackstudio-architect-$version.tgz"
          cli="npm/fasttrackstudio-architect-cli-$version.tgz"
          # What is published is what npm-pack made.
          echo "$RUNTIME_SHA256  $runtime" | sha256sum -c -
          echo "$CLI_SHA256  $cli" | sha256sum -c -
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          # The runtime first: the CLI's users install it beside it.
          npm publish "$runtime" --provenance --access public --tag "$tag" --ignore-scripts
          npm publish "$cli" --provenance --access public --tag "$tag" --ignore-scripts
          echo "### npm: @fasttrackstudio/architect@$version, @fasttrackstudio/architect-cli@$version (\`$tag\`)" >> "$GITHUB_STEP_SUMMARY"
