name: release

# Consumers (task, fasttrackstudio) pin architect by tag, so a tag is the
# unit of release. Push `vX.Y.Z` and this publishes the GitHub release the
# downstream bump refers to.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # The repo's own self-hosted runner on THEBATTLESHIP. Only git and the
    # node-based release action are needed here.
    runs-on: [self-hosted, architect]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: notes
        id: notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "notes<<EOF"
            if [ -n "$prev" ]; then
              echo "Changes since $prev:"
              echo
              git log --no-merges --pretty='- %s' "$prev..${GITHUB_REF_NAME}"
            else
              echo "Initial release."
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
