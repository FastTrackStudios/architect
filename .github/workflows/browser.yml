name: browser

# The web app in a real browser (headless Firefox), the suites that need
# one: a share link opened as its guest (apps/web/test/app-share-guest.test.mjs
# and app-guest-content.test.mjs, #646: `/s/<code>/` is the app's page from
# the node), the web app's extension frame host against hostile bundles
# (apps/web/test/app-ext-host.test.mjs, #495: the release bundle behind a
# front that sends `/_ext/` to the node), and the web app's bottom slots
# following the open note's type (apps/web/test/app-favourites.test.mjs,
# #607). After a merge to main, nightly,
# and by hand on any branch.
#
# On the THEBATTLESHIP pool, in the repo's dev shell (they build the
# island_node example from the workspace, which kache shares with the other
# jobs). Firefox, geckodriver and Node come from the dev shell's own
# nixpkgs pin (devenv.yaml), so they are the ones a local
# `nix build github:NixOS/nixpkgs/<that pin>#firefox` gives.
# ARCHITECT_BROWSER_REQUIRED makes a missing browser a failure, not a skip.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  ARCHITECT_BROWSER_REQUIRED: "1"

jobs:
  share:
    name: The web app in Firefox
    runs-on: [self-hosted, thebattleship]
    timeout-minutes: 45
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/shared-rust
        with:
          kind: browser
      - name: Firefox, geckodriver and Node (the dev shell's nixpkgs)
        run: |
          pin=$(sed -n 's/^ *url: \(github:NixOS\/nixpkgs\/[0-9a-f]*\)$/\1/p' devenv.yaml | head -1)
          test -n "$pin"
          build() { nix build --no-link --print-out-paths "$pin#$1"; }
          echo "FIREFOX=$(build firefox)/bin/firefox" >> "$GITHUB_ENV"
          echo "GECKODRIVER=$(build geckodriver)/bin/geckodriver" >> "$GITHUB_ENV"
          echo "NODE=$(build nodejs_24)/bin/node" >> "$GITHUB_ENV"
      - name: the island node
        run: cargo build -q -p architect-desktop --no-default-features --features vox --example island_node
      # The browser runs outside the dev shell's libraries.
      - name: a share link opened as its guest
        run: |
          bash scripts/web-bundle.sh target/web-bundle
          ARCHITECT_ISLAND_NODE="$CARGO_TARGET_DIR/debug/examples/island_node" ARCHITECT_WEB_BUNDLE="$PWD/target/web-bundle" \
            env -u LD_LIBRARY_PATH "$NODE" --test --test-concurrency=1 apps/web/test/app-share-guest.test.mjs apps/web/test/app-guest-content.test.mjs
      - name: the web app's extension frames against hostile bundles
        if: ${{ !cancelled() }}
        run: |
          test -d target/web-bundle/app || bash scripts/web-bundle.sh target/web-bundle
          ARCHITECT_ISLAND_NODE="$CARGO_TARGET_DIR/debug/examples/island_node" ARCHITECT_WEB_BUNDLE="$PWD/target/web-bundle" \
            env -u LD_LIBRARY_PATH "$NODE" --test --test-concurrency=1 apps/web/test/app-ext-host.test.mjs
      - name: the web app's bottom slots following the open note's type
        if: ${{ !cancelled() }}
        run: |
          test -d target/web-bundle/app || bash scripts/web-bundle.sh target/web-bundle
          ARCHITECT_ISLAND_NODE="$CARGO_TARGET_DIR/debug/examples/island_node" ARCHITECT_WEB_BUNDLE="$PWD/target/web-bundle" \
            env -u LD_LIBRARY_PATH "$NODE" --test --test-concurrency=1 apps/web/test/app-favourites.test.mjs
