# The site (#534): apps/site, a TanStack Start app prerendered to static
# files, with the docs (docs/content, built by `architect site build`) at
# /docs/, deployed to Vercel as prebuilt output (apps/site/scripts/assemble.sh).
# The app (/app) and share links (/s/…) stay on the node: the site
# redirects them there (apps/site/src/content/site.ts `NODE_ORIGIN`).
#
#   pull request   check: bun install (frozen), biome, tsc, build, the
#                  route tree's drift, every internal link and asset;
#                  then a PREVIEW deploy, with the latest release's docs
#                  (its architect-web tarball: no Rust on a hosted runner)
#   release done   PRODUCTION: after release.yml finishes on a v* tag
#                  (workflow_run, so the release's latest-linux.json and
#                  latest-macos.json, which /download reads, are already
#                  up), the docs built with the `architect` CLI at the tag
#   dispatch       PRODUCTION from the dispatched ref, the same way
#
# Every Vercel step needs VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID
# (repo secrets). Without them (and on a fork's pull request, which gets no
# secrets) the deploy SKIPS with a notice and the job stays green.
#
# Public repo: pull-request jobs run on ubuntu-latest (the self-hosted
# runners' gate refuses pull_request events). Production builds the docs on
# the release runners as release.yml's `web` job does: the devenv action,
# the same CARGO_TARGET_DIR (so the CLI release.yml just built is reused),
# `cargo run -p architect-cli -- site build` with web-bundle.sh's arguments.

name: site

on:
  pull_request:
    paths:
      - "apps/site/**"
      - "docs/**"
      - "apps/web/landing/**"
      - ".github/workflows/site.yml"
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: site-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SITE_URL: https://architect.fasttrackstudio.app
  VERCEL_CLI: vercel@65.4.0

jobs:
  check:
    name: site check
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      # The hub (fasttrackstudio.app) does the same; the lockfile is frozen.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint + format
        run: bunx biome ci .
      - name: Typecheck
        run: bunx tsc --noEmit
      # Built from the committed src/data: a PR's check never depends on
      # GitHub's API.
      - name: Build
        run: bun run build
      # The route tree is committed and generated by the Vite plugin during
      # the build (not the standalone `tsr generate`), so compare after it.
      - name: Route tree is up to date
        run: git diff --exit-code -- src/routeTree.gen.ts
      - name: Links and assets resolve
        run: bun scripts/check-links.ts .output/public

  preview:
    name: site preview
    needs: check
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: apps/site
    steps:
      - name: Vercel secrets
        id: vercel
        working-directory: .
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::site: VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not set (or this is a fork's PR): no preview deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.vercel.outputs.deploy == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.vercel.outputs.deploy == 'true'
        with:
          bun-version: latest
      - name: Build
        if: steps.vercel.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          GITHUB_TOKEN="$GH_TOKEN" bun run data
          bun run build
      # A preview carries the latest release's docs (the architect-web
      # bundle's docs/): a hosted runner has no `architect` CLI, and a cold
      # Rust build is not worth a preview. A PR's own docs changes show in
      # production, after the release that ships them.
      - name: Docs from the latest release
        if: steps.vercel.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/web"; mkdir -p "$d"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'architect-web-*.tar.gz' --dir "$d"
          tar -xzf "$d"/architect-web-*.tar.gz -C "$d"
          index="$(find "$d" -mindepth 3 -maxdepth 3 -path '*/docs/index.html' | head -1)"
          [ -n "$index" ] || { echo "::error::site: no docs/ in the release's architect-web bundle"; exit 1; }
          echo "DOCS_DIR=$(dirname "$index")" >> "$GITHUB_ENV"
      - name: Assemble
        if: steps.vercel.outputs.deploy == 'true'
        run: |
          bash scripts/assemble.sh
          # The release's docs can lag this PR's links into them: warn here,
          # the production build (docs from the same commit) fails on it.
          bun scripts/check-links.ts .vercel/output/static \
            || echo "::warning::site: a link into the latest release's docs does not resolve (see above)"
      - name: Deploy the preview
        if: steps.vercel.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          url="$(bunx "$VERCEL_CLI" deploy --prebuilt --token="$VERCEL_TOKEN" --yes)"
          echo "::notice::site preview: $url"
          echo "### Site preview: $url" >> "$GITHUB_STEP_SUMMARY"

  production:
    name: site production
    # After a successful release (release.yml runs only on v* tags), or by hand.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           startsWith(github.event.workflow_run.head_branch, 'v')) }}
    # Reserved capacity, as release.yml's jobs.
    runs-on: [self-hosted, thebattleship-release]
    timeout-minutes: 90
    environment:
      name: site
      url: https://architect.fasttrackstudio.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Vercel secrets
        id: vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::site: VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not set: no production deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.vercel.outputs.deploy == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      # The release runners carry no devenv, bun or node of their own.
      - uses: ./.github/actions/devenv
        if: steps.vercel.outputs.deploy == 'true'
      - name: bun and node
        if: steps.vercel.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          rev=github:NixOS/nixpkgs/e62746b0b472753ef019baceab6f1e2e52014980
          for pkg in bun nodejs_22; do
            echo "$(nix build --no-link --print-out-paths "$rev#$pkg")/bin" >> "$GITHUB_PATH"
          done
      # release.yml's `web` job, the docs part of scripts/web-bundle.sh: the
      # same target dir, so the CLI it built for this tag is reused.
      - name: Build the docs
        if: steps.vercel.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="${CI_CACHE_DIR:-$RUNNER_TEMP}/architect-web/$RUNNER_NAME/target"
          mkdir -p "$CARGO_TARGET_DIR"
          devenv shell -- cargo run -q -p architect-cli -- site build \
            --vault docs/content --out "$RUNNER_TEMP/docs" --base /docs/ \
            --extension apps/sandbox/board --url "$SITE_URL/docs/" > /dev/null
          echo "DOCS_DIR=$RUNNER_TEMP/docs" >> "$GITHUB_ENV"
      - name: Build the site
        if: steps.vercel.outputs.deploy == 'true'
        working-directory: apps/site
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run data
          bun run build
          bash scripts/assemble.sh
          bun scripts/check-links.ts .vercel/output/static
      - name: Deploy to production
        if: steps.vercel.outputs.deploy == 'true'
        working-directory: apps/site
        run: |
          set -euo pipefail
          url="$(bunx "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes)"
          echo "::notice::site production: $url"
          echo "### Site production: $url" >> "$GITHUB_STEP_SUMMARY"
