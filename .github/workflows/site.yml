# The site (#534): apps/site, a TanStack Start app prerendered to static
# files. It ships in the release's web bundle (scripts/web-bundle.sh, built
# by release.yml's `web` job): the root of architect-web-<X.Y.Z>.tar.gz,
# with the docs at /docs/ and the web app at /app/, which the VPS serves as
# static files (scripts/web-routes.md). This workflow deploys nothing.
#
#   pull request   bun install (frozen), biome, tsc, the unit tests, build,
#                  the route tree's drift, every internal link and asset,
#                  /download in a headless Firefox with GitHub's API
#                  stubbed (apps/site/test/download.browser.mjs); then the
#                  web bundle assembled by scripts/web-bundle.sh around this
#                  build, with the latest release's docs and bound wasm (no
#                  Rust on a hosted runner), served by the bundle's rules
#                  (apps/site/scripts/serve.ts) and checked
#                  (scripts/check-web-bundle.sh)
#
# Public repo: pull-request jobs run on ubuntu-latest (the self-hosted
# runners' gate refuses pull_request events).

name: site

on:
  pull_request:
    paths:
      - "apps/site/**"
      - "apps/web/**"
      - "docs/**"
      - "scripts/web-bundle.sh"
      - "scripts/web-routes.md"
      - "scripts/check-web-bundle.sh"
      - ".github/workflows/site.yml"

concurrency:
  group: site-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: site check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      # The hub (fasttrackstudio.app) does the same; the lockfile is frozen.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint + format
        run: bunx biome ci .
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bun run test
      # Built from the committed src/data: a PR's check never depends on
      # GitHub's API (a release's build fetches its own, strictly).
      - name: Build
        run: bun run build
      # The route tree is committed and generated by the Vite plugin during
      # the build (not the standalone `tsr generate`), so compare after it.
      - name: Route tree is up to date
        run: git diff --exit-code -- src/routeTree.gen.ts
      - name: Links and assets resolve
        run: bun scripts/check-links.ts .output/public
      # The runner image's Firefox; Node 24 for its WebSocket.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: /download in a browser
        run: |
          set -euo pipefail
          firefox --version
          SCREENSHOTS="$RUNNER_TEMP/shots" node --test test/download.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: download-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      # The bundle as the release builds it, but for the two Rust pieces:
      # the latest release's docs and bound wasm stand in for them.
      - name: Web bundle
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/release"; mkdir -p "$d"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'architect-web-*.tar.gz' --dir "$d"
          tar -xzf "$d"/architect-web-*.tar.gz -C "$d"
          prev="$(dirname "$(find "$d" -mindepth 3 -maxdepth 3 -path '*/app/index.html' | head -1)")/.."
          ARCHITECT_SITE=apps/site/.output/public ARCHITECT_WEB_BOUND="$prev/app" ARCHITECT_DOCS="$prev/docs" \
            bash scripts/web-bundle.sh "$RUNNER_TEMP/web-bundle"
          bash scripts/check-web-bundle.sh "$RUNNER_TEMP/web-bundle"
