name: devenv
description: Put the pinned devenv on PATH (the same pin as shared-rust), for jobs that call `devenv shell` without the shared Rust setup.
runs:
  using: composite
  steps:
    # devenv 2.4.0 from the nixpkgs revision devenv-fleet's pins.json names;
    # keep it the same as .github/actions/shared-rust's `devenv` step.
    - name: devenv
      shell: bash
      run: |
        set -euo pipefail
        out=$(nix build --no-link --print-out-paths \
          github:NixOS/nixpkgs/e62746b0b472753ef019baceab6f1e2e52014980#devenv)
        echo "$out/bin" >> "$GITHUB_PATH"
        "$out/bin/devenv" version
