name: Shared THEBATTLESHIP Rust
description: Enter the native-library shell, install the pinned toolchain and use a slot-local target backed by host kache.
inputs:
  kind:
    description: Build kind (lint, test, wasm, tags).
    required: true
runs:
  using: composite
  steps:
    - name: Slot target directory
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
      run: |
        set -euo pipefail
        dir="${CI_CACHE_DIR:?not a shared THEBATTLESHIP runner}/$KIND/$RUNNER_NAME/target"
        mkdir -p "$dir"
        echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
        test -n "${RUSTC_WRAPPER:?host kache wrapper is required}"
    - uses: nicknovitski/nix-develop@v1
      with:
        # Libraries only: keep the same pinned rustup compiler as hosted CI.
        arguments: --accept-flake-config
    - name: Let rustup install under the runner's work-dir HOME
      shell: bash
      # Each runner sets HOME to its own work dir, not the service user's
      # passwd home, and rustup-init refuses that ("$HOME differs from
      # euid-obtained home directory") on a runner with no rustup yet.
      run: echo RUSTUP_INIT_SKIP_SUDO_CHECK=yes >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
