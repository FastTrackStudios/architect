name: Shared THEBATTLESHIP Rust
description: Put the pinned devenv on PATH, evaluate the repo's devenv shell and use a slot-local target backed by host kache.
inputs:
  kind:
    description: Build kind (lint, test, wasm, tags).
    required: true
runs:
  using: composite
  steps:
    - name: Slot target directory
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
      run: |
        set -euo pipefail
        dir="${CI_CACHE_DIR:?not a shared THEBATTLESHIP runner}/$KIND/$RUNNER_NAME/target"
        mkdir -p "$dir"
        echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
        test -n "${RUSTC_WRAPPER:?host kache wrapper is required}"
    # devenv 2.4.0 from the nixpkgs revision devenv-fleet's pins.json names
    # (`devenv.nixpkgs`), until the runner units carry devenv themselves. A
    # store path the host already has, so this is an evaluation, not a build.
    - name: devenv
      shell: bash
      run: |
        set -euo pipefail
        out=$(nix build --no-link --print-out-paths \
          github:NixOS/nixpkgs/e62746b0b472753ef019baceab6f1e2e52014980#devenv)
        echo "$out/bin" >> "$GITHUB_PATH"
        "$out/bin/devenv" version
    # The dev shell every checkout gets (devenv.nix, devenv-fleet's `rust`):
    # rust 1.99.1, the native libraries and mold. The job's steps run inside
    # it (`shell: devenv shell -- bash -e {0}`); this step evaluates it once
    # and asserts the rustc is devenv-fleet's pinned store path, the same
    # one a local shell gets, so kache's CI and local entries are shared.
    - name: dev shell
      shell: devenv shell -- bash -e {0}
      run: fleet-doctor
