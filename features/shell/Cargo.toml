[package]
name = "architect-shell"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The app shell: a page's title and actions at the top, tabs and a separate button at the bottom, a sidebar on each side, laid out per form factor"

# docs/content/architecture/app-shell.md. The default set is the contract
# (the screen, its form factor and insets, the style): pure data,
# wasm-clean. `ui` adds the Dioxus components.

[features]
default = []
ui = [
    "dep:dioxus",
    "dep:lucide-dioxus",
    "dep:futures-timer",
    "dep:web-time",
    "dep:futures-channel",
    "dep:futures-util",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-ui-kit",
    "dep:block2",
    "dep:tracing",
    "dep:objc2-foundation",
    "dep:raw-window-handle",
]

[dependencies]
dioxus = { workspace = true, optional = true }
lucide-dioxus = { workspace = true, optional = true }
# The drawers ease in a frame at a time (src/shell/motion.rs).
futures-timer = { workspace = true, optional = true }
# The motion clock's wall time, a browser's too.
web-time = { version = "1.1", optional = true }
# The keyboard's height and the text focus, reported from any host and
# heard by the shell (src/shell/keyboard.rs).
futures-channel = { version = "0.3", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }

# A Mac window's own title bar: the traffic lights placed in the shell's
# title row (src/shell/mac.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSAccessibility",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSGeometry",
] }
raw-window-handle = { version = "0.6", optional = true }

# iOS: the keyboard's frame from UIKit's notifications, and a web view's
# own accessory bar taken away (src/shell/keyboard/ios.rs).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "block2",
    "NSDictionary",
    "NSNotification",
    "NSOperation",
    "NSSet",
    "NSString",
    "NSValue",
] }
objc2-ui-kit = { workspace = true, optional = true, default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "UIApplication",
    "UIGeometry",
    "UIResponder",
    "UIScene",
    "UIScreen",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
] }
block2 = { version = "0.6", optional = true }
tracing = { workspace = true, optional = true }

# A timer needs the browser's clock on wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { workspace = true, optional = true, features = ["wasm-bindgen"] }

[lib]
doctest = false

[lints]
workspace = true
