[package]
name = "architect-files"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Files: an org's roots of files and folders, versions and their labels, resumable uploads and ranged reads over vox, quotas, and members' access by role and per-folder grants"

# docs/content/architecture/documents.md, "Files". The default set is the
# contract — ids, paths, the model, the fault, capabilities by role and
# the access resolution — pure data, wasm-clean. `vox` is the service
# trait (bytes ride its channels), its client stubs and `FilesClient`,
# the store an app talks to (still wasm-clean). `server` (native) is the
# feature a server mounts: every org's files kept under `OrgId::path`,
# bytes in the content-addressed blob store documents share, access by
# the caller's role in the org and the grants on its folders, and the
# renditions a pluggable transcoder makes of its media. `http` (native) is
# the byte face a browser reads by range; `ffmpeg` (native) the transcoder
# that runs the `ffmpeg` on PATH.

[features]
default = []
vox = ["dep:vox", "architect/vox", "dep:architect-permissions", "dep:futures-util", "dep:sha2"]
server = [
    "vox",
    "architect/blob",
    "architect-orgs/server",
    "dep:base64",
    "dep:facet-json",
    "dep:hmac",
    "dep:rand",
    "dep:tokio",
    "uuid/v4",
]
http = ["server", "architect/http"]
ffmpeg = ["server", "tokio/process"]
# Synced roots (`sync`, native): projects and asset libraries as Loro
# manifests on the peer lanes, bytes in the blob store and in place in
# the working copies; docs/content/architecture/project-files.md.
# The files agent's service (`agent`): FILES_* and its HTTP face; the
# window's client turns on `architect/http-client` itself.
agent = ["vox", "architect/action-list"]
# The drive (`drive`, Linux and macOS): every root a device knows mounted
# as a real folder over FUSE (`fuser`, no libfuse needed; mounting goes
# through the setuid `fusermount3`).
drive = ["sync", "dep:fuser", "dep:libc"]
sync = ["http", "agent", "dep:loro", "dep:ed25519-dalek", "dep:memchr", "dep:tracing", "dep:tokio-util", "dep:httpdate", "dep:percent-encoding", "uuid/v5", "tokio/macros", "tokio/time"]
# The S3 face over the synced roots (`sync::s3`): `s3s` speaks the API
# and checks SigV4; hyper-util serves it on its own port.
s3 = ["sync", "architect/blob-s3", "dep:s3s", "dep:bytes", "dep:async-trait", "dep:hyper-util", "dep:md-5", "tokio/net"]

[dependencies]
architect = { workspace = true }
architect-orgs = { workspace = true }
facet = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", default-features = false }
vox = { workspace = true, optional = true }
# `vox`: the gate's permit tables for the service.
architect-permissions = { workspace = true, optional = true }
# `FilesClient`: an upload's sender and the call that takes its frames
# run side by side, on any executor (no runtime's `spawn`, so wasm too).
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
# `FilesClient` names what it saves by its sha256, as the server's blob
# store does, so content the org already holds is not sent again.
sha2 = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `sync`: a root's manifest is a Loro document; the app hands the engine
# the one its registry holds, so this crate needs loro alone, not crdt.
loro = { workspace = true, optional = true }
# `sync`'s WebDAV face: a `PUT` streamed into the store, dates and hrefs.
tokio-util = { version = "0.7", features = ["io"], optional = true }
httpdate = { version = "1", optional = true }
percent-encoding = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# `s3`: the S3 API (Apache-2.0), served over hyper-util; a part's ETag is its MD5.
s3s = { version = "0.17", default-features = false, optional = true }
bytes = { version = "1", optional = true }
async-trait = { workspace = true, optional = true }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"], optional = true }
md-5 = { version = "0.10", optional = true }
# `sync`: a holder signs its attestations with its (iroh) ed25519 key;
# the registry's search is `memmem` over each root's haystack.
ed25519-dalek = { version = "3", optional = true }
memchr = { version = "2", optional = true }
# `server`: read tickets are signed (HMAC-SHA256) with a key the server
# holds, and travel as URL-safe base64.
base64 = { workspace = true, optional = true }
facet-json = { version = "0.50.0-rc.5", optional = true }
hmac = { version = "0.12", optional = true }
rand = { workspace = true, optional = true }
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "rt", "sync"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

# `drive`: FUSE. Linux mounts through the setuid fusermount3, no libfuse.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
fuser = { version = "0.18", optional = true }

# On a Mac fuser links macFUSE's libfuse at build time; built without it
# (`macos-no-mount`) everything compiles and `drive::mount` says why it
# cannot. The Mac's drive is a File Provider (docs/content/features/drive.md).
[target.'cfg(target_os = "macos")'.dependencies]
fuser = { version = "0.18", optional = true, features = ["macos-no-mount"] }

[dev-dependencies]
# `tests/copies.rs`: a bucket as a holder, against an S3 server in process.
s3s-fs = { version = "0.17", default-features = false }
# The tests drive the server and the client: build them with both.
architect-files = { path = ".", features = ["server", "http", "ffmpeg", "sync", "drive", "s3"] }
architect = { workspace = true, features = ["vox", "local", "http", "http-client"] }
architect-permissions = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# `tests/s3.rs`: a real S3 client, signing with SigV4.
object_store = { version = "0.14", default-features = false, features = ["aws"] }
futures = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
vox = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../workspace-hack" }
