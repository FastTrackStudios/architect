[package]
name = "architect-scene"
description = "Scenes as they cross a boundary: a binary fragment of drawing commands, named by the hash of its bytes, with the fonts and images it draws named by theirs and sent once. What a runtime extension's view (a process, a WASI component, a page) sends its host, and what a linked one skips. Wasm-clean: anyrender's commands in, the same commands out."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# docs/content/features/remote-views.md ("Fragments"). No host, no Dioxus,
# no serde: a writer and a checked reader over bytes, so a guest in any
# runtime and a host on any renderer share one format.

[lib]
doctest = false

[features]
default = []
# The contract a view mounts through (`view::ViewCtx`): the host's Action
# List, a document and its history, the theme's tokens. Wasm-clean, no
# Dioxus.
ctx = [
    "dep:architect",
    "dep:crdt",
    "dep:architect-theme",
    "dep:architect-views",
    "dep:facet",
    "dep:facet-json",
]
# A view that paints a scene each frame (`paint::PaintView`, `Painter`,
# `Marks`).
paint = ["ctx"]
# Drawn in-process by Blitz (`paint::PaintPane`, a `PaintWidget`), told its
# pane and theme by the shell (`paint::Chrome`).
paint-ui = ["paint", "dep:dioxus", "dep:blitz-dom", "dep:blitz-traits", "dep:cursor-icon", "dep:dioxus-native-dom"]
# A host-driven WebGL2 canvas for paint scenes (wasm32 only).
paint-web = ["paint", "dep:anyrender_vello_hybrid", "dep:vello_gpu", "dep:vello_common", "dep:rustc-hash", "dep:web-sys", "dep:wasm-bindgen"]
# Dioxus canvas, DOM input and demand-driven browser frames.
paint-web-ui = ["paint-web", "dep:dioxus", "dioxus/web", "dep:js-sys"]

[dependencies]
anyrender = { workspace = true }
peniko = { workspace = true }
blake3 = { version = "1.8", default-features = false }
thiserror = { workspace = true }
# The app's one wall clock (`anim::wall_seconds`), a browser's too.
web-time = "1.1"
architect = { workspace = true, optional = true, features = ["action-list"] }
architect-theme = { workspace = true, optional = true }
architect-views = { workspace = true, optional = true }
# A host's typed data, as JSON (`view::HostData`).
facet = { workspace = true, optional = true }
facet-json = { version = "0.50.0-rc.5", optional = true }
crdt = { workspace = true, optional = true }
dioxus = { workspace = true, optional = true }
blitz-dom = { workspace = true, optional = true, features = ["custom-widget"] }
blitz-traits = { workspace = true, optional = true }
cursor-icon = { workspace = true, optional = true }
dioxus-native-dom = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
anyrender_vello_hybrid = { version = "=0.11.0", optional = true, features = ["webgl"] }
vello_gpu = { version = "0.3", optional = true, features = ["webgl"] }
vello_common = { version = "0.3", optional = true }
rustc-hash = { version = "2", optional = true }
web-sys = { version = "0.3", optional = true, features = ["HtmlCanvasElement", "WebGl2RenderingContext", "Window", "Location", "Element", "DomRect", "PointerEvent", "WheelEvent", "KeyboardEvent", "CompositionEvent"] }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

# A table an engine in another process shares (`engine::shared`).
[target.'cfg(all(unix, not(target_family = "wasm")))'.dependencies]
memmap2 = "0.9"

[dev-dependencies]
# tests/shared.rs: a table's file in a directory of its own.
tempfile = "3"
# The view contract's and the paint model's own tests.
architect-scene = { path = ".", features = ["ctx", "paint"] }
anyrender_vello_cpu = { workspace = true }

[lints]
workspace = true

