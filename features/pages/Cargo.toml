[package]
name = "architect-pages"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pages as editable files: a view written as TSX/JS on QuickJS, Luau elements or A2UI JSON, re-rendered live on save, drawn as the remote-view edit stream"

# docs/content/architecture/pages.md. The default set is the model, pure
# data: the page API (`api`, `#[architect::rpc]` services over facet
# types), the element tree and its diff into `wire::Edit`s (`tree`,
# `diff`), and where a view's page file is (`files`). `codegen` writes
# `architect.d.ts` and `architect.d.luau` from the services' vox
# descriptors; `js` runs a page on QuickJS (one runtime per page, on a
# thread of its own) with TSX transpiled by oxc; `luau` runs Luau element
# pages; `ui` mounts a page in a pane (a Blitz sub-document, as a process
# view's). `.a2ui.json` pages are named but not yet run.

[features]
default = []
vox = ["architect/vox", "dep:vox"]
codegen = ["vox", "dep:vox-codegen", "dep:vox-types"]
js = [
    "dep:rquickjs",
    "dep:oxc_allocator",
    "dep:oxc_parser",
    "dep:oxc_semantic",
    "dep:oxc_transformer",
    "dep:oxc_codegen",
    "dep:oxc_span",
    "dep:oxc_diagnostics",
    "runner",
]
luau = ["runner"]
# What every runner shares: the page thread's loop, the host service.
runner = [
    "dep:architect-scripting",
    "architect-scripting/luau",
    "dep:futures",
    "dep:tokio",
    "dep:tracing",
]
# The extensions manager's `pages` kind and `EXT_CHECK`'s page half
# (`manage`).
manager = ["runner", "architect-extensions/manager"]
ui = [
    "runner",
    "dep:dioxus",
    "dep:futures-timer",
    "dep:blitz-dom",
    "dep:dioxus-native-dom",
    "architect-extensions/remote",
    "architect-extensions/ui",
    "dep:architect-shell",
    "architect-shell/ui",
    "architect-theme/dioxus",
]

[dependencies]
architect = { workspace = true, features = ["action-list"] }
# The edit stream a page renders as (`wire`), the manifest's views.
architect-extensions = { workspace = true, features = ["vox"] }
architect-theme = { workspace = true }
architect-workspace = { workspace = true }
facet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
vox = { workspace = true, optional = true }
vox-codegen = { version = "0.10.0-rc.7", optional = true }
vox-types = { workspace = true, optional = true }
architect-scripting = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# QuickJS (quickjs-ng), built from source: one runtime per page.
rquickjs = { version = "0.14", optional = true, features = ["loader"] }
# TypeScript/TSX to JS in Rust: strip types, JSX to `h(...)`.
oxc_allocator = { version = "0.157", optional = true }
oxc_parser = { version = "0.157", optional = true }
oxc_semantic = { version = "0.157", optional = true }
oxc_transformer = { version = "0.157", optional = true }
oxc_codegen = { version = "0.157", optional = true }
oxc_span = { version = "0.157", optional = true }
oxc_diagnostics = { version = "0.157", optional = true }
dioxus = { workspace = true, optional = true }
futures-timer = { workspace = true, optional = true }
architect-shell = { workspace = true, optional = true }
blitz-dom = { workspace = true, optional = true }
dioxus-native-dom = { workspace = true, optional = true }

[dev-dependencies]
# A window to mount pages in, headless (`tests/pane.rs`).
architect-extensions = { workspace = true, features = ["host", "linked", "ui", "remote", "manager", "page"] }
architect-settings = { workspace = true }
blitz-traits = { workspace = true }
architect-scripting = { workspace = true, features = ["luau"] }
architect-pages = { path = ".", features = ["codegen", "js", "luau", "ui", "manager"] }
futures = "0.3"
tempfile = "3"
tokio = { workspace = true }

[lib]
doctest = false

# rquickjs ships its C bindings for the Mac, Linux, Windows and wasm, not
# for iOS: there they are generated at build time (bindgen, libclang).
[target.'cfg(target_os = "ios")'.dependencies]
rquickjs = { version = "0.14", optional = true, features = ["loader", "bindgen"] }

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../workspace-hack" }
