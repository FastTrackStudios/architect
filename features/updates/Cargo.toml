[package]
name = "architect-updates"
description = "Updates, a built-in architect extension: the Architect app checks for a newer signed release, tells the person, and on Install downloads, verifies (architect::release, the org key) and installs it for the next start, into the Nix launcher's update dir or over the AppImage (features/updates/extension.toml, #523)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "architect-updates"
path = "src/main.rs"

[features]
default = []
# The network half: checks, downloads and installs (reqwest, a tokio
# runtime). The app crate turns it on, as it does
# `architect-extensions/net`; the UI crate's own build stays without it.
release = ["dep:architect", "dep:tokio", "dep:chrono", "dep:tracing"]

[dependencies]
# The trait and the guest (its process copy); the app adds `linked`.
architect-extensions = { workspace = true, features = ["guest"] }
dioxus = { workspace = true }
futures-timer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
architect = { workspace = true, features = ["release"], optional = true }
chrono = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
architect = { workspace = true, features = ["release", "action-list"] }
architect-extensions = { workspace = true, features = ["host", "linked"] }
architect-settings = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
blake2 = "0.10"
ed25519-dalek = "3"
futures = "0.3"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "install"
required-features = ["release"]

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../workspace-hack" }
