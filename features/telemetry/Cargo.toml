[package]
name = "architect-telemetry"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Native-only Sentry error/crash telemetry for the Task apps. The DSN is
# never committed — it is read from the build-time `TASK_SENTRY_DSN`
# (baked into shipped clients) or the runtime env (server). wasm targets
# get no-op stubs so callers compile cross-target.

[features]
# OpenTelemetry OTLP export (traces + logs + metrics), opt-in at build
# time (the server enables it) and again at runtime via
# OTEL_EXPORTER_OTLP_ENDPOINT — unset means fully inert, matching the
# Sentry no-DSN-no-telemetry pattern.
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry-appender-tracing",
  "dep:tracing-opentelemetry",
]

# The crash flight recorder (`flight`): a `tracing` ring layer, a panic
# hook that writes `crash.log` + `flight-log.txt` into the app dir, and
# `restore_previous`. Native only; adds no dependency.
flight = []

[dependencies]
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sentry.workspace = true
sentry-tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "registry"] }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# tests/flight.rs: the recorder alongside `host::install_panic_logger`.
architect = { workspace = true, features = ["host"] }
tempfile = "3"
tracing-subscriber = { workspace = true, features = ["registry"] }

[[test]]
name = "flight"
required-features = ["flight"]

[lints]
workspace = true
