[package]
name = "architect-commands"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Commands: the ⌘K palette, ⌘O open-anything, the action list window and custom actions, over the Action List"

# docs/content/architecture/actions-everywhere.md. The default set is the
# model — fuzzy matching, the palette's query and ranking, recents,
# openers, custom actions — pure data, wasm-clean. `ui` adds the palette,
# quick open and the action list window, drawn by the shell.

[features]
default = []
# Keys heard from the window (Blitz delivers a key to the DOM only through
# what has the focus): `WindowKeys`, for a native app.
native = [
    "ui",
    "dep:dioxus-native",
    "dep:futures-timer",
    "dep:muda",
    "dep:zbus",
    "dep:tokio",
    "dep:tracing",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-ui-kit",
    "dep:block2",
]
ui = [
    "dep:dioxus",
    "architect-input/dioxus",
    "dep:architect-shell",
    "architect-shell/ui",
    "dep:lucide-dioxus",
    "dep:architect",
    "dep:futures-channel",
    "dep:futures-util",
    # The confirmation sheet's poll and countdown (src/confirm.rs).
    "dep:futures-timer",
]

[dependencies]
facet = { workspace = true }
facet-json = { version = "0.50.0-rc.5" }
# The keymap engine: a command's keys, sequences, contexts and held tools.
architect-input = { workspace = true }
# An action's params schema, read to ask for its arguments (src/params.rs).
serde = { workspace = true }
serde_json = { workspace = true }
dioxus = { workspace = true, optional = true }
architect-shell = { workspace = true, optional = true }
lucide-dioxus = { workspace = true, optional = true }
dioxus-native = { workspace = true, optional = true }
futures-timer = { workspace = true, optional = true }
# The commands on an Action List (src/bridge.rs): a run asked from any
# thread, answered from the window's.
futures-channel = { version = "0.3", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
# The app's Action List: every action listed in the palette and run by it.
architect = { workspace = true, optional = true, features = ["action-list"] }

# The native menu bar, drawn by AppKit (src/native_menu.rs).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19", optional = true, default-features = false }

# The iPadOS menu bar, built with UIMenuBuilder (src/ios_menu.rs).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSArray", "NSString"] }
objc2-ui-kit = { workspace = true, optional = true, default-features = false, features = [
    "std",
    "block2",
    "UIAction",
    "UIApplication",
    "UIImage",
    "UIMenu",
    "UIMenuBuilder",
    "UIMenuElement",
    "UIMenuSystem",
    "UIResponder",
] }
block2 = { version = "0.6", optional = true }
tracing = { workspace = true, optional = true }

# The Linux menu bar, exported over dbusmenu (src/linux_menu.rs).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", optional = true, default-features = false, features = ["tokio"] }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# A caller from outside, an authorizer (tests/run_effects.rs).
architect-permissions = { workspace = true }
# Drives the window's thread while an agent's call waits.
tokio = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../workspace-hack" }
