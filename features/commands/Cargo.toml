[package]
name = "architect-commands"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Commands: the ⌘K palette, ⌘O open-anything, the action list window and custom actions, over the Action List"

# docs/content/architecture/actions-everywhere.md. The default set is the
# model — fuzzy matching, the palette's query and ranking, recents,
# openers, custom actions — pure data, wasm-clean. `ui` adds the palette,
# quick open and the action list window, drawn by the shell.

[features]
default = []
# Keys heard from the window (Blitz delivers a key to the DOM only through
# what has the focus): `WindowKeys`, for a native app.
native = ["ui", "dep:dioxus-native", "dep:futures-timer", "dep:muda"]
ui = [
    "dep:dioxus",
    "architect-input/dioxus",
    "dep:architect-shell",
    "architect-shell/ui",
    "dep:lucide-dioxus",
    "dep:architect",
]

[dependencies]
facet = { workspace = true }
facet-json = { version = "0.50.0-rc.5" }
# The keymap engine: a command's keys, sequences, contexts and held tools.
architect-input = { workspace = true }
# An action's params schema, read to ask for its arguments (src/params.rs).
serde = { workspace = true }
serde_json = { workspace = true }
dioxus = { workspace = true, optional = true }
architect-shell = { workspace = true, optional = true }
lucide-dioxus = { workspace = true, optional = true }
dioxus-native = { workspace = true, optional = true }
futures-timer = { workspace = true, optional = true }
# The app's Action List: every action listed in the palette and run by it.
architect = { workspace = true, optional = true, features = ["action-list"] }

# The native menu bar, drawn by AppKit (src/native_menu.rs).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19", optional = true, default-features = false }

[lib]
doctest = false

[lints]
workspace = true
