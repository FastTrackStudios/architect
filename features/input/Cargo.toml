[package]
name = "architect-input"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Keymap engine: key trie, modal input processor, which-key, bound to Action List ids"

# architect-input — moved from studio's `features/input` (STA-381, #50).
# The default set is the engine: framework-agnostic and wasm-clean (no
# clock, no file IO, no runtime). `dioxus` adds DOM event conversion and
# the `use_input_processor` hook (L4).

[features]
default = []
dioxus = ["dep:dioxus", "dep:tokio", "dep:gloo-timers"]

[dependencies]
facet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
dioxus = { workspace = true, optional = true }

# The hook's sequence timeout: tokio's timer on native (no runtime
# features; the Dioxus host provides one), the browser timer on wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["time"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"], optional = true }

[dev-dependencies]
# Drives the hook's sequence timer in `tests/hook.rs`.
tokio = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true
