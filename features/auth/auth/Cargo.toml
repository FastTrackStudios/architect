[package]
name = "auth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
percent-encoding = { workspace = true }
auth-proto.workspace = true
auth-db = { workspace = true, optional = true }
async-trait.workspace = true
argon2.workspace = true
axum = { workspace = true, optional = true }
base64.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
cookie.workspace = true
hkdf.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sea-orm = { workspace = true, optional = true }
sea-orm-migration = { workspace = true, optional = true }
sha2.workspace = true
subtle.workspace = true
sha1.workspace = true
thiserror.workspace = true
hex.workspace = true
k256.workspace = true
sha3.workspace = true
totp-rs.workspace = true
webauthn-rs.workspace = true
# A native app's loopback redirect, matched on any port (RFC 8252 §7.3).
url = "2"
uuid.workspace = true
vox = { workspace = true, optional = true }
# Serving the services over vox (`vox_host`): a WebSocket, or in-process.
vox-core = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }
facet = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = []
backend-db = ["dep:auth-db", "dep:sea-orm", "dep:sea-orm-migration", "auth-proto/server"]
vox = ["dep:vox", "auth-proto/vox"]
axum = ["vox", "dep:axum", "dep:vox-core", "dep:vox-types", "dep:facet", "dep:futures", "dep:tokio", "dep:tracing", "auth-proto/http"]
full = ["backend-db", "vox", "axum", "auth-proto/full"]

[dev-dependencies]
proptest.workspace = true
tokio.workspace = true
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }

[lints]
workspace = true

