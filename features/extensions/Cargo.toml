[package]
name = "architect-extensions"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Extensions: adding to an app at run time — data, Luau, WASM and processes — from git registries and ReaPack, hot-reloaded, installed when a project needs them"

# docs/content/architecture/extensions.md. The default set is the model —
# a manifest (`extension.toml`) and what it adds, a registry's index and
# search, ReaPack's `index.xml`, which copy wins (built in, installed, in
# development), what a project needs and an organization approves — pure
# data, wasm-clean. `host` loads extensions onto an Action List and a
# settings registry, installs them from git registries, folders and
# ReaPack, and reloads them when their files change; `crdt` keeps a
# project's requirements and an extension's data in its document; `ui`
# brings loaded extensions' settings sections onto the settings page.
# Remote views, desk only: `process` runs process extensions for the host
# (started, spoken to over vox on a local socket, supervised); `guest` is
# the other end, a process extension's `main`, rendering its Dioxus views
# into an edit stream; `remote` mounts those views in the host's Blitz
# document, a sub-document per pane.

[features]
default = []
host = [
    "dep:architect",
    # The documents service (`docs_service`): the host reaches the app's
    # documents and extensions' data only through its client, served
    # in-process on a runtime of its own.
    "dep:architect-documents",
    "architect/local",
    # Native only (`tokio` is a native dependency): the runtime its
    # in-process server runs on; a browser's host serves it with
    # `spawn_local`.
    "dep:tokio",
    # The vault's query service: the host holds its client
    # (`Host::with_vault_query`), answering `query_vault`.
    "dep:vault-proto",
    "dep:architect-scripting",
    "architect-scripting/luau",
    "dep:tracing",
    # `EXT_CHECK` answers from a thread of its own.
    "dep:futures",
    # Signed `.archext` archives: checked on install, whichever way they came.
    "archive",
    # A toolbar button's image file, as a `data:` URI; a fetched body as
    # base64 (`net`).
    "dep:base64",
    # The secrets the host keeps for extensions (`net::Secrets`):
    # `architect::settings`' private files.
    "architect/settings",
    # Extensions' OSC endpoints over UDP (`ports`): std only.
    "architect-input/udp",
]
# Extensions' HTTP fetches (`net`'s client: reqwest, on a runtime of its
# own). Off in `host`, `ui` and `page`: reqwest reaches tower-http, which
# a UI crate must not (`cargo xtask boundaries`, ui-reach); the app that
# runs extensions turns it on (the lab does). Without it a fetch answers
# `unsupported`.
net = ["host", "dep:reqwest", "dep:tokio"]
# Language servers through the host (#512, `crate::lsp`): a language's
# `[languages.server]` run per root while a code editor of it is open,
# stopped with its extension; the `EDITOR_*` actions. Native only.
lsp = ["host", "architect-editor/lsp"]
# The `.archext` archive (`architect-extension-archive`): open, verify,
# extract per platform. On with `host`.
archive = ["dep:architect-extension-archive", "dep:sha2", "dep:hex"]
crdt = ["dep:crdt"]
# Live documents (`live`, `docs/content/guide/documents.md`): an extension
# edits the node's copy of a vault document of a kind it declares, over
# `crdt`'s DocSync — a process over its host connection (`process` /
# `guest`), a linked one in memory. Native only.
doc-sync = ["crdt", "crdt/vox", "vox", "dep:uuid", "dep:tokio"]
# In-process extensions (`linked`): one trait a crate implements, run
# linked into the app as a built-in (its views Dioxus components in the
# app's document), or served as a process by `guest`.
linked = ["host", "linked-core"]
# The trait and its `Builder` alone (`linked`), with no host: what a
# linked extension's crate needs to build for a browser
# (`wasm32-unknown-unknown`), where `guest` (vox, tokio) does not build
# (#495). The web app's host links it (`architect-web`).
linked-core = ["dep:dioxus"]
# Scenes in remote views (`scene`, #175): an element a view paints as an
# anyrender scene, carried by two attributes (content by hash, then a
# transform). The guest's `RemoteScene`, the host's widget, the browser's
# canvas.
scenes = ["dep:anyrender", "dep:peniko", "dep:architect-scene", "dep:base64"]
# A paint view (`linked::Builder::paint`, #591): a `PaintView` that
# records a scene for its pane and takes the pane's input. Linked in with
# `paint-ui` it is a Blitz widget in the pane (`architect_workspace::paint`);
# served by `guest` it is a `scene::RemoteScene`.
paint = ["scenes", "architect-workspace/paint"]
paint-ui = ["paint", "linked", "paint-pane", "architect-workspace/paint-ui"]
# A view's pane, linked in or as a process (`linked::use_pane_state`).
pane = ["linked-core", "architect-workspace/ui"]
# `linked::PaintPane`: a `PaintView` mounted in an extension's own view,
# `architect_workspace::PaintPane` linked in and `scene::RemotePaint` in
# its process copy (with `guest`).
paint-pane = ["pane", "paint", "architect-workspace/paint-ui", "dep:blitz-traits"]
ui = [
    "host",
    # The clipboard on iOS: the general pasteboard (src/hostui.rs).
    "dep:objc2-ui-kit",
    "dep:objc2-foundation",
    "linked",
    "dep:dioxus",
    "dep:futures",
    "dep:futures-timer",
    "architect-settings/ui",
    "dep:architect-shell",
    "architect-shell/ui",
    "architect-workspace/ui",
    "dep:architect-commands",
    "architect-commands/ui",
    "pane",
]
# The extensions page (`page`): search, install with consent, update, pin,
# grants and logs, in architect-ui's components and the app's theme.
page = ["ui", "manager", "dep:architect-ui"]
# A person's installed extensions on all their devices (`person_sync`):
# each device signs the record it writes with a key of its own (a device
# key, never a release key: that is the only signing an app does).
person-sync = ["host", "archive", "architect-extension-archive/sign"]
# The extensions manager (`manager`): one place for everything that
# customizes the app — extensions, scripts, workers, themes, layouts and
# keys, and kinds the app adds — with its MANAGER_* actions; linked in as
# an extension of its own.
manager = ["host", "linked", "architect-workspace/home"]
# The wire and the protocol (`wire`, `proto`); the derives key on `vox`.
vox = ["dep:architect", "architect/vox", "dep:vox", "dep:thiserror", "dep:architect-permissions"]
# An extension's server-side part on the org's node (#583, `crate::node`):
# `NodeHost`, the one implementation of `NodeActions`, which loads
# installed extensions' node actions and runs them with `fetch` to their
# declared hosts and their secrets. The node turns it on.
node = ["host", "net", "vox"]
process = [
    "host",
    "vox",
    "dep:vox-core",
    "dep:vox-stream",
    "dep:tokio",
    "dep:futures",
]
guest = [
    "vox",
    "scenes",
    "dep:vox-core",
    "dep:vox-stream",
    "dep:tokio",
    "dep:dioxus",
    # Its views' events arrive serialised (`guest.rs`): dioxus-html's
    # `serialize` (the node's build, without the window, gets it from
    # nothing else).
    "dep:dioxus-html",
    "dep:tracing",
    # The host's theme as the app's theme store in its views
    # (`architect_theme::try_use_theme`), as linked in.
    "architect-theme/dioxus",
]
# WASI components (`wasi`, desktop, Android and iOS): Wasmtime with the
# component model, Cranelift compiling, epoch interruption and a memory
# limit per instance, the compiled code cached on disk by the component's
# hash; the `architect:extension` world (`wit/`). Off by default: it is
# Wasmtime's size (see docs/content/architecture/extensions.md, "WASI
# components").
wasi = [
    "host",
    # A view's edits are the wire's (`wire`).
    "vox",
    "dep:wasmtime",
    "dep:wasmtime-wasi",
    "dep:tokio",
    "dep:futures",
    "dep:sha2",
]
# Wasmtime's Pulley interpreter in place of Cranelift's native code (the
# components compiled to Pulley bytecode, interpreted, a small memory
# reservation): always so on iOS, which allows no JIT (the target table
# below); this feature makes it so elsewhere, to test and measure it
# (docs/content/architecture/extensions.md, "WASI components").
pulley = ["wasi", "wasmtime/pulley"]
# WASI components in a browser (`web`, wasm32-unknown-unknown): the same
# components, transpiled by jco (`web/transpile.mjs`), run by the
# browser's WebAssembly in Web Workers (`web/runner.js`, `web/instance.js`);
# `WebHost` answers their host imports with the same capability checks
# (`hostcall::check`), and their views' edits are applied to the page's
# DOM (see docs/content/architecture/extensions.md, "On the web").
web = [
    "vox",
    "scenes",
    "dep:base64",
    "dep:architect",
    "architect/action-list",
    "dep:futures",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
]
# The platform's file and folder pickers and save dialogs for extensions'
# `pick` calls (`host_ui_view::WindowUi`): rfd, the same the shell's file
# inputs use (the portal on Linux, the system's panels on macOS and
# Windows; UIKit's document and photo pickers on iOS,
# `src/pickers_ios.rs`). Without it a pick is unsupported.
# The device's services for extensions (#709, `src/device.rs`): on iOS
# OS notifications, the camera, the photo library and HealthKit
# (`src/device_ios.rs`); elsewhere every call unsupported.
device = [
    "host",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-ui-kit",
    "dep:objc2-user-notifications",
    "dep:objc2-photos",
    "dep:objc2-health-kit",
    "dep:block2",
    "dep:dispatch2",
]
pickers = [
    "ui",
    "dep:rfd",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-ui-kit",
    "dep:objc2-photos-ui",
    "dep:objc2-uniform-type-identifiers",
    "dep:block2",
    "dep:dispatch2",
]
remote = ["process", "ui", "scenes", "architect-theme/dioxus", "dep:blitz-dom", "blitz-dom/custom-widget", "dep:blitz-traits", "dep:cursor-icon", "dep:data-url", "dep:dioxus-native-dom", "dep:futures-timer"]

[dependencies]
# `[[share_layers]]` patterns and paths compared in one Unicode form (NFC).
unicode-normalization = "0.1"
# The editor, through architect's door (#512): its extension surface as
# data (`editor`: snapshots, edit commands, keymaps, decorations, slash
# rows) and the language registry `[[languages]]` fills. The contract
# only: serde, no tree-sitter, no Dioxus.
architect-editor = { workspace = true }
# `[[favourites]]`: a note type's tabs and primary action, the contract a
# shell draws (`architect-favourites`, serde only).
architect-favourites = { workspace = true }
# Its theme tokens checked (the model); its themes into the app's store
# (`host`), the theme to a process (`process`, `guest`), the host's
# theme into a process view's document (`remote`).
architect-theme = { workspace = true }
architect-settings = { workspace = true }
# The navigator's provider API (MIT): `linked::Builder::navigator`.
architect-navigator-api = { workspace = true }
architect-orgs = { workspace = true }
architect-commands = { workspace = true, optional = true }
# A tour's scenario (`[[tours]]`) read and checked at load: the guide's
# model only (no Dioxus, wasm-clean).
architect-guide = { workspace = true }
# MIDI ports, OSC endpoints and control surfaces (`ports`, feature
# `host`): the messages, the backends, the surface engine.
architect-input = { workspace = true }
# The shell's chrome an extension's tabs, status items and slots go into
# (`ui`, `interface`).
architect-shell = { workspace = true, optional = true }
architect-ui = { workspace = true, optional = true }
# The view kinds an extension's views may name (the model, wasm-clean).
architect-workspace = { workspace = true }
facet = { workspace = true }
# `VaultQueryClient`, which the host answers `query_vault` with (feature
# `host`): the wire contract only, wasm-clean.
vault-proto = { workspace = true, optional = true, features = ["vox"] }
serde = { workspace = true }
toml = { workspace = true }
semver = "1"
# `Instant` and `SystemTime` that work in a browser too (std's panic on
# `wasm32-unknown-unknown`); std's own elsewhere.
web-time = "1"
roxmltree = "0.21"
# URL openers' patterns (`[[openers]] urls`): wasm-clean.
regex = "1"
# A fetch's URL and its host, checked against `capabilities.hosts`
# (`hostcall::may_reach_url`): wasm-clean.
url = "2"
# `fetch`'s HTTP client (`net`, feature `host`): no redirects of its own,
# the host follows each one and checks it.
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "stream"] }
architect = { workspace = true, optional = true, features = ["action-list"] }
architect-documents = { workspace = true, optional = true }
architect-extension-archive = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
serde_json = { workspace = true }
tracing = { workspace = true, optional = true }
crdt = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
dioxus = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
base64 = { workspace = true, optional = true }
vox = { workspace = true, optional = true }
# `vox`: `NodeActions`' permit table for the org lane's gate (`crate::node`).
architect-permissions = { workspace = true, optional = true }
vox-core = { workspace = true, optional = true }
vox-stream = { version = "0.10.0-rc.7", optional = true }
thiserror = { workspace = true, optional = true }
blitz-dom = { workspace = true, optional = true }
blitz-traits = { workspace = true, optional = true }
# A remote view's `<img src="data:…">` decoded (`remote`; `crate::remote`'s
# `DataOnly`): the only thing such a document fetches.
data-url = { workspace = true, optional = true }
# A hit region's cursor, set on the window (`remote`).
cursor-icon = { workspace = true, optional = true }
# A remote view's scenes (`scenes`): anyrender's commands as data.
anyrender = { workspace = true, optional = true }
# Layers of binary fragments (`scene::LAYERS_ATTR`): what a paint view
# sends its host, and what the host composes.
architect-scene = { workspace = true, optional = true }
peniko = { workspace = true, optional = true }
dioxus-native-dom = { workspace = true, optional = true }
dioxus-html = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", default-features = false, features = ["serialize"], optional = true }
futures-timer = { workspace = true, optional = true }
wasmtime = { version = "50.0.1", optional = true, default-features = false, features = [
    "std",
    "runtime",
    "cranelift",
    "component-model",
    "async",
    "parallel-compilation",
    "addr2line",
] }
wasmtime-wasi = { version = "50.0.1", optional = true, default-features = false, features = ["p2"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "CssStyleDeclaration",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "PointerEvent",
    "WheelEvent",
    "TouchEvent",
    "TouchList",
    "Touch",
    "CompositionEvent",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CanvasWindingRule",
    "Path2d",
    "Window",
    "Node",
    "NodeList",
    "Text",
    "Url",
    "Window",
] }

[dev-dependencies]
# tests/vault_query.rs: the vault's query engine, served in process.
vault-query = { workspace = true }
# tests/editor_view.rs: a linked extension's view holds the editor's
# component, through architect's door (#512).
architect-editor = { workspace = true, features = ["native", "lsp-stub"] }
# tests/distribution.rs: archives signed with a throwaway key.
architect-extension-archive = { workspace = true, features = ["sign"] }
sha2 = { workspace = true }
hex = { workspace = true }
# Its own host, so `cargo test --workspace` builds the tests with it; the
# guest too, since the remote-view tests spawn themselves as one.
architect-extensions = { path = ".", features = ["host", "crdt", "guest", "remote", "linked", "manager", "wasi", "net", "person-sync", "node", "paint-ui", "doc-sync"] }
# tests/linked_paint.rs: a linked paint view's widget painted, as the
# window's renderer does.
blitz-paint = { workspace = true, features = ["custom-widget"] }
# tests/wasi.rs: the WIT world read, to compare with the wire's types.
wit-parser = "0.261"
futures = "0.3"
tempfile = "3"
crdt = { workspace = true }
# THEME_LIST / THEME_SET / THEME_PROBLEMS over an extension's themes.
architect-theme = { workspace = true, features = ["actions"] }
# tests/host_service.rs: a gate that sees who calls; the manager's
# layouts kind.
architect-permissions = { workspace = true }
architect-workspace = { workspace = true, features = ["home"] }
# tests/host_ui_view.rs: a badged file-tree row and the interface's layer, as HTML.
dioxus-ssr = { workspace = true }
# tests/host_gate.rs: a vox-served server behind a `PermissionsGate`, called
# on an extension's behalf.
architect = { workspace = true, features = ["action-list", "host", "connect", "local"] }
vox = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
# tests/live_documents.rs: a node's documents of a kind in a vault, the
# file their storage.
vault-collab = { workspace = true }
vault-live = { workspace = true }
uuid = { workspace = true }

# iOS forbids JIT: Wasmtime interprets there (Pulley).
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
rfd = { workspace = true, optional = true }

# A browser's host keeps the vault query service's client (vox's, which
# holds `Rc`s there) in a `SendWrapper`: the page has one thread (#495).
[target.'cfg(target_family = "wasm")'.dependencies]
send_wrapper = "0.6"

# Luau (C++) is not built for a browser: `host` there runs data and linked
# extensions, with pages and WASI components beside it (`web`), #495.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The runtime of processes, guests, WASI, the network and the documents
# service (`docs_service`): native only, so `host` turning it on never
# reaches a browser's build.
tokio = { workspace = true, optional = true }
architect-scripting = { workspace = true, optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
wasmtime = { version = "50.0.1", optional = true, default-features = false, features = ["pulley"] }
# `pickers` on iOS (src/pickers_ios.rs): the document picker, the photo
# picker (out of process: no photo-library permission), on the main
# thread.
objc2 = { workspace = true, optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSSet",
    "NSSortDescriptor",
    "NSFileManager",
    "NSItemProvider",
    "NSProgress",
    "NSString",
    "NSURL",
    "NSUUID",
] }
objc2-ui-kit = { workspace = true, optional = true, default-features = false, features = [
    "std",
    "block2",
    "objc2-uniform-type-identifiers",
    "objc2-core-foundation",
    "UIApplication",
    "UIDocumentPickerViewController",
    "UIImage",
    "UIImagePickerController",
    "UIPasteboard",
    "UINavigationController",
    "UIResponder",
    "UIScene",
    "UISceneDefinitions",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
] }
objc2-photos-ui = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "block2",
    "PHPicker",
] }
objc2-uniform-type-identifiers = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "UTCoreTypes",
    "UTType",
] }
# `device` on iOS (src/device_ios.rs).
objc2-user-notifications = { version = "0.3", optional = true }
objc2-photos = { version = "0.3", optional = true }
objc2-health-kit = { version = "0.3", optional = true }
block2 = { version = "0.6", optional = true }
dispatch2 = { version = "0.3", optional = true, default-features = false, features = ["std", "objc2"] }

[lib]
doctest = false

# Language servers through the host, against the editor's stub server:
# the test binary is the server too (`--stub-lsp`), so its own main.
[[test]]
name = "language_servers"
harness = false
required-features = ["lsp"]

[lints]
workspace = true

