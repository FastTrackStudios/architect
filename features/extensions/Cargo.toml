[package]
name = "architect-extensions"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Extensions: adding to an app at run time — data, Luau, WASM and processes — from git registries and ReaPack, hot-reloaded, installed when a project needs them"

# docs/content/architecture/extensions.md. The default set is the model —
# a manifest (`extension.toml`) and what it adds, a registry's index and
# search, ReaPack's `index.xml`, which copy wins (built in, installed, in
# development), what a project needs and an organization approves — pure
# data, wasm-clean. `host` loads extensions onto an Action List and a
# settings registry, installs them from git registries, folders and
# ReaPack, and reloads them when their files change; `crdt` keeps a
# project's requirements and an extension's data in its document; `ui`
# brings loaded extensions' settings sections onto the settings page.
# Remote views, desk only: `process` runs process extensions for the host
# (started, spoken to over vox on a local socket, supervised); `guest` is
# the other end, a process extension's `main`, rendering its Dioxus views
# into an edit stream; `remote` mounts those views in the host's Blitz
# document, a sub-document per pane.

[features]
default = []
host = [
    "dep:architect",
    "dep:architect-scripting",
    "architect-scripting/luau",
    "dep:tracing",
    # `EXT_CHECK` answers from a thread of its own.
    "dep:futures",
    # Signed `.archext` archives: checked on install, whichever way they came.
    "archive",
    # A toolbar button's image file, as a `data:` URI; a fetched body as
    # base64 (`net`).
    "dep:base64",
    # The secrets the host keeps for extensions (`net::Secrets`):
    # `architect::settings`' private files.
    "architect/settings",
    # Extensions' OSC endpoints over UDP (`ports`): std only.
    "architect-input/udp",
]
# Extensions' HTTP fetches (`net`'s client: reqwest, on a runtime of its
# own). Off in `host`, `ui` and `page`: reqwest reaches tower-http, which
# a UI crate must not (`cargo xtask boundaries`, ui-reach); the app that
# runs extensions turns it on (the lab does). Without it a fetch answers
# `unsupported`.
net = ["host", "dep:reqwest", "dep:tokio"]
# The `.archext` archive (`architect-extension-archive`): open, verify,
# extract per platform. On with `host`.
archive = ["dep:architect-extension-archive", "dep:sha2", "dep:hex"]
# `perm.*` of each host-service call also through
# `architect_telemetry::wide::set` (the span's fields carry them either
# way); off by default, as telemetry reaches tower-http, which a UI build
# must not.
wide-events = ["host", "dep:architect-telemetry"]
crdt = ["dep:crdt"]
# In-process extensions (`linked`): one trait a crate implements, run
# linked into the app as a built-in (its views Dioxus components in the
# app's document), or served as a process by `guest`.
linked = ["host", "dep:dioxus"]
ui = [
    "host",
    "linked",
    "dep:dioxus",
    "dep:futures",
    "dep:futures-timer",
    "architect-settings/ui",
    "dep:architect-shell",
    "architect-shell/ui",
    "architect-workspace/ui",
    "architect-commands/ui",
]
# The extensions page (`page`): search, install with consent, update, pin,
# grants and logs, in architect-ui's components and the app's theme.
page = ["ui", "manager", "dep:architect-ui"]
# The extensions manager (`manager`): one place for everything that
# customizes the app — extensions, scripts, workers, themes, layouts and
# keys, and kinds the app adds — with its MANAGER_* actions; linked in as
# an extension of its own.
manager = ["host", "linked", "architect-workspace/home"]
# The wire and the protocol (`wire`, `proto`); the derives key on `vox`.
vox = ["dep:architect", "architect/vox", "dep:vox", "dep:thiserror"]
process = [
    "host",
    "vox",
    "dep:vox-core",
    "dep:vox-stream",
    "dep:tokio",
    "dep:futures",
]
guest = [
    "vox",
    "dep:vox-core",
    "dep:vox-stream",
    "dep:tokio",
    "dep:dioxus",
    "dep:tracing",
]
# WASI components (`wasi`, desktop, Android and iOS): Wasmtime with the
# component model, Cranelift compiling, epoch interruption and a memory
# limit per instance, the compiled code cached on disk by the component's
# hash; the `architect:extension` world (`wit/`). Off by default: it is
# Wasmtime's size (see docs/content/architecture/extensions.md, "WASI
# components").
wasi = [
    "host",
    # A view's edits are the wire's (`wire`).
    "vox",
    "dep:wasmtime",
    "dep:wasmtime-wasi",
    "dep:tokio",
    "dep:futures",
    "dep:sha2",
]
# Wasmtime's Pulley interpreter in place of Cranelift's native code (the
# components compiled to Pulley bytecode, interpreted, a small memory
# reservation): always so on iOS, which allows no JIT (the target table
# below); this feature makes it so elsewhere, to test and measure it
# (docs/content/architecture/extensions.md, "WASI components").
pulley = ["wasi", "wasmtime/pulley"]
# WASI components in a browser (`web`, wasm32-unknown-unknown): the same
# components, transpiled by jco (`web/transpile.mjs`), run by the
# browser's WebAssembly in Web Workers (`web/runner.js`, `web/instance.js`);
# `WebHost` answers their host imports with the same capability checks
# (`hostcall::check`), and their views' edits are applied to the page's
# DOM (see docs/content/architecture/extensions.md, "On the web").
web = [
    "vox",
    "dep:base64",
    "dep:architect",
    "architect/action-list",
    "dep:futures",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
]
# The platform's file and folder pickers and save dialogs for extensions'
# `pick` calls (`host_ui_view::WindowUi`): rfd, the same the shell's file
# inputs use (the portal on Linux, the system's panels on macOS and
# Windows). Without it a pick is unsupported.
pickers = ["ui", "dep:rfd"]
remote = ["process", "ui", "architect-theme/dioxus", "dep:blitz-dom", "dep:blitz-traits", "dep:dioxus-native-dom", "dep:futures-timer"]

[dependencies]
# The editor's extension surface as data (`editor`): snapshots, edit
# commands, keymaps, decorations, slash rows. serde only.
editor-ext = { workspace = true }
# Its theme tokens checked (the model); its themes into the app's store
# (`host`), the theme to a process (`process`, `guest`), the host's
# theme into a process view's document (`remote`).
architect-theme = { workspace = true }
architect-settings = { workspace = true }
# The navigator's provider API (MIT): `linked::Builder::navigator`.
architect-navigator-api = { workspace = true }
architect-orgs = { workspace = true }
architect-commands = { workspace = true }
# MIDI ports, OSC endpoints and control surfaces (`ports`, feature
# `host`): the messages, the backends, the surface engine.
architect-input = { workspace = true }
# The shell's chrome an extension's tabs, status items and slots go into
# (`ui`, `interface`).
architect-shell = { workspace = true, optional = true }
architect-ui = { workspace = true, optional = true }
# The view kinds an extension's views may name (the model, wasm-clean).
architect-workspace = { workspace = true }
facet = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
semver = "1"
roxmltree = "0.21"
# URL openers' patterns (`[[openers]] urls`): wasm-clean.
regex = "1"
# A fetch's URL and its host, checked against `capabilities.hosts`
# (`hostcall::may_reach_url`): wasm-clean.
url = "2"
# `fetch`'s HTTP client (`net`, feature `host`): no redirects of its own,
# the host follows each one and checks it.
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "stream"] }
architect = { workspace = true, optional = true, features = ["action-list"] }
architect-scripting = { workspace = true, optional = true }
architect-extension-archive = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
serde_json = { workspace = true }
tracing = { workspace = true, optional = true }
architect-telemetry = { workspace = true, optional = true }
crdt = { workspace = true, optional = true }
dioxus = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
base64 = { workspace = true, optional = true }
vox = { workspace = true, optional = true }
vox-core = { workspace = true, optional = true }
vox-stream = { version = "0.10.0-rc.7", optional = true }
tokio = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
blitz-dom = { workspace = true, optional = true }
blitz-traits = { workspace = true, optional = true }
dioxus-native-dom = { workspace = true, optional = true }
futures-timer = { workspace = true, optional = true }
wasmtime = { version = "50.0.1", optional = true, default-features = false, features = [
    "std",
    "runtime",
    "cranelift",
    "component-model",
    "async",
    "parallel-compilation",
    "addr2line",
] }
wasmtime-wasi = { version = "50.0.1", optional = true, default-features = false, features = ["p2"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "CssStyleDeclaration",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Node",
    "NodeList",
    "Text",
    "Url",
    "Window",
] }

[dev-dependencies]
# tests/distribution.rs: archives signed with a throwaway key.
architect-extension-archive = { workspace = true, features = ["sign"] }
sha2 = { workspace = true }
hex = { workspace = true }
# Its own host, so `cargo test --workspace` builds the tests with it; the
# guest too, since the remote-view tests spawn themselves as one.
architect-extensions = { path = ".", features = ["host", "crdt", "guest", "remote", "linked", "manager", "wasi", "net"] }
# tests/wasi.rs: the WIT world read, to compare with the wire's types.
wit-parser = "0.261"
futures = "0.3"
tempfile = "3"
crdt = { workspace = true }
# THEME_LIST / THEME_SET / THEME_PROBLEMS over an extension's themes.
architect-theme = { workspace = true, features = ["actions"] }
# tests/host_service.rs: a gate that sees who calls; the manager's
# layouts kind.
architect-permissions = { workspace = true }
architect-workspace = { workspace = true, features = ["home"] }
# tests/host_ui_view.rs: a badged file-tree row and the interface's layer, as HTML.
dioxus-ssr = { workspace = true }
# tests/host_gate.rs: a vox-served server behind a `PermissionsGate`, called
# on an extension's behalf.
architect = { workspace = true, features = ["action-list", "host", "connect"] }
vox = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

# iOS forbids JIT: Wasmtime interprets there (Pulley).
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
rfd = { workspace = true, optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
wasmtime = { version = "50.0.1", optional = true, default-features = false, features = ["pulley"] }

[lib]
doctest = false

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../workspace-hack" }
