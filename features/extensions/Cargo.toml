[package]
name = "architect-extensions"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Extensions: adding to an app at run time — data, Luau, WASM and processes — from git registries and ReaPack, hot-reloaded, installed when a project needs them"

# docs/content/architecture/extensions.md. The default set is the model —
# a manifest (`extension.toml`) and what it adds, a registry's index and
# search, ReaPack's `index.xml`, which copy wins (built in, installed, in
# development), what a project needs and an organization approves — pure
# data, wasm-clean. `host` loads extensions onto an Action List and a
# settings registry, installs them from git registries, folders and
# ReaPack, and reloads them when their files change; `crdt` keeps a
# project's requirements and an extension's data in its document; `ui`
# brings loaded extensions' settings sections onto the settings page.
# Remote views, desk only: `process` runs process extensions for the host
# (started, spoken to over vox on a local socket, supervised); `guest` is
# the other end, a process extension's `main`, rendering its Dioxus views
# into an edit stream; `remote` mounts those views in the host's Blitz
# document, a sub-document per pane.

[features]
default = []
host = [
    "dep:architect",
    "dep:architect-scripting",
    "architect-scripting/luau",
    "dep:tracing",
    # `EXT_CHECK` answers from a thread of its own.
    "dep:futures",
]
crdt = ["dep:crdt"]
# In-process extensions (`linked`): one trait a crate implements, run
# linked into the app as a built-in (its views Dioxus components in the
# app's document), or served as a process by `guest`.
linked = ["host", "dep:dioxus"]
ui = [
    "host",
    "linked",
    "dep:dioxus",
    "dep:futures",
    "dep:futures-timer",
    "architect-settings/ui",
    "dep:architect-shell",
    "architect-shell/ui",
    "architect-workspace/ui",
    "architect-commands/ui",
]
# The wire and the protocol (`wire`, `proto`); the derives key on `vox`.
vox = ["dep:architect", "architect/vox", "dep:vox", "dep:thiserror"]
process = [
    "host",
    "vox",
    "dep:vox-core",
    "dep:vox-stream",
    "dep:tokio",
    "dep:futures",
]
guest = [
    "vox",
    "dep:vox-core",
    "dep:vox-stream",
    "dep:tokio",
    "dep:dioxus",
    "dep:tracing",
]
remote = ["process", "ui", "architect-theme/dioxus", "dep:blitz-dom", "dep:blitz-traits", "dep:dioxus-native-dom", "dep:futures-timer"]

[dependencies]
# Its theme tokens checked (the model); its themes into the app's store
# (`host`), the theme to a process (`process`, `guest`), the host's
# theme into a process view's document (`remote`).
architect-theme = { workspace = true }
architect-settings = { workspace = true }
architect-orgs = { workspace = true }
architect-commands = { workspace = true }
# The shell's chrome an extension's tabs, status items and slots go into
# (`ui`, `interface`).
architect-shell = { workspace = true, optional = true }
# The view kinds an extension's views may name (the model, wasm-clean).
architect-workspace = { workspace = true }
facet = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
semver = "1"
roxmltree = "0.21"
# URL openers' patterns (`[[openers]] urls`): wasm-clean.
regex = "1"
architect = { workspace = true, optional = true, features = ["action-list"] }
architect-scripting = { workspace = true, optional = true }
serde_json = { workspace = true }
tracing = { workspace = true, optional = true }
crdt = { workspace = true, optional = true }
dioxus = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
vox = { workspace = true, optional = true }
vox-core = { workspace = true, optional = true }
vox-stream = { version = "0.10.0-rc.7", optional = true }
tokio = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
blitz-dom = { workspace = true, optional = true }
blitz-traits = { workspace = true, optional = true }
dioxus-native-dom = { workspace = true, optional = true }
futures-timer = { workspace = true, optional = true }

[dev-dependencies]
# Its own host, so `cargo test --workspace` builds the tests with it; the
# guest too, since the remote-view tests spawn themselves as one.
architect-extensions = { path = ".", features = ["host", "crdt", "guest", "remote", "linked"] }
futures = "0.3"
tempfile = "3"
crdt = { workspace = true }
# THEME_LIST / THEME_SET / THEME_PROBLEMS over an extension's themes.
architect-theme = { workspace = true, features = ["actions"] }

[lib]
doctest = false

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../workspace-hack" }
