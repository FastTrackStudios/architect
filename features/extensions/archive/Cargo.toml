[package]
name = "architect-extension-archive"
description = "The `.archext` extension archive: a gzipped tar of an extension's files, a content index with their SHA-256, and a detached minisign signature over the index; packed, signed, opened and checked against trusted keys (docs/content/architecture/extensions.md, \"Distribution\")."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
# Signing (`sign`): reads a minisign secret key file and writes minisign
# signatures; makes throwaway keys. For `cargo xtask ext-sign` and tests,
# never an app: an app only verifies.
sign = ["dep:ed25519-dalek", "dep:blake2", "dep:getrandom"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
semver = "1"
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
flate2 = "1.1.10"
tar = { version = "0.4", default-features = false }
minisign-verify = "0.2"
ed25519-dalek = { version = "3", optional = true }
blake2 = { version = "0.10", optional = true }
getrandom = { version = "0.3", optional = true }

[dev-dependencies]
architect-extension-archive = { path = ".", features = ["sign"] }
tempfile = "3"
# a_path_out_of_the_package_is_refused writes a hand-made tar.
tar = { version = "0.4", default-features = false }
flate2 = "1.1.10"
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

[lints]
workspace = true

[lib]
doctest = false

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../../workspace-hack" }
