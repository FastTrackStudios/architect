# The showcase's Bank link (#710: H16, with H5 and H6): an extension's
# server-side part on the org's node (#583). Its one node action trades a
# public token from a bank's link flow for an access token, holding the
# client id and secret only the node has. The person's devices run it
# through the org lane and never see either secret.
#
# It calls a local mock of Plaid's `/item/public_token/exchange`
# (`features/extensions/tests/node.rs` runs one), never Plaid itself. A
# real extension names its provider's host (`sandbox.plaid.com`).
id = "showcase.bank-link"
name = "Bank link"
version = "0.1.0"
kind = "luau"
api = "0.1"
description = "Links a bank account through a token exchange that runs on the org's node, where the client secret lives. Stands in for Finance's Plaid link (#370) and any OAuth code exchange that needs a client secret."
authors = ["FastTrackStudios"]

[capabilities]
hosts = ["127.0.0.1"]

[[secrets]]
id = "client_id"
title = "Bank API client id"
hosts = ["127.0.0.1"]

[[secrets]]
id = "client_secret"
title = "Bank API secret"
description = "Kept on the org's node, set by its operator: never on a device."
hosts = ["127.0.0.1"]

[[actions]]
id = "SHOWCASE_BANK_LINK_EXCHANGE"
name = "Bank link: exchange a public token"
description = "On the org's node: trades `public_token` for an access token at the bank's API, with the node's client id and secret. Answers the linked item's id; the access token stays on the node."
group = "Showcase"
params = '{"type":"object","properties":{"public_token":{"type":"string"},"api":{"type":"string"}},"required":["public_token"]}'
script = "node/exchange.luau"
runs = "node"
secrets = ["client_id", "client_secret"]
