# The showcase's Surface (#710: H13): MIDI and OSC ports by capability,
# with no hardware and no audio. It may open only the app's virtual MIDI
# port, `Lab Surface`, and sends it a control change; it loops an OSC
# message back to itself on localhost, heard by its port.message hook.
id = "showcase.surface"
name = "Surface"
version = "0.1.0"
kind = "luau"
api = "0.1"
description = "The app's virtual MIDI port (Lab Surface) sent a control change, and an OSC message looped back on localhost: no hardware, no audio. Stands in for CSI, ReaLearn and OSC controllers. A full control surface (banks, feedback) is the sandbox's lab.surface."
authors = ["FastTrackStudios"]

[capabilities]
# The virtual port by name: never a person's hardware, whatever MIDI
# backend the app has.
ports = ["midi:Lab Surface", "osc:127.0.0.1:9031", "osc:listen:9031"]
ui = ["notify"]

[[actions]]
id = "SHOWCASE_SURFACE_PING"
name = "Surface: ping"
description = "Lists the MIDI ports, sends CC 7 = 100 on channel 1 to Lab Surface (the app's virtual port) when it is there, and sends /showcase/ping to 127.0.0.1:9031, its own port hearing on 9031 (its hook says what came back). Answers {midi, sent_midi, sent_osc}."
group = "Showcase"
script = "ping.luau"

# What its ports hear: a script hook, told each message.
[[hooks]]
on = "port.message"
script = "heard.luau"
function = "heard"
