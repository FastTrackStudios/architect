[package]
name = "crdt-derive"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Proc-macro for `crdt::EntityCrdt` + its `*RepoLoro` newtype, derived from a single declaration"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[lib]
proc-macro = true
test = false
doctest = false

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
