[package]
name = "architect-settings"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Settings declared once — by the app or by an extension at run time — stored, validated, searched, and drawn as T3 Code's settings page"

# docs/content/architecture/settings-page.md. The default set is the model:
# the registry (sections an app or an extension registers and removes at
# run time), the values (validated, reset, restored, JSON), search — pure
# data, wasm-clean — and `#[derive(Settings)]` (a facet struct as a
# section). `store` keeps the device's and a project's values on disk
# (architect::settings::Store); `synced` keeps the person's in a CRDT
# document (loro) every device syncs; `appearance` keeps a theme store's
# org, person and device layers as settings; `ui` draws the page.

[features]
default = []
store = ["dep:architect", "architect/settings"]
synced = ["dep:loro", "dep:uuid"]
# A theme store's org, person and device layers kept as settings, and the
# Appearance section (with `ui`, its page).
appearance = ["dep:architect-theme"]
ui = [
    # Outside an AppShell (a sheet over it), the page follows the store.
    "dep:architect-theme",
    "architect-theme/dioxus",
    "dep:futures-channel",
    "dep:futures-util",
    "dep:dioxus",
    "dep:architect-shell",
    "architect-shell/ui",
    "dep:lucide-dioxus",
    "architect-commands/ui",
]

[dependencies]
architect-commands = { workspace = true }
facet = { workspace = true }
facet-json = { version = "0.50.0-rc.5" }
facet-value = { version = "0.50.0-rc.7" }
architect-settings-derive = { workspace = true }
architect-theme = { workspace = true, optional = true }
# The Appearance page: the store's layer changes, from any thread, to its signal.
futures-channel = { version = "0.3", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
loro = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
architect = { workspace = true, optional = true }
dioxus = { workspace = true, optional = true }
architect-shell = { workspace = true, optional = true }
lucide-dioxus = { workspace = true, optional = true }

[lib]
doctest = false

[dev-dependencies]
# The tests see every role: the derive, the scopes, the synced document.
architect-settings = { path = ".", features = ["store", "synced", "appearance"] }
# Two devices' documents, exchanging updates.
loro = { workspace = true }
# `Persist::local`'s app folder.
tempfile = "3"

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../workspace-hack" }
