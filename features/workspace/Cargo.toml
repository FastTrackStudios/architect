[package]
name = "architect-workspace"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The workspace: tab groups in splits, docks with ribbons, stacked tabs, floats and windows, stable pane ids, and screensets"

# The default set is the model (docs/content/architecture/workspace.md):
# pure data and the operations on it — no Dioxus, no I/O, wasm-clean.
# `ui` is the host on Blitz: tab bars, drag and drop, splits, docks and
# ribbons, stacked tabs, floats, a phone's switcher, screensets on ⌘1–9.
# `native` is a desk app's launcher: dioxus-native's, plus pop-out OS
# windows that share the app's state (`hot-reload` keeps `dx serve`'s
# reload for the main window). Plugin views come later, on `native`.

[features]
default = []
ui = ["dep:dioxus", "dep:architect-shell", "architect-shell/ui", "dep:futures-timer", "dep:futures-util", "dep:lucide-dioxus", "architect-commands/ui", "dep:architect"]
native = ["ui", "dep:dioxus-native", "dep:blitz-shell", "dep:blitz-traits", "dep:dioxus-asset-resolver"]
hot-reload = ["native", "dioxus-native/hot-reload", "dep:dioxus-devtools"]

[dependencies]
facet = { workspace = true }
facet-json = { version = "0.50.0-rc.5" }
thiserror = { workspace = true }
dioxus = { workspace = true, optional = true }
architect-shell = { workspace = true, optional = true }
lucide-dioxus = { workspace = true, optional = true }
dioxus-native = { workspace = true, optional = true, features = ["vello"] }
blitz-shell = { workspace = true, optional = true }
blitz-traits = { workspace = true, optional = true }
dioxus-asset-resolver = { workspace = true, optional = true }
dioxus-devtools = { workspace = true, optional = true }
# What the platform says about a pointer let go outside a window, heard in
# the host's dom.
futures-util = { version = "0.3", default-features = false, optional = true }
# The workspace's commands, in the app's palette; by default the model
# (the screensets as a menu's live rows), wasm-clean.
architect-commands = { workspace = true }
# The workspace's layout on the app's Action List (src/host/actions.rs).
architect = { workspace = true, optional = true, features = ["action-list"] }
# A measurement mid-drag finds the document busy and asks again shortly.
futures-timer = { workspace = true, optional = true }

# A timer needs the browser's clock on wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { workspace = true, optional = true, features = ["wasm-bindgen"] }

[lib]
doctest = false

[[test]]
name = "windows"
required-features = ["ui"]

[lints]
workspace = true
