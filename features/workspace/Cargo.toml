[package]
name = "architect-workspace"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The workspace: tab groups in splits, docks with ribbons, stacked tabs, floats and windows, stable pane ids, and screensets"

# The default set is the model (docs/content/architecture/workspace.md):
# pure data and the operations on it — no Dioxus, no I/O, wasm-clean.
# `ui` is the host on Blitz: tab bars, drag and drop, splits, docks and
# ribbons, stacked tabs, floats, a phone's switcher, screensets on ⌘1–9.
# `native` is a desk app's launcher: dioxus-native's, plus pop-out OS
# windows that share the app's state (`hot-reload` keeps `dx serve`'s
# reload for the main window). Plugin views come later, on `native`.
# `ctx` is the contract every view kind mounts through (`ViewCtx`;
# docs/content/architecture/embedded-views.md); the kinds registry is
# in the model. `paint` is the paint kind's model (src/paint/): a view
# that records an anyrender scene each frame, its display list, its frame
# times — wasm-clean, no Dioxus. `paint-ui` is its Blitz host: the
# custom widget and the pane that mounts it.

[features]
default = []
# The contract a view kind mounts through (`ViewCtx`): the host's Action
# List, a document and its history. Wasm-clean, no Dioxus.
ctx = ["dep:architect", "dep:crdt", "dep:architect-theme"]
# Every operation as an Action List action with an explicit target
# (src/control/list.rs): on a headless workspace, or under `ui` the host's.
actions = ["dep:architect", "dep:futures-channel"]
ui = ["actions", "dep:dioxus", "dep:architect-theme", "architect-theme/dioxus", "dep:architect-shell", "architect-shell/ui", "dep:futures-timer", "dep:futures-util", "dep:lucide-dioxus", "architect-commands/ui"]
# `APP_SHOT` (src/shot.rs): the window's document painted on the CPU to a PNG.
native = ["ui", "dep:dioxus-native", "dep:blitz-shell", "dep:blitz-html", "dep:blitz-traits", "dep:dioxus-asset-resolver", "dep:blitz-dom", "dep:blitz-paint", "dep:anyrender", "dep:anyrender_vello_cpu", "dep:peniko", "dep:png"]
hot-reload = ["native", "dioxus-native/hot-reload", "dep:dioxus-devtools"]
# The interface as files (src/home.rs): layouts/<name>.json, keys.json,
# watched, last-good with a .error beside a broken one, .state/ apart.
home = ["actions", "dep:serde_json"]
# A view that paints a scene each frame (`PaintView`, `Painter`, `Marks`).
paint = ["ctx", "dep:anyrender", "dep:peniko"]
# Drawn in-process by Blitz in a pane (`PaintPane`, a `PaintWidget`).
paint-ui = ["paint", "ui", "dep:blitz-dom", "dep:blitz-traits", "dep:dioxus-native-dom"]
# A host-driven WebGL2 canvas for paint scenes (wasm32 only).
paint-web = ["paint", "dep:anyrender_vello_hybrid", "dep:vello_gpu", "dep:vello_common", "dep:rustc-hash", "dep:web-sys", "dep:wasm-bindgen"]
# Dioxus canvas, DOM input and demand-driven browser frames.
paint-web-ui = ["paint-web", "dep:dioxus", "dioxus/web", "dep:js-sys"]

[dependencies]
# A view's theme tokens from a resolved theme (`ctx`); the Blitz host
# follows the app's theme store (`ui`).
architect-theme = { workspace = true, optional = true }
facet = { workspace = true }
facet-json = { version = "0.50.0-rc.5" }
# The interface files' actions answer in JSON (`home`).
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
dioxus = { workspace = true, optional = true }
architect-shell = { workspace = true, optional = true }
lucide-dioxus = { workspace = true, optional = true }
dioxus-native = { workspace = true, optional = true, features = ["vello"] }
blitz-shell = { workspace = true, optional = true }
# A window's HTML parser, so `dangerous_inner_html` makes nodes (feature `native`).
blitz-html = { workspace = true, optional = true }
blitz-traits = { workspace = true, optional = true }
dioxus-asset-resolver = { workspace = true, optional = true }
dioxus-devtools = { workspace = true, optional = true }
# What the platform says about a pointer let go outside a window, heard in
# the host's dom.
futures-util = { version = "0.3", default-features = false, optional = true }
# The workspace's commands, in the app's palette; by default the model
# (the screensets as a menu's live rows), wasm-clean.
architect-commands = { workspace = true }
# The workspace's actions on the app's Action List (src/control/list.rs),
# a write answered from where the workspace lives.
architect = { workspace = true, optional = true, features = ["action-list"] }
futures-channel = { version = "0.3", optional = true }
# A view kind's document (`ViewCtx::doc`): feature `ctx`.
crdt = { workspace = true, optional = true }
# A measurement mid-drag finds the document busy and asks again shortly.
futures-timer = { workspace = true, optional = true }
# A paint view's scene and its colours and shapes (feature `paint`); the
# Blitz widget it is drawn as (`paint-ui`).
anyrender = { workspace = true, optional = true }
peniko = { workspace = true, optional = true }
blitz-dom = { workspace = true, optional = true, features = ["custom-widget"] }
# `APP_SHOT` (feature `native`): the window's document painted on the CPU
# and written as a PNG.
blitz-paint = { workspace = true, optional = true, features = ["custom-widget"] }
anyrender_vello_cpu = { workspace = true, optional = true }
png = { workspace = true, optional = true }
dioxus-native-dom = { workspace = true, optional = true }

# A timer needs the browser's clock on wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { workspace = true, optional = true, features = ["wasm-bindgen"] }
anyrender_vello_hybrid = { version = "=0.11.0", optional = true, features = ["webgl"] }
vello_gpu = { version = "0.3", optional = true, features = ["webgl"] }
vello_common = { version = "0.3", optional = true }
rustc-hash = { version = "2", optional = true }
web-sys = { version = "0.3", optional = true, features = ["HtmlCanvasElement", "WebGl2RenderingContext", "Window", "Location", "Element", "DomRect", "PointerEvent", "WheelEvent", "KeyboardEvent", "CompositionEvent"] }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[lib]
doctest = false

[dev-dependencies]
# The kind contract's own tests (src/ctx.rs, src/paint/).
architect-workspace = { path = ".", features = ["ctx", "paint", "home"] }
# The interface files' tests (src/home.rs).
tempfile = "3"
# A paint view's scene rasterised to check it against its hit test.
anyrender_vello_cpu = { workspace = true }
# Exercise the mounted widget through Blitz's document painter.
blitz-paint = { workspace = true, features = ["custom-widget"] }
# Every action driven over MCP against a headless workspace (tests/actions.rs).
architect-mcp = { path = "../mcp" }
serde_json = { workspace = true }
# An async action run as the app itself (tests/actions.rs, the escape hatch).
futures = "0.3"
# A shot's PNG read back (tests/shot.rs).
png = { workspace = true }

[[test]]
name = "windows"
required-features = ["ui"]

[[test]]
name = "actions"
required-features = ["actions"]

[[test]]
name = "decks"
required-features = ["actions", "home"]

[[test]]
name = "shot"
required-features = ["native"]

[[test]]
name = "inner_html"
required-features = ["native"]

[[test]]
name = "popout_theme"
required-features = ["native"]

[[test]]
name = "empty_center"
required-features = ["native"]

[[test]]
name = "title_row"
required-features = ["native"]

[[test]]
name = "tab_badge"
required-features = ["native"]

[[test]]
name = "phone_flip"
required-features = ["native"]

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[[example]]
name = "paint_web"
required-features = ["paint-web"]

[[example]]
name = "paint_web_pane"
required-features = ["paint-web-ui"]
