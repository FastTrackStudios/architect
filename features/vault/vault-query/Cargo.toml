[package]
name = "vault-query"
description = "The vault's query service, wasm-clean: a note parsed (frontmatter, blocks, tags, links), a note as a base's row, the `.base` parser and evaluator (filters, formulas, sort, group-by), the rows kept per note between queries (`Index`), kept a note at a time from any `NoteSource` and synced as deltas."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `grouping` (wasm-clean), and the `VaultQuery` contract the engine serves.
vault-proto = { workspace = true, features = ["vox"] }
architect = { workspace = true }
# `rc`: an entry's properties are shared with its row (`Arc`).
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
regex = { workspace = true }
# `js`: a row's id is a v4 uuid, in a browser too.
uuid = { workspace = true, features = ["v4", "v5", "serde", "js"] }
facet = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../../workspace-hack" }
