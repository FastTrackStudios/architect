[package]
name = "architect-notify"
description = "Notifications, a built-in architect extension: persistent notifications with a typed source (a mention, a task assigned or due, a share opened, a device enrolled), each person's kept as a note so they reach every device, and the notification centre under the shell's bell, joined with the toasts; it provides `architect.notify` (features/notify/extension.toml)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "architect-notify"
path = "src/main.rs"

[dependencies]
# The trait and the guest (its process copy); the app adds `linked`.
# The trait (`linked-core`): linked into an app, a browser's too (#495);
# off the browser also its process copy (`guest`, vox and tokio).
architect-extensions = { workspace = true, features = ["linked-core"] }
chrono = { workspace = true }
dioxus = { workspace = true }
futures-timer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
architect = { workspace = true, features = ["action-list"] }
architect-extensions = { workspace = true, features = ["host", "linked", "process"] }
architect-settings = { workspace = true }
# The app's side in a test: a vault's actions and Bases' over a folder.
architect-bases = { workspace = true, features = ["actions"] }
vault = { workspace = true, features = ["actions"] }
# Threads and Tasks, to test the wiring: a mention and an assignment notify.
architect-threads = { workspace = true }
architect-tasks = { workspace = true }
futures = "0.3"
tempfile = "3"

[lints]
workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
architect-extensions = { workspace = true, features = ["guest"] }

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../workspace-hack" }
