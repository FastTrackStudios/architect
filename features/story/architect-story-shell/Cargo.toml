[package]
name = "architect-story-shell"
version.workspace = true
edition = "2021"          # kept on 2021 — pre-move workspace edition; migrate deliberately
license.workspace = true
repository.workspace = true
description = "Interactive Lookbook-style shell for architect-story."

[dependencies]
architect-story-core    = { workspace = true }
architect-story-runtime = { workspace = true }
# `router` feature enables `Router`, `Routable`, `use_navigator`, etc. —
# the shell uses this for URL-based component selection so that
# refresh / share-link / back-button preserve the selected component.
dioxus = { workspace = true, features = ["router"] }
# `tours`: a story's guide scenarios played as in-app tours over the shell
# (architect-guide's tour; native, Blitz only).
architect-guide = { workspace = true, optional = true, features = ["ui"] }
architect = { workspace = true, optional = true, features = ["action-list"] }

[features]
default = []
tours = ["dep:architect-guide", "dep:architect"]

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../../workspace-hack" }
