[package]
name = "links"
description = "Backing store for the generalized typed-link primitive. File-backed (JSONL) store of `links_proto::TypedLink`s with confidence + visibility, serving the `#[architect::rpc] LinksService`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
links-proto = { workspace = true }
architect = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["clock"] }
thiserror = { workspace = true }

vox = { workspace = true, optional = true }
vox-types = { workspace = true, optional = true }
# `actions`: the vault the LINKS_* actions read.
vault = { workspace = true, optional = true, features = ["actions"] }
facet = { workspace = true, optional = true }

[features]
default = ["vox"]
vox = ["dep:vox", "dep:vox-types", "architect/vox", "links-proto/vox"]
# The LINKS_* actions over an open vault's wikilinks.
actions = ["dep:vault", "dep:facet", "architect/action-list"]
full = ["vox"]

[dev-dependencies]
links = { path = ".", features = ["actions"] }
tempfile = "3"
vault = { workspace = true, features = ["actions"] }
architect = { workspace = true, features = ["action-list"] }
serde_json = { workspace = true }

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../../workspace-hack" }
