[package]
name = "tag"
description = "Tag feature backend: the per-org tag registry (name → icon/color) persisted as `Records/tags.json` in the vault and served over the TagService vox RPC. Native-only — the round-trip touches disk; the UI uses tag-proto directly on wasm. Mirrors the `inbox` crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Native-only: the vault round-trip reads from disk.

[dependencies]
# `vox` pulls in the architect-emitted dispatcher so the server can
# mount `VaultTags` as a `TagService` vox service (mirrors `inbox`).
tag-proto = { workspace = true, features = ["vox"] }
# `TagService` is a *sync* rpc trait, so its backend must provide a
# `HasDispatcher` impl: the build's default dispatcher (a server's
# `architect/dispatch-tokio` makes it `spawn_blocking`; the app turns
# that on, not this crate).
architect = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

# `actions`: the vault the TAGS_* actions read.
vault = { workspace = true, optional = true, features = ["actions"] }
facet = { workspace = true, optional = true }

[features]
# The TAGS_* actions over an open vault.
actions = ["dep:vault", "dep:facet", "architect/action-list"]

[dev-dependencies]
tag = { path = ".", features = ["actions"] }
tempfile = "3"
vault = { workspace = true, features = ["actions"] }
architect = { workspace = true, features = ["action-list"] }
serde_json = { workspace = true }

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../../workspace-hack" }
