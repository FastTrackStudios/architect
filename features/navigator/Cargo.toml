[package]
name = "architect-navigator"
version.workspace = true
edition.workspace = true
authors.workspace = true
# With Navigator, its extension (extension/), the only GPL crates in architect: a port of Notebook Navigator (GPL-3.0),
# whose code it carries. An app that links it ships under the GPL; the
# rest of architect stays MIT OR Apache-2.0 (README.md).
license = "GPL-3.0-or-later"
description = "The navigator: a port of Notebook Navigator (an Obsidian plugin) as architect's sidebar — a folder tree and a list of notes over a NavigatorSource, dual or single pane, virtualized, keyboard-driven"

# The default set is the model (native: the list groups with vault-live): the source a vault is seen
# through (`NavigatorSource`, `MemorySource`), the folder index, the tree
# and list rows, sorting, selection and history, expansion, the virtual
# window, the keys and the pane layout; the calendar, the periodic notes'
# patterns, periods and date filters. `ui` is the Dioxus view on the
# shell: `NavigatorView`, its commands on the palette, its settings
# section, its colours as theme tokens.

[features]
default = []
ui = [
    "dep:dioxus",
    "dep:architect-shell",
    "architect-shell/ui",
    "dep:architect-theme",
    "architect-theme/dioxus",
    "architect-settings/ui",
    "dep:architect-commands",
    "architect-commands/ui",
    "dep:lucide-dioxus",
    "dep:futures-timer",
    "dep:futures-channel",
    "dep:futures-util",
]
# `VaultSource`: architect's vault (`features/vault`, its `actions`
# feature's `OpenVault`) as a source, live. Native only.
vault = ["dep:vault", "dep:serde_json"]
# `documents::VaultDocuments`: the vault as extensions' documents, and
# the document events for the person's own edits (#706). Native only.
documents = [
    "vault",
    "dep:architect",
    "dep:architect-extensions",
    "architect-extensions/host",
    "architect-extensions/crdt",
    "dep:vault-doc",
]

[dependencies]
architect-settings = { workspace = true }
# What pages and extensions fill the panes with (MIT): `ProviderSource`.
architect-navigator-api = { workspace = true }
facet = { workspace = true }
dioxus = { workspace = true, optional = true }
architect-shell = { workspace = true, optional = true }
architect-theme = { workspace = true, optional = true }
architect-commands = { workspace = true, optional = true }
lucide-dioxus = { workspace = true, optional = true }
futures-timer = { workspace = true, optional = true }
# A source's change events, from any thread, to the window's.
futures-channel = { version = "0.3", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
# Dates: the list's in the person's time zone, the calendar's days and
# the periodic notes' periods.
chrono = { workspace = true }
vault = { workspace = true, optional = true, features = ["actions"] }
# `documents`: the extension host's document API (MIT) over the vault,
# an edit's three-way merge, the app's Action List the events go on.
architect-extensions = { workspace = true, optional = true }
vault-doc = { workspace = true, optional = true }
architect = { workspace = true, optional = true, features = ["action-list"] }
# Grouping the list by a property: Bases' `group_by` (MIT), the one
# grouping in architect. In the wire crate, so the model builds for wasm.
vault-proto = { workspace = true }
serde_json = { workspace = true, optional = true }
# The search's Latin accent folding (`é` is `e`).
unicode-normalization = "0.1"
# A note's frontmatter, for an in-memory vault (`markdown::note_from_markdown`).
serde_yaml = { workspace = true }

[dev-dependencies]
architect-navigator = { path = ".", features = ["ui", "vault"] }
tempfile = "3"
# tests/documents.rs: the host's actions run to an end.
futures = "0.3"
# The view in a headless Blitz document (tests/view.rs).
dioxus = { workspace = true }
dioxus-native = { workspace = true }
blitz-dom = { workspace = true }
blitz-traits = { workspace = true }

[[test]]
name = "documents"
required-features = ["documents"]

[lib]
doctest = false

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../workspace-hack" }
