# Navigator (features/navigator/extension/src/lib.rs): the navigator, a
# port of Notebook Navigator, as a feature of its own. Its sidebar view
# (`files`, docked left) draws the navigator the app puts in context over
# its vault; its NAVIGATOR_* actions ask the view on show; its settings are
# NavigatorSettings' keys (`navigator.*`, the section below is checked
# against the struct by tests/both_ways.rs). One Rust value
# (`NavigatorExtension`, a linked::Extension): an app links it in as a
# built-in; its program (src/main.rs) serves the same value as a process
# when a development copy runs (EXT_CLONE {"id":"navigator"}), drawing a
# sample vault of its own.
#
# GPL-3.0-or-later, as the crate it links (features/navigator/README.md).
id = "navigator"
name = "Navigator"
version = "0.1.0"
kind = "process"
api = "0.1"
description = "Folders beside notes in the sidebar: a port of Notebook Navigator (GPL-3.0). Groups, pins, images, the tag tree and the property browser, folder notes, a manual order, and each folder's and tag's own list."
authors = ["FastTrackStudio"]

[entry]
path = "architect-navigator"

[source]
git = "https://github.com/FastTrackStudios/architect"
rev = "main"
path = "features/navigator/extension"

# Its tour shows the Vault with a note in front first (LAB_GO,
# WORKSPACES_LOAD): the app's tab it lives in.
[capabilities]
actions = ["LAB_GO", "WORKSPACES_LOAD"]
effect = "mutating"

[[views]]
id = "files"
title = "Navigator"
icon = "folder-tree"
home = "left"

[[actions]]
id = "NAVIGATOR_STATE"
name = "Navigator: the list"
description = "The folder or tag selected, how its list is sorted and grouped, and its rows: headings (group, folded, count, pinned) and notes (path, pinned, image)."
group = "Navigator"
effect = "read_only"

[[actions]]
id = "NAVIGATOR_SELECT"
name = "Navigator: go to"
description = "Selects folder `folder` (\"\" the vault), tag `tag` (__tagged__ every tagged note, __untagged__ those with none) or property `property` (and `value`; properties-root the Properties row), as a click would; a folder's note opens with it when folder notes are on."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"folder":{"type":"string"},"tag":{"type":"string"},"property":{"type":"string"},"value":{"type":"string"}}}'

[[actions]]
id = "NAVIGATOR_REVEAL"
name = "Reveal the open note"
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_COLLAPSE_OR_EXPAND"
name = "Collapse or expand all folders"
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_BACK"
name = "Back to the folder before"
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_FORWARD"
name = "Forward to the next folder"
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_FOCUS_FOLDERS"
name = "Go to the folders"
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_FOCUS_NOTES"
name = "Go to the notes"
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_SELECT_ALL"
name = "Select every note in the list"
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_TOGGLE_DUAL_PANE"
name = "Two panes"
group = "Navigator"
effect = "mutating"
toggle = true

[[actions]]
id = "NAVIGATOR_TOGGLE_ORIENTATION"
name = "Stack the panes"
group = "Navigator"
effect = "mutating"
toggle = true

[[actions]]
id = "NAVIGATOR_TOGGLE_DESCENDANTS"
name = "Notes from folders below"
description = "For the list on show: the settings', or the folder's own while it has one."
group = "Navigator"
effect = "mutating"
toggle = true

[[actions]]
id = "NAVIGATOR_TOGGLE_COMPACT"
name = "Compact rows"
description = "Note rows as their names alone, for the list on show."
group = "Navigator"
effect = "mutating"
toggle = true

[[actions]]
id = "NAVIGATOR_REORDER_ROOTS"
name = "Reorder the top folders"
group = "Navigator"
effect = "mutating"
toggle = true

[[actions]]
id = "NAVIGATOR_SORT"
name = "Navigator: sort by"
description = "Sorts the list on show by `by`: modified-desc, modified-asc, created-desc, created-asc, title-asc, title-desc, filename-asc, filename-desc or manual (the notes' sort_index)."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"by":{"type":"string"}},"required":["by"]}'

[[actions]]
id = "NAVIGATOR_GROUP"
name = "Navigator: group by"
description = "Groups the list on show by `by`: none, date, folder or property (`property` names it; notes without it go last, under None)."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"by":{"type":"string"},"property":{"type":"string"}},"required":["by"]}'

[[actions]]
id = "NAVIGATOR_TOGGLE_GROUP"
name = "Navigator: fold a group"
description = "Folds or unfolds the list's group `group` (its key, from NAVIGATOR_STATE) or the one headed `label`."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"group":{"type":"string"},"label":{"type":"string"}}}'

[[actions]]
id = "NAVIGATOR_OWN_LIST"
name = "Navigator: this folder's own list"
description = "With `on` (the default) the list's sort, grouping, rows and notes from below change for the folder or tag selected alone; off, it follows the settings again."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"on":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_COLOUR"
name = "Navigator: colour a folder, tag, property or note"
description = "Gives `target` (folder:<path>, tag:<tag>, property:<key>, property:<key>=<value>, file:<path>; or `path`, `folder`, `tag`, `property` and `value`) colour `colour` (CSS), its row's background with `background`; empty takes it off, none asks. A note's goes to its frontmatter when names and dates come from frontmatter."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"target":{"type":"string"},"path":{"type":"string"},"folder":{"type":"string"},"tag":{"type":"string"},"property":{"type":"string"},"value":{"type":"string"},"colour":{"type":"string"},"background":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_PIN"
name = "Pin or unpin the note"
description = "Pins note `path` (or `paths`, or the selected ones) in folders, or in tags while a tag is selected; or unpins them."
group = "Navigator"
effect = "mutating"
shortcut = "⌘⇧P"
params = '{"type":"object","properties":{"path":{"type":"string"},"paths":{"type":"array","items":{"type":"string"}}}}'

[[actions]]
id = "NAVIGATOR_PIN_FOLDER_NOTES"
name = "Pin all folder notes"
description = "Pins every folder note the list holds that is not pinned."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_MOVE"
name = "Navigator: move in the manual order"
description = "Moves note `path` (or the selected notes) `by` places (up when negative) in a manual sort, writing each note's sort_index."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"path":{"type":"string"},"by":{"type":"integer"}}}'

[[actions]]
id = "NAVIGATOR_CONVERT_TO_FOLDER_NOTE"
name = "Convert to folder note"
description = "Makes note `path` (or the selected one) the note of a new folder beside it, named for it, and opens it."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"path":{"type":"string"}}}'

[[actions]]
id = "NAVIGATOR_SET_AS_FOLDER_NOTE"
name = "Set as folder note"
description = "Renames note `path` (or the selected one) as its folder's note."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"path":{"type":"string"}}}'

[[actions]]
id = "NAVIGATOR_DETACH_FOLDER_NOTE"
name = "Detach folder note"
description = "Renames folder `folder`'s note (or the selected folder's) to `name` (\"<name> (note)\" when left out), a note like any other."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"folder":{"type":"string"},"name":{"type":"string"}}}'

[[actions]]
id = "NAVIGATOR_OPEN_FOLDER_NOTE_TAB"
name = "Open the folder note in a new tab"
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"folder":{"type":"string"},"path":{"type":"string"}}}'

[[actions]]
id = "NAVIGATOR_TOGGLE_CALENDAR"
name = "Calendar"
description = "Shows or hides the calendar under the folders (with two panes stacked, under the notes)."
group = "Navigator"
effect = "mutating"
toggle = true

[[actions]]
id = "NAVIGATOR_CALENDAR"
name = "Navigator: the calendar"
description = "The calendar's month: its weeks and days, each day's daily note, image and tasks left, the week, month, quarter and year notes, and each period's search token (@2026-11). `date` (YYYY-MM-DD) goes to that day, `move` pages by the weeks on show (a month with the whole month), `today` back to today, `weeks` (1 to 6) sets how many weeks show."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"date":{"type":"string"},"move":{"type":"integer"},"today":{"type":"boolean"},"weeks":{"type":"integer","minimum":1,"maximum":6}}}'

[[actions]]
id = "NAVIGATOR_OPEN_DAILY_NOTE"
name = "Open the daily note"
description = "Opens the daily note of `date` (YYYY-MM-DD, today when left out), or makes it, under the periodic notes folder by the daily pattern. It asks first when the settings say to, unless `confirm` is false."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"date":{"type":"string"},"confirm":{"type":"boolean"},"tab":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_OPEN_WEEKLY_NOTE"
name = "Open the weekly note"
description = "Opens the note of the week holding `date` (today when left out), or makes it. As NAVIGATOR_OPEN_DAILY_NOTE."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"date":{"type":"string"},"confirm":{"type":"boolean"},"tab":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_OPEN_MONTHLY_NOTE"
name = "Open the monthly note"
description = "Opens the note of the month holding `date` (today when left out), or makes it. As NAVIGATOR_OPEN_DAILY_NOTE."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"date":{"type":"string"},"confirm":{"type":"boolean"},"tab":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_OPEN_QUARTERLY_NOTE"
name = "Open the quarterly note"
description = "Opens the note of the quarter holding `date` (today when left out), or makes it. As NAVIGATOR_OPEN_DAILY_NOTE."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"date":{"type":"string"},"confirm":{"type":"boolean"},"tab":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_OPEN_YEARLY_NOTE"
name = "Open the yearly note"
description = "Opens the note of the year holding `date` (today when left out), or makes it. As NAVIGATOR_OPEN_DAILY_NOTE."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"date":{"type":"string"},"confirm":{"type":"boolean"},"tab":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_NEXT_PERIOD"
name = "Open the next periodic note"
description = "From the periodic note open: the next day's, week's, month's, quarter's or year's note, made when missing. As NAVIGATOR_OPEN_DAILY_NOTE."
group = "Navigator"
effect = "mutating"
shortcut = "⌃⌥→"
params = '{"type":"object","properties":{"confirm":{"type":"boolean"},"tab":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_PREVIOUS_PERIOD"
name = "Open the previous periodic note"
description = "From the periodic note open: the one before. As NAVIGATOR_NEXT_PERIOD."
group = "Navigator"
effect = "mutating"
shortcut = "⌃⌥←"
params = '{"type":"object","properties":{"confirm":{"type":"boolean"},"tab":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_PARENT_PERIOD"
name = "Open the parent periodic note"
description = "From the periodic note open: the note of the period it is in (a day's week, a week's month by its first day, a month's quarter, a quarter's year), skipping kinds that are off. As NAVIGATOR_NEXT_PERIOD."
group = "Navigator"
effect = "mutating"
shortcut = "⌃⌥↑"
params = '{"type":"object","properties":{"confirm":{"type":"boolean"},"tab":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_TAGS"
name = "Navigator: the tag tree"
description = "The tag rows on show (the Tags row, each tag, Untagged): name, level, open, how many notes have it and below it; how many notes are tagged and untagged; the search."
group = "Navigator"
effect = "read_only"

[[actions]]
id = "NAVIGATOR_PROPERTIES"
name = "Navigator: the property browser"
description = "The property rows on show (the Properties row, each key named in the settings, an open key's values) with their counts. As NAVIGATOR_TAGS."
group = "Navigator"
effect = "read_only"

[[actions]]
id = "NAVIGATOR_TOGGLE"
name = "Navigator: open or close a tag or property"
description = "Opens or closes tag `tag` (__tagged__ the Tags row) or property `property` (properties-root the Properties row)."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"tag":{"type":"string"},"property":{"type":"string"}}}'

[[actions]]
id = "NAVIGATOR_TAG_ADD"
name = "Add a tag to notes"
description = "Adds `tag` to note `path` (or `paths`, or the selected ones), in their frontmatter: a note with the tag or one above it is left; the tags below it go."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"tag":{"type":"string"},"path":{"type":"string"},"paths":{"type":"array","items":{"type":"string"}}},"required":["tag"]}'

[[actions]]
id = "NAVIGATOR_TAG_REMOVE"
name = "Remove a tag from notes"
description = "Takes `tag` itself (not the tags below it) off note `path` (or `paths`, or the selected ones): frontmatter and text."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"tag":{"type":"string"},"path":{"type":"string"},"paths":{"type":"array","items":{"type":"string"}}},"required":["tag"]}'

[[actions]]
id = "NAVIGATOR_TAG_CLEAR"
name = "Remove all tags from notes"
description = "Takes every tag off note `path` (or `paths`, or the selected ones)."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"path":{"type":"string"},"paths":{"type":"array","items":{"type":"string"}}}}'

[[actions]]
id = "NAVIGATOR_TAG_RENAME"
name = "Rename a tag"
description = "Renames tag `from` to `to` in every note, and the tags below it (a/b to x makes a/b/c x/c); its colour, order and the selection follow."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"from":{"type":"string"},"to":{"type":"string"}},"required":["from","to"]}'

[[actions]]
id = "NAVIGATOR_TAG_DELETE"
name = "Delete a tag"
description = "Takes `tag` and the tags below it off every note."
group = "Navigator"
effect = "destructive"
params = '{"type":"object","properties":{"tag":{"type":"string"}},"required":["tag"]}'

[[actions]]
id = "NAVIGATOR_PROPERTY_RENAME"
name = "Rename a property"
description = "Renames property key `key` to `to` in every note that has it (a note with `to` already takes `key`'s value), and the settings that list it; with `value`, renames that value of the key instead (a text value, or that element of a list)."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"key":{"type":"string"},"value":{"type":"string"},"to":{"type":"string"}},"required":["key","to"]}'

[[actions]]
id = "NAVIGATOR_MOVE_CHILD"
name = "Move a nested tag or a value"
description = "Moves nested tag `target` (tag:<tag>) among its siblings, or a property's value (property:<key>=<value>) among the key's, `by` places (-1 up, 1 down): a hand-made order kept per parent (tagChildOrder, propertyChildOrder). With `reset` true and a parent (tag:<tag>, property:<key>), its children go back to the sort."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"target":{"type":"string"},"by":{"type":"integer"},"reset":{"type":"boolean"}},"required":["target"]}'

[[actions]]
id = "NAVIGATOR_OPEN_HOMEPAGE"
name = "Open the homepage"
description = "Opens the homepage Navigator's settings name (open-homepage): a periodic note (daily, weekly, monthly, quarterly, yearly), made when missing, or a note by its path. It opens by itself when the app starts."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_TOGGLE_TAG_SORT"
name = "Sort tags A to Z or by count"
description = "Switches the tag tree between A to Z and most notes first (toggle-tag-sort)."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_TOGGLE_TAGS_BY_SELECTION"
name = "Tags of the selection only"
description = "Switches the tag tree between every tag and the tags of the folder or property selected (toggle-tags-by-selection)."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_TOGGLE_PROPERTIES_BY_SELECTION"
name = "Properties of the selection only"
description = "Switches the property browser between every value and the values of the folder or tag selected (toggle-properties-by-selection)."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_FOLD_GROUPS"
name = "Fold or unfold the list's groups"
description = "Folds every group of the list (by date, by folder, by property), or unfolds them all when every one is folded (collapse-expand-list-groups)."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_PROPERTY_DELETE"
name = "Delete a property"
description = "Takes property key `key` off every note, and out of the settings that list it."
group = "Navigator"
effect = "destructive"
params = '{"type":"object","properties":{"key":{"type":"string"}},"required":["key"]}'

[[actions]]
id = "NAVIGATOR_TAG_NEW_NOTE"
name = "New note in a tag"
description = "Makes a note tagged `tag` beside the selected note (or the one open, or at the root), and opens it."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"tag":{"type":"string"}},"required":["tag"]}'

[[actions]]
id = "NAVIGATOR_PROPERTY_SET"
name = "Set a property on notes"
description = "Sets property `key` to `value` (or empty, the key alone) on note `path` (or `paths`, or the selected ones); a value replaces what each had."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"key":{"type":"string"},"value":{"type":"string"},"path":{"type":"string"},"paths":{"type":"array","items":{"type":"string"}}},"required":["key"]}'

[[actions]]
id = "NAVIGATOR_DROP"
name = "Navigator: drop on a folder, tag or property"
description = "Drops notes (`path`, `paths`, or the selected ones), tag `drag_tag` or folder `drag_folder` on folder `to`, tag `tag` or property `property` (and `value`), as a drag would: notes move into the folder (copied with `copy`, the copy key held), are tagged (cleared on __untagged__) or get the property; a tag moves under the tag (to the top on __tagged__); a folder moves into the folder."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"drag_tag":{"type":"string"},"drag_folder":{"type":"string"},"path":{"type":"string"},"paths":{"type":"array","items":{"type":"string"}},"to":{"type":"string"},"copy":{"type":"boolean"},"tag":{"type":"string"},"property":{"type":"string"},"value":{"type":"string"}}}'

[[actions]]
id = "NAVIGATOR_SEARCH"
name = "Navigator: the search"
description = "Sets the search box's `query` (the filter search: words in names and aliases, #tag, .key, .key=value, .key=null, @today, @2026-11, @c:2026-W45, @2026-11-01..2026-11-07, folder:name, folder:/path, ext:pdf, has:task; - leaves out, \"quoted\" is text; AND and OR between tags and properties alone); or adds tag `tag` or property `property` (and `value`) as a Cmd/Ctrl-click does (with AND; `or` true, OR), or takes it out; `clear` empties it; `open` opens or closes the box. Answers the search, whether it is an expression, and the notes it lists."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"tag":{"type":"string"},"property":{"type":"string"},"value":{"type":"string"},"or":{"type":"boolean"},"query":{"type":"string"},"clear":{"type":"boolean"},"open":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_TOGGLE_SEARCH"
name = "Search"
description = "Opens the search box over the notes, or closes and clears it."
group = "Navigator"
effect = "mutating"
toggle = true

[[actions]]
id = "NAVIGATOR_SEARCH_VAULT"
name = "Search the whole vault"
description = "Selects the vault's root with the notes of every folder below, and opens the search box (with `query`, searches it)."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"query":{"type":"string"}}}'

[[actions]]
id = "NAVIGATOR_TOGGLE_HIDDEN"
name = "Show hidden items"
description = "Shows the folders, tags, notes and files the vault profile hides, or hides them again."
group = "Navigator"
effect = "mutating"
toggle = true

[[actions]]
id = "NAVIGATOR_HIDE"
name = "Hide a folder, tag or note"
description = "Hides folder `folder`, tag `tag` (and the tags below it) or note `path` in the vault profile in use; `unhide` true shows it again. Answers the profile."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"folder":{"type":"string"},"tag":{"type":"string"},"path":{"type":"string"},"unhide":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_SHORTCUTS"
name = "Navigator: shortcuts"
description = "The vault profile's shortcuts. `add` a kind (note, folder, tag, property, search) with `path`, `folder`, `tag`, `property` and `value`, or `query` (and `name`), at `at`; `remove` n, `move` n `to` m, `rename` n to `name`, `open` n (from 1). Answers the profile."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"add":{"type":"string"},"path":{"type":"string"},"folder":{"type":"string"},"tag":{"type":"string"},"property":{"type":"string"},"value":{"type":"string"},"query":{"type":"string"},"name":{"type":"string"},"at":{"type":"integer"},"remove":{"type":"integer"},"move":{"type":"integer"},"to":{"type":"integer"},"rename":{"type":"integer"},"open":{"type":"integer"}}}'

[[actions]]
id = "NAVIGATOR_ADD_SHORTCUT"
name = "Add to shortcuts"
description = "Adds the note selected (or `path`), else the folder, tag or property selected, to the shortcuts. As NAVIGATOR_SHORTCUTS's `add`."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"kind":{"type":"string"},"path":{"type":"string"},"folder":{"type":"string"},"tag":{"type":"string"},"property":{"type":"string"},"value":{"type":"string"},"query":{"type":"string"},"name":{"type":"string"}}}'

[[actions]]
id = "NAVIGATOR_OPEN_SHORTCUT_1"
name = "Open shortcut 1"
description = "Opens shortcut 1: a note opens, a folder, tag or property is selected, a saved search runs."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_OPEN_SHORTCUT_2"
name = "Open shortcut 2"
description = "Opens shortcut 2: a note opens, a folder, tag or property is selected, a saved search runs."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_OPEN_SHORTCUT_3"
name = "Open shortcut 3"
description = "Opens shortcut 3: a note opens, a folder, tag or property is selected, a saved search runs."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_OPEN_SHORTCUT_4"
name = "Open shortcut 4"
description = "Opens shortcut 4: a note opens, a folder, tag or property is selected, a saved search runs."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_OPEN_SHORTCUT_5"
name = "Open shortcut 5"
description = "Opens shortcut 5: a note opens, a folder, tag or property is selected, a saved search runs."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_OPEN_SHORTCUT_6"
name = "Open shortcut 6"
description = "Opens shortcut 6: a note opens, a folder, tag or property is selected, a saved search runs."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_OPEN_SHORTCUT_7"
name = "Open shortcut 7"
description = "Opens shortcut 7: a note opens, a folder, tag or property is selected, a saved search runs."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_OPEN_SHORTCUT_8"
name = "Open shortcut 8"
description = "Opens shortcut 8: a note opens, a folder, tag or property is selected, a saved search runs."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_OPEN_SHORTCUT_9"
name = "Open shortcut 9"
description = "Opens shortcut 9: a note opens, a folder, tag or property is selected, a saved search runs."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_RECENT"
name = "Navigator: recent notes"
description = "The vault profile's recent notes, newest first; `open` n opens one (from 1), `clear` forgets them."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"open":{"type":"integer"},"clear":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_PROFILE"
name = "Navigator: vault profiles"
description = "The vault profiles: `select` one (its id, name or number), `add` one named so (as the one in use unless `copy` is false), `remove` or `rename` one (to `name`); `set` the one in use's hidden_folders, descendant_excluded, hidden_tags, hidden_file_tags, hidden_file_names, hidden_file_properties (lists), banner, file_visibility (documents, supported, all). Answers the profile. With `edit`, opens the profiles' editor on the settings page."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"select":{"type":"string"},"edit":{"type":"boolean"},"add":{"type":"string"},"copy":{"type":"boolean"},"remove":{"type":"string"},"rename":{"type":"string"},"name":{"type":"string"},"set":{"type":"object"}}}'

[[actions]]
id = "NAVIGATOR_SELECT_PROFILE_1"
name = "Use vault profile 1"
description = "Switches to vault profile 1: what it hides, its shortcuts, its recent notes."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_SELECT_PROFILE_2"
name = "Use vault profile 2"
description = "Switches to vault profile 2: what it hides, its shortcuts, its recent notes."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_SELECT_PROFILE_3"
name = "Use vault profile 3"
description = "Switches to vault profile 3: what it hides, its shortcuts, its recent notes."
group = "Navigator"
effect = "mutating"

[[actions]]
id = "NAVIGATOR_NEW_NOTE"
name = "New note"
description = "Makes a note (or `kind` canvas, base) in `folder` (else the folder selected): named `name`, by `name_format` (template tokens, `{{number}}`), or Untitled; its text from `template` (a vault path), else the folder's template (`no_template` for none); `prompts` answers its `{{prompt:Label}}`s. Opens it (`tab` in a new tab). Answers its `path` and where the `cursor` goes."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"folder":{"type":"string"},"kind":{"type":"string","enum":["note","canvas","base"]},"name":{"type":"string"},"name_format":{"type":"string"},"template":{"type":"string"},"no_template":{"type":"boolean"},"prompts":{"type":"object","additionalProperties":{"type":"string"}},"tab":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_NEW_FOLDER"
name = "New folder"
description = "Makes folder `name` in `parent` (else the folder selected)."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"name":{"type":"string"},"parent":{"type":"string"}},"required":["name"]}'

[[actions]]
id = "NAVIGATOR_RENAME"
name = "Rename"
description = "Renames note `path` (else the one selected) or folder `folder` to `name`; the links that named it follow, and a folder note named after its folder with it. With no `name`, its name is edited in place."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"path":{"type":"string"},"folder":{"type":"string"},"name":{"type":"string"}}}'

[[actions]]
id = "NAVIGATOR_DUPLICATE"
name = "Duplicate"
description = "Duplicates note `path` (else the one selected) beside it as `Name 1` and opens it, or folder `folder` with everything in it."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"path":{"type":"string"},"folder":{"type":"string"}}}'

[[actions]]
id = "NAVIGATOR_MOVE_TO"
name = "Move to…"
description = "Moves files (`path`, `paths`, else the notes selected), or folder `folder`, into folder `to` (empty, the root). With no `to`, asks for it."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"path":{"type":"string"},"paths":{"type":"array","items":{"type":"string"}},"folder":{"type":"string"},"to":{"type":"string"}}}'

[[actions]]
id = "NAVIGATOR_COPY_TO"
name = "Copy to…"
description = "Copies files (`path`, `paths`, else the notes selected) into folder `to`, each keeping its name (numbered when taken)."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"path":{"type":"string"},"paths":{"type":"array","items":{"type":"string"}},"to":{"type":"string"}},"required":["to"]}'

[[actions]]
id = "NAVIGATOR_DELETE"
name = "Delete"
description = "Puts files (`path`, `paths`, else the notes selected) or folder `folder` in the vault's trash (`.trash`). Asks first when the settings say, unless `confirm` is false."
group = "Navigator"
effect = "destructive"
params = '{"type":"object","properties":{"path":{"type":"string"},"paths":{"type":"array","items":{"type":"string"}},"folder":{"type":"string"},"confirm":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_MERGE"
name = "Merge notes"
description = "Merges the notes `paths` (else the ones selected, in the list's order) into one note `name` in folder `into` (else the first's): the first's frontmatter kept, `separator` (none, blank-line, horizontal-rule, heading) between; with `trash`, the notes go to the trash after. Opens it."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"paths":{"type":"array","items":{"type":"string"}},"name":{"type":"string"},"into":{"type":"string"},"separator":{"type":"string","enum":["none","blank-line","horizontal-rule","heading"]},"trash":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_OPEN_ALL"
name = "Open all notes"
description = "Opens every note in the list (of folder `folder`, when named) in new tabs; asks first at 15 or more, unless `confirm` is false."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"folder":{"type":"string"},"confirm":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_OPEN_SELECTED"
name = "Open the selected notes"
description = "Opens the notes selected in new tabs, in the list's order; asks first at 15 or more, unless `confirm` is false."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"confirm":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_FOLDER_TEMPLATE"
name = "Navigator: folder template"
description = "Sets folder `folder`'s template to `template` (a vault path; empty clears it); notes made in its subfolders take it too unless `subfolders` is false or a nearer folder has its own. Answers the templates."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"folder":{"type":"string"},"template":{"type":"string"},"subfolders":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_TEMPLATE_COMMANDS"
name = "Navigator: create-note commands"
description = "The commands that make a note from a template: `add` one by name, with `template`, `name_format` and `folder` (else the current folder) and a stable `id`; `remove` one (its id, name or number). Answers the templates."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"add":{"type":"string"},"id":{"type":"string"},"template":{"type":"string"},"name_format":{"type":"string"},"folder":{"type":"string"},"remove":{"type":"string"}}}'

[[actions]]
id = "NAVIGATOR_TEMPLATE_COMMAND"
name = "Run a create-note command"
description = "Runs create-note command `id` (its id, name or number): a note named by its format, from its template, in its folder; `prompts` answers its prompts. Answers its `path`."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"id":{"type":"string"},"prompts":{"type":"object","additionalProperties":{"type":"string"}}},"required":["id"]}'

[[actions]]
id = "NAVIGATOR_ICON"
name = "Navigator: icon"
description = "Gives a folder, tag, property or note (`target`, or `path`, `folder`, `tag`, `property` and `value`) icon `icon`: a Lucide name (folder), an emoji, a pack's (ph:house), Iconize's (LiFolder), or a vault .svg; empty takes it off, none asks. A note's goes to its frontmatter when names and dates come from frontmatter. Answers its icon, colour and background."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"target":{"type":"string"},"path":{"type":"string"},"folder":{"type":"string"},"tag":{"type":"string"},"property":{"type":"string"},"value":{"type":"string"},"icon":{"type":"string"}}}'

[[actions]]
id = "NAVIGATOR_KEYS"
name = "Navigator: keyboard map"
description = "The panes' keys: each action's stable id (pane:move-up, navigation:collapse-or-parent, list:select-all, list:open, search:close, …) and hotkeys. With `action`, binds it to `keys` (Mod+Shift+P, ArrowUp, k; none turns it off), or `reset` to its default. The setting vim_keys adds h j k l, g and ⇧G."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"action":{"type":"string"},"keys":{"type":"array","items":{"type":"string"}},"reset":{"type":"boolean"}}}'

[[actions]]
id = "NAVIGATOR_KEY"
name = "Navigator: press a key action"
description = "Does key action `action` (its stable id, as NAVIGATOR_KEYS lists) in the pane with the keyboard, as its key would."
group = "Navigator"
effect = "mutating"
params = '{"type":"object","properties":{"action":{"type":"string"}},"required":["action"]}'

[[actions]]
id = "NAVIGATOR_METADATA"
name = "Navigator: metadata"
description = "A folder's, tag's, property's or note's icon, colour and background (`target`, or `path`, `folder`, `tag`, `property` and `value`), and a note's pins; with `pinned`, every pinned note. Navigator raises its events as they change, heard as app:navigator.nav-item-changed, selection-changed, pinned-files-changed and metadata-changed by an extension whose capabilities.events has navigator.*."
group = "Navigator"
effect = "read_only"
params = '{"type":"object","properties":{"target":{"type":"string"},"path":{"type":"string"},"folder":{"type":"string"},"tag":{"type":"string"},"property":{"type":"string"},"value":{"type":"string"},"pinned":{"type":"boolean"}}}'

