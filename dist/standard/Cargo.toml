# @generated by `cargo xtask core sync`: do not edit. It is made from
# extensions/core-extensions.toml (the core extensions) and the root
# Cargo.toml (its [patch] and [profile] tables, its members); change
# those and run `cargo xtask core sync`. `cargo xtask core check` fails
# while this file is out of date (docs/content/guide/core-extensions.md).
#
# The standard distribution of Architect (#631): the Architect app with
# its core extensions. A workspace of its own, outside architect's: every
# architect crate in its graph is patched back to this checkout, under
# both spellings of its URL, so the build holds one Architect.
#
# This crate's own code is MIT OR Apache-2.0; the binary links each core
# extension's crates under their own licences (Studio's: GPL-3.0-or-later).

[package]
name = "architect-standard"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "The standard distribution of Architect: the Architect app with the core extensions extensions/core-extensions.toml lists, linked from their own repos at the tags it pins, and its packaged ones beside the binary."

[workspace]

[[bin]]
name = "architect-desktop"
path = "src/main.rs"

[features]
# The window, as the Architect app has it (on iOS, always). Off
# (`--no-default-features`), the binary is the headless node alone: no
# Blitz, wgpu or wayland.
default = ["gui"]
gui = ["architect-desktop/gui", "dep:studio-views"]
# The node draws the fences installed WASI components claim, as the
# release's node does (`cargo xtask dist node --features node-wasi`).
node-wasi = ["architect-desktop/node-wasi"]

[dependencies]
architect-distribution = { path = "../../apps/distribution" }
architect-sites = { path = "../../features/sites" }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tracing = { version = "0.1", features = ["std"] }

# The linked core extensions, each at the tag the list pins.
# studio-setlists 26.11.4: https://github.com/FastTrackStudios/studio v26.11.4 (93a2d28a19852cff177ce268c38f5e5d4808bfa9)
setlists = { git = "https://github.com/FastTrackStudios/studio", tag = "v26.11.4", features = ["extension", "share"] }
# studio-views 26.11.4: https://github.com/FastTrackStudios/studio v26.11.4 (93a2d28a19852cff177ce268c38f5e5d4808bfa9)
studio-views = { git = "https://github.com/FastTrackStudios/studio", tag = "v26.11.4", features = ["extension"], optional = true }

[target.'cfg(not(target_os = "ios"))'.dependencies]
# The desk's window and the node: everywhere but iOS.
architect-desktop = { path = "../../apps/desktop", default-features = false, features = ["vox"] }

[target.'cfg(target_os = "ios")'.dependencies]
# The iPhone and iPad app (`architect_mobile::run`, `cargo xtask dist ios`).
architect-mobile = { path = "../../apps/mobile" }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
anyrender = { git = "https://www.github.com/FastTrackStudios/blitz", rev = "db5b7ef11e4df19ef317c23f77152ec5e1887101" }
