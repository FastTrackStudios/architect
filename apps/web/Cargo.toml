[package]
name = "architect-web"
description = "Architect in a browser: the app's shell, workspace, navigator, ⌘K palette and settings on dioxus-web (the same components as the desktop and phone apps), OIDC redirect sign-in with PKCE as client `architect`, and `/app/?demo` on the demo vault in memory; bundled with the site (`apps/site`) and the docs into one static site (`just web`, the `architect-web` image)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["start"]
# The page's start (`#[wasm_bindgen(start)]`): the Architect app's
# distribution. A distribution crate's web build turns it off and starts
# with its own (`architect_web::run(<its Distribution>)`, #495).
start = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# The demo vault (`apps/ui/demo-vault`), built in: `/app/?demo` (src/demo.rs).
include_dir = { workspace = true }
# An open note's typing merged into its live document by Loro, at the
# version its text area showed (src/live_text.rs).
loro = { workspace = true }
# The extension frame host (src/ext_host.rs, #495): each file of an
# island's bundle checked against the node's digest before a frame gets it.
sha2 = { workspace = true }
base64 = { workspace = true }
# The note types' favourites from the node (src/favourites.rs, #607).
architect-favourites = { workspace = true }
# The playhead's deck (#589): what a frame's ask moves (src/ext_host.rs).
architect-playhead = { workspace = true }
# Media items and collections (#668): a guest's list (src/guest_view.rs).
architect-media = { workspace = true }
# What a view on a note is handed of it (`architect_spaces::view`, the
# node's rules too), and a share link's guest service (`ShareGuest`, #669).
architect-spaces = { workspace = true }
# A share link guest's file URL parsed and normalised as the browser
# does before it is fetched (`view_files::guest_file_url`, #673 L3).
url = "2"

# The browser half runs on wasm32-unknown-unknown only; natively the crate
# is its pure part (routes, config, views), which its tests cover.
[target.'cfg(target_arch = "wasm32")'.dependencies]
auth-client = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto", "console", "CssStyleDeclaration", "Document", "Element", "Event", "EventSource", "EventTarget", "Headers", "History", "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioNode", "AudioParam", "AudioScheduledSourceNode", "BaseAudioContext", "GainNode", "OscillatorNode", "HtmlAudioElement", "HtmlElement", "HtmlIFrameElement", "HtmlMediaElement", "HtmlTextAreaElement", "MediaError", "KeyboardEvent", "MessageChannel", "MessageEvent", "MessagePort", "Navigator", "Performance", "VisualViewport", "Location", "MediaQueryList", "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestCache", "RequestCredentials", "RequestInit", "RequestRedirect", "Response", "Storage", "Window"] }
# The app (src/app): the same components as the desktop and phone apps
# (apps/ui), on dioxus-web.
dioxus = { workspace = true, features = ["web"] }
architect = { workspace = true, features = ["action-list", "connect", "http-client"] }
# The org lane's `Notes` (src/app/org.rs).
vault-proto = { workspace = true, features = ["vox"] }
gloo-timers = { version = "0.3", default-features = false, features = ["futures"] }
# An open note kept live with the node: its body on DocSync (src/app/org.rs).
crdt = { workspace = true, features = ["vox"] }
# Also the vault's changes to the note on show (src/app/favourites.rs).
futures-channel = "0.3"
# The note session's outbox (`crdt::sync::SyncedDoc::outbox`).
tokio = { version = "1", default-features = false, features = ["sync"] }
# Also the frame host's events into its views (src/app/frames.rs).
futures-util = { version = "0.3", default-features = false }
architect-shell = { workspace = true, features = ["ui"] }
architect-workspace = { workspace = true, features = ["ui"] }
architect-commands = { workspace = true, features = ["ui"] }
# ⌘K and ⌘O: the Command Palette, linked in (#495); a share guest draws its views alone.
architect-command-palette = { workspace = true, features = ["extension"] }
architect-settings = { workspace = true, features = ["ui", "appearance"] }
architect-navigator = { workspace = true, features = ["ui"] }
architect-theme = { workspace = true, features = ["dioxus", "actions"] }
architect-ui = { workspace = true }
lucide-dioxus = { workspace = true }
futures-timer = { workspace = true, features = ["wasm-bindgen"] }
# The playhead (#589): the deck every frame and the Now Playing bar read,
# heard through the app's own audio element (src/app/audio.rs).
architect-playhead = { workspace = true, features = ["ui"] }
# A collection note's native list (src/app/collection.rs, #668).
architect-media = { workspace = true, features = ["ui"] }
# The distribution's linked extensions (#495, W1): which ones
# (`architect_distribution::current`, set by `run`), and the host that runs
# them here as on a desk (src/app/extensions.rs; no Luau in a browser).
architect-distribution = { workspace = true }
architect-extensions = { workspace = true, features = ["ui", "linked"] }
architect-theme-picker = { workspace = true }

[dev-dependencies]
# src/read_only.rs's tests: the navigator's source, natively (no UI).
architect-navigator = { workspace = true }

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../workspace-hack" }
