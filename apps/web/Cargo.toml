[package]
name = "architect-web"
description = "Architect in a browser: the web app's shell (OIDC redirect sign-in with PKCE as client `architect`, the node's status over same-origin HTTP), bundled with the landing page and the docs into one static site (`just web`, the `architect-web` image)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# The browser half runs on wasm32-unknown-unknown only; natively the crate
# is its pure part (routes, config, views), which its tests cover.
[target.'cfg(target_arch = "wasm32")'.dependencies]
auth-client = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto", "Document", "Element", "Event", "EventTarget", "Headers", "History", "HtmlElement", "Location", "Request", "RequestInit", "Response", "Storage", "Window"] }

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../workspace-hack" }
