# The lab's example extension (apps/sandbox/board/src/lib.rs). One Rust value
# (`Board`, a linked::Extension) runs it two ways: the lab links it in as
# a built-in, and its program (src/main.rs) serves the same value as a
# process — this manifest's [entry] — when a development copy is run.
# Turn it off (EXT_DISABLE {"id":"lab.board"}) and everything below goes,
# live; on again and it comes back.
id = "lab.board"
name = "Board"
version = "0.1.0"
kind = "process"
api = "0.1"
description = "A pin board: a tab, a Bases view type (board), a status item, a context-menu entry on notes, a .kf opener, a GitHub-issue link opener, a startup hook, its own status bar, and a chart's chord line with its tools over a phone's keyboard."
authors = ["FastTrackStudio"]

[entry]
path = "architect-sandbox-board"

# Where its crate is: EXT_CLONE of the linked Board writes it to the
# development folder and builds this program from it (the lab, built from
# a checkout, copies from that checkout), which then overrides the linked
# one under the same id, rebuilt on save.
[source]
git = "https://github.com/FastTrackStudios/architect"
rev = "main"
path = "apps/sandbox/board"

[[actions]]
id = "LAB_BOARD_PIN"
name = "Pin to the board"
description = "Pins what it was invoked on (a note's pane from its context menu, or `title`) to the board."
group = "Board"
effect = "mutating"
params = '{"type":"object","properties":{"title":{"type":"string"}}}'

[[actions]]
id = "LAB_BOARD_CLEAR"
name = "Clear the board"
group = "Board"
effect = "mutating"

[[actions]]
id = "LAB_BOARD_STATE"
name = "The board"
description = "What is pinned, the chart last opened, the issues opened, and how it was last invoked."
group = "Board"
effect = "read_only"

[[actions]]
id = "LAB_BOARD_HELLO"
name = "Board: started"
description = "Its startup hook: says it is ready on its status item."
group = "Board"
effect = "mutating"

[[actions]]
id = "LAB_BOARD_OPENED"
name = "Board: a document opened"
description = "Its doc.opened hook: remembers the chart."
group = "Board"
effect = "mutating"

[[actions]]
id = "LAB_BOARD_ISSUE"
name = "Board: open an issue"
description = "Its link opener: pins the GitHub issue that was clicked."
group = "Board"
effect = "mutating"

[[actions]]
id = "LAB_BOARD_CHORDS"
name = "The chord sheet"
description = "What the chord sheet holds, and whether sharps are on."
group = "Board"
effect = "read_only"

[[actions]]
id = "LAB_BOARD_SHARP"
name = "Chords: sharps"
description = "Sharps on or off for the chords put in next. A toggle: its Typing Toolbar button shows which."
group = "Board"
effect = "mutating"
toggle = true

[[actions]]
id = "LAB_BOARD_BAR_LINE"
name = "Chords: a bar line"
group = "Board"
effect = "mutating"

[[actions]]
id = "LAB_BOARD_CHORDS_CLEAR"
name = "Chords: clear the sheet"
group = "Board"
effect = "mutating"

[[actions]]
id = "LAB_BOARD_CHORD_C"
name = "Chords: C"
group = "Board"
effect = "mutating"

[[actions]]
id = "LAB_BOARD_CHORD_D"
name = "Chords: D"
group = "Board"
effect = "mutating"

[[actions]]
id = "LAB_BOARD_CHORD_E"
name = "Chords: E"
group = "Board"
effect = "mutating"

[[actions]]
id = "LAB_BOARD_CHORD_F"
name = "Chords: F"
group = "Board"
effect = "mutating"

[[actions]]
id = "LAB_BOARD_CHORD_G"
name = "Chords: G"
group = "Board"
effect = "mutating"

[[actions]]
id = "LAB_BOARD_CHORD_A"
name = "Chords: A"
group = "Board"
effect = "mutating"

[[actions]]
id = "LAB_BOARD_CHORD_B"
name = "Chords: B"
group = "Board"
effect = "mutating"

# The tab is a page file: an app that runs pages (architect-pages) draws
# pages/board.tsx, live on save; one that does not draws BoardView.
[[views]]
id = "board"
title = "Board"
icon = "layout-dashboard"
page = "pages/board.tsx"

# More pages, opened with EXT_VIEW_OPEN: an A2UI JSON page bound to
# LAB_BOARD_STATE, and a Luau page whose worker counts primes. (A view's
# id names its override, `pages/lab.board/<view>.<ext>`: no file of this
# folder may share it, or a clone's copy of that file would win.)
[[views]]
id = "summary"
title = "Board summary"
icon = "list"
page = "pages/summary.a2ui.json"

[[views]]
id = "luau-primes"
title = "Primes (Luau)"
icon = "cpu"
page = "pages/luau-primes.luau"

# A page in Preact, vendored in pages/vendor/: it renders to the page's
# own DOM (`architect/dom`), drawn as any page's edits.
[[views]]
id = "preact"
title = "Preact"
icon = "code"
page = "pages/preact.tsx"

[[views]]
id = "chart"
title = "Keyflow chart"
icon = "music"
placement = "split"

# A small live control for a toolbar: the tempo, read and nudged
# (`[[items]] kind = "widget", view = "lab.board/tempo"`; the toolbar
# editor's widget picker offers it).
[[views]]
id = "tempo"
title = "Tempo"
icon = "gauge"

# A `type: song` note's card, drawn at the note's head (its embed below).
[[views]]
id = "song"
title = "Song card"
icon = "music"

[[openers]]
id = "kf"
title = "Keyflow chart"
files = ["kf"]
view = "chart"

[[openers]]
id = "issue"
title = "GitHub issue"
urls = ['^https://github\.com/[^/]+/[^/]+/issues/\d+$']
action = "LAB_BOARD_ISSUE"

[[doc_kinds]]
id = "keyflow.chart"
name = "Keyflow chart"
files = ["kf"]
icon = "music"
view = "chart"

[[tabs]]
id = "board"
title = "Board"
icon = "layout-dashboard"
view = "board"

[[status]]
id = "pins"
text = "Board starting…"
icon = "pin"
hint = "What is on the board"
side = "left"

[[menus]]
menu = "View"
action = "LAB_BOARD_CLEAR"

[[context]]
target = "view:note"
action = "LAB_BOARD_PIN"
title = "Pin to the board"

[[bar]]
action = "LAB_BOARD_PIN"
title = "Pin"
icon = "pin"

# Over a phone's keyboard while the chart's chord field is typed in, after
# the editor's own items (none here): a sharps toggle, the chords, a
# dropdown that opens above the bar, and the tempo widget. More than a
# phone's width: the bar scrolls sideways. A person's copy
# (`toolbars/lab.board-chords.toml`) is used in its place.
[[toolbars]]
id = "chords"
title = "Chords"
where = "typing"
when = "view:lab.board/chart"

[[toolbars.items]]
action = "LAB_BOARD_SHARP"
label = "♯"

[[toolbars.items]]
action = "LAB_BOARD_CHORD_C"
label = "C"

[[toolbars.items]]
action = "LAB_BOARD_CHORD_D"
label = "D"

[[toolbars.items]]
action = "LAB_BOARD_CHORD_E"
label = "E"

[[toolbars.items]]
action = "LAB_BOARD_CHORD_F"
label = "F"

[[toolbars.items]]
action = "LAB_BOARD_CHORD_G"
label = "G"

[[toolbars.items]]
action = "LAB_BOARD_CHORD_A"
label = "A"

[[toolbars.items]]
action = "LAB_BOARD_CHORD_B"
label = "B"

[[toolbars.items]]
label = "Insert"
menu = [
    { kind = "heading", label = "Sheet" },
    { action = "LAB_BOARD_BAR_LINE", label = "Bar line" },
    { action = "LAB_BOARD_SHARP", label = "Sharps" },
    { kind = "separator" },
    { action = "LAB_BOARD_CHORDS_CLEAR", label = "Clear the sheet" },
]

[[toolbars.items]]
kind = "widget"
view = "tempo"
width = 120

[[hooks]]
on = "startup"
action = "LAB_BOARD_HELLO"

[[hooks]]
on = "doc.opened"
action = "LAB_BOARD_OPENED"

# Inline embeds: a ```kf fence in a note is a chart drawn by a page (a
# sub-document sized to its content, re-drawn as the fence is edited); a
# `type: song` note gets the song card at its head, in the note's own
# document. Unloaded, the plain fence and the plain note come back.
[[embeds]]
id = "kf"
title = "Keyflow chart"
page = "pages/kf.tsx"
claims = { fence = ["kf"] }
max_height = 420

[[embeds]]
id = "song"
title = "Song"
view = "song"
claims = { note_type = ["song"] }

# A view type for Bases: a base's view of `type: board` is drawn by this
# extension's code (`Builder::base_view("board", …)`, src/lib.rs) — a
# column per value of `columnBy` (or the view's groupBy). Bases' view
# picker lists it while the Board is loaded; off, it goes.
[[base_views]]
id = "board"
name = "Board"
icon = "kanban"
options = [{ key = "columnBy", name = "Columns", kind = "property" }]

# Its tour (#379): on its page in the extensions manager, offered once after
# it is turned on, and through TOURS_LIST / TOUR_START.
[[tours]]
id = "board-tour"
title = "Board"
description = "Its status item, pinning a note and clearing the board."
scenario = "tours/board-tour.styx"
