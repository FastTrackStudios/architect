<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>architect lab — web</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- What a page's Web Worker inherits too: scripts of this server and its
       own blob: modules only (no `import()` of another host, no eval), the
       network of this server only. A page reaches others through
       `net.fetch`, checked against its extension's capabilities.hosts. -->
  <!-- 'sha256-2Ozk1xYt6pOOhdNqjDWTnCfSTbCchEDao3pk8Fj3xes=' is the extension sandbox frame's script (features/extensions/web/runner.js SANDBOX_HASH; features/extensions/web/test/sandbox.test.mjs keeps it current). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval' 'sha256-2Ozk1xYt6pOOhdNqjDWTnCfSTbCchEDao3pk8Fj3xes='; worker-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <style>
    :root {
      --background: #18181b; --foreground: #e4e4e7; --border: #3f3f46; --input: #3f3f46; --card: #27272a;
      --primary: #4f46e5; --primary-foreground: #fff; --secondary: #27272a; --secondary-foreground: #e4e4e7;
      --muted-foreground: #a1a1aa; --destructive: #b91c1c; --destructive-foreground: #fff;
      color-scheme: dark;
    }
    body { margin: 0; background: var(--background); color: var(--foreground); font: 14px system-ui, sans-serif; }
    header { display: flex; align-items: baseline; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 15px; margin: 0; }
    header nav { display: flex; gap: 10px; font-size: 13px; }
    header nav a { color: var(--muted-foreground); }
    header .beat { margin-left: auto; font-variant-numeric: tabular-nums; opacity: 0.8; }
    main { display: grid; grid-template-columns: 1fr 340px; gap: 0; height: calc(100vh - 46px); }
    .panes { display: grid; grid-template-rows: 1fr minmax(180px, 34%); border-right: 1px solid var(--border); min-height: 0; }
    #pane { min-height: 0; overflow: auto; }
    #counter { border-top: 1px solid var(--border); min-height: 0; overflow: auto; }
    aside { padding: 14px 16px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
    aside button { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: inherit; text-align: left; }
    aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; opacity: .7; margin: 8px 0 0; }
    #log { font: 12px ui-monospace, monospace; white-space: pre-wrap; opacity: .85; }
    #report { font: 12px ui-monospace, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <h1>architect lab — web</h1>
    <nav><a href="?page=board">Board page</a><a href="?page=preact">Preact</a><a href="?page=runaway">Runaway</a><a href="?page=net">Network</a></nav>
    <span id="status">loading…</span><span class="beat" id="beat"></span>
  </header>
  <main>
    <div class="panes">
      <div id="pane"></div>
      <div id="counter"></div>
    </div>
    <aside>
      <h2>The app's list</h2>
      <div id="actions" style="display:flex;flex-direction:column;gap:6px"></div>
      <h2>The WASI component</h2>
      <div id="report"></div>
      <h2>The log</h2>
      <div id="log"></div>
    </aside>
  </main>
  <script type="module" src="./start.js"></script>
</body>
</html>
