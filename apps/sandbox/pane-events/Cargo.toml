[package]
name = "architect-sandbox-pane-events"
description = "A page that drives the Rust browser applier (architect-extensions `web::Pane`) in a real browser, for features/extensions/web/test/rust-pane.test.mjs (#720 H4). Empty off wasm32."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
architect-extensions = { workspace = true, features = ["web"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Node"] }

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../../workspace-hack" }
