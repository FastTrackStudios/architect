# Sketch: the showcase's drawing example (#175, #176; #710 U3). Every view
# is an anyrender scene its own process records; the app draws it in the
# pane. Panning and zooming send only a transform. Stands in for
# Excalidraw, Canvas and the graph view.
id = "lab.sketch"
name = "Sketch"
version = "0.1.0"
kind = "process"
api = "0.1"
description = "Freehand drawing with pan and zoom, a link graph, and a 50-track arrangement, drawn in another process."
authors = ["FastTrackStudio"]

[entry]
path = "architect-sandbox-sketch"

# The timeline's meter is drawn from the engine's values, written
# lock-free (`architect_scene::engine`). Declined, the meter stands.
[capabilities]
ui = ["engine"]

# Drag to draw; Shift-drag or the middle button pans; the wheel zooms.
[[views]]
id = "sketch"
title = "Sketch"
icon = "pencil"

# A small link graph; drag a node. A paint view (`Builder::paint`), the
# same code linked in or here in its process.
[[views]]
id = "graph"
title = "Graph"
icon = "share-2"
kind = "paint"

# The arrangement's clips with a playhead moving over them: a paint view
# that returns layers, the playhead's motion with them, so the host runs
# playback and a frame of it sends nothing.
[[views]]
id = "timeline"
title = "Timeline"
icon = "play"
kind = "paint"

# 50 tracks of 40 clips: the arrangement-sized scene #175 measures.
[[views]]
id = "arrangement"
title = "Arrangement"
icon = "rows-3"

# The timeline at 20,000 clips (200 tracks of 100): the arrangement the
# frame-time report measures (#839), linked in the sandbox and as a
# process here.
[[views]]
id = "timeline-20k"
title = "Timeline (20,000 clips)"
icon = "play"
kind = "paint"

# Nudges the timeline: how many times it has been nudged. `N` runs it
# while the timeline has the focus (a key scoped to the view, #844), and
# the timeline's toolbar has a button for it.
[[actions]]
id = "LAB_SKETCH_NUDGE"
name = "Sketch: nudge"
description = "Nudges the timeline: {nudged}, how many times so far."
group = "Sketch"
effect = "mutating"

[[keys]]
chord = "N"
action = "LAB_SKETCH_NUDGE"
when = "view:timeline"

# Its icon is a glyph drawn in a fixed grey: `tint` draws it in the
# toolbar's ink, so it follows the theme as the app's icons do.
[[toolbars]]
id = "timeline"
title = "Timeline"
where = "view:lab.sketch/timeline"

[[toolbars.items]]
action = "LAB_SKETCH_NUDGE"
label = "Nudge"
image = "icons/nudge.svg"
tint = true
hide_label = true
