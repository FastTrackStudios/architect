# What the showcase vault needs (#710 L2, "What a project needs"): each
# showcase extension, required or optional, with the versions it works
# with. Opening the vault lists what is missing, with "Install all".
# `scripts/showcase.sh` loads all of them as development copies on the
# desk. The process extensions, the WASI component and the web view are
# optional: they need a build, and a process cannot run on the web or iOS.
# Their signed archives travel in .architect/extensions/ once a release
# signs them with the org key (a vault's archives are trusted by that key
# only on a fresh device).

[[extensions]]
id = "showcase.bank-link"
name = "Bank link"
version = "^0.1.0"  # luau, examples/showcase/bank-link
required = true

