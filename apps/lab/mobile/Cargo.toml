[package]
name = "architect-mobile"
description = "The app shell's lab on an iPhone or iPad (Blitz on UIKit). `dx serve --ios` it for hot reload on the simulator."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
architect-lab-ui = { workspace = true }
architect-shell = { workspace = true, features = ["ui"] }
dioxus = { workspace = true }
dioxus-native = { workspace = true, features = ["vello", "hot-reload"] }
tracing = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true }
objc2-ui-kit = { workspace = true }

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../../workspace-hack" }
