[package]
name = "architect-desktop"
description = "The app shell's lab in a desk window (Blitz): resize it, or stand it in for an iPhone or an iPad from the ⋯ menu. `dx serve` it for hot reload."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "architect-desktop"
path = "src/main.rs"

[features]
keyflow-lab = ["architect-lab-ui/keyflow-lab"]

[dependencies]
architect-lab-ui = { workspace = true }
# An agent's surfaces, kept in their file across restarts (src/main.rs).
architect-a2ui = { workspace = true }
# Its Action List from the command line (`architect-desktop actions …`) and
# its control socket; MCP on stdio, bridged onto that socket or headless.
architect = { workspace = true, features = ["action-list"] }
architect-control = { workspace = true, features = ["server", "cli"] }
architect-mcp = { workspace = true, features = ["bridge", "http"] }
# `--headless`: the lab's root in a document with no window.
architect-guide = { workspace = true, features = ["run"] }
architect-shell = { workspace = true }
# One instance, and a `--background` launch starting with no window.
architect-presence = { workspace = true, features = ["native"] }
architect-workspace = { workspace = true, features = ["native", "hot-reload"] }
dioxus = { workspace = true }
dioxus-native = { workspace = true, features = ["vello", "hot-reload"] }
# The lab's Action List over MCP on loopback, when asked (src/mcp.rs).
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
architect-mcp = { workspace = true, features = ["parity"] }
clap.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../../workspace-hack" }
