# The lab's process extension: its view is drawn by its own process
# (src/main.rs) and shown in a pane of the Vault (apps/lab/ui/src/vault.rs).
# The lab runs it as a development copy when the program is built beside
# the lab's own (`cargo build --workspace`).
#
# It is themeable all the way: its view styles itself with the app's CSS
# variables and reads the theme as data; its ImGui window (window.luau)
# reads `theme`; its own tokens below default to the palette; and it
# contributes a theme, Clicker Neon.
id = "lab.clicker"
name = "Clicker"
version = "0.1.0"
kind = "process"
api = "0.1"
description = "A counter drawn in another process: click it, kill it, start it again."
authors = ["FastTrackStudio"]

[entry]
path = "architect-lab-clicker"

# Through the host service it reads the app's status (and its own
# setting, which needs nothing).
[capabilities]
actions = ["APP_STATUS"]
effect = "read_only"

[[actions]]
id = "LAB_CLICKER_CLICKS"
name = "Clicker: clicks"
description = "How many times its button was pressed since it started."
effect = "read_only"

[[actions]]
id = "LAB_CLICKER_PROBE"
name = "Clicker: ask the host"
description = "From its own process, through the host service: its step setting and the app's problem count."
effect = "read_only"

[[sections]]
id = "clicker"
title = "Clicker"
icon = "mouse-pointer-click"

[[sections.settings]]
key = "lab.clicker.step"
title = "Clicks per press"
control = "stepper"
min = 1
max = 10
default = 1

[[views]]
id = "counter"
title = "Clicker"
icon = "mouse-pointer-click"

[[themes]]
path = "themes/clicker-neon.json"

# Its own tokens, defaults that follow whatever theme shows. A theme file,
# the app or the person may set any of them (THEME_TOKEN_SET).
[tokens]
"clicker.face" = "mix($card, $brand, 0.22)"
"clicker.face-hover" = "mix($card, $brand, 0.38)"
"clicker.edge" = "mix($border, $brand, 0.5)"
"clicker.count" = "$brand"
"clicker.radius" = "10"
