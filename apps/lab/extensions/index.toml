# The lab's registry: a folder with an index, as a registry's git
# repository is (features/extensions/src/index.rs). The lab installs from
# it and reloads what it installed when a file here changes.
name = "Architect Lab"

[[extensions]]
id = "fts.metronome"
name = "Metronome"
version = "0.1.0"
kind = "luau"
description = "A click: its accent, volume and sound on the settings page, and an action that counts in."
path = "metronome"

[[extensions]]
id = "fts.imgui-demo"
name = "ImGui demo"
version = "0.1.0"
kind = "luau"
description = "Dear ImGui's demo window, section by section, in architect's ImGui: what it draws, and the API each section still lacks."
path = "imgui-demo"
