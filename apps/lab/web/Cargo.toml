[package]
name = "architect-lab-web"
description = "The lab's web host for an agent's UI: an A2UI surface rendered with A2UI_RENDER, patched live and answered in the confirmation sheet, in a browser (wasm, the DOM), next to the page's own Tailwind sheet."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Built for wasm32-unknown-unknown and bound with wasm-bindgen, then served
# with index.html and app.css (`just lab-web`); its browser tests are in
# e2e/ (`just lab-web-e2e`). On a desk it only says so: the host is the
# browser.

[dependencies]
architect = { workspace = true, features = ["action-list"] }
architect-a2ui = { workspace = true, features = ["ui"] }
# The sheet the person answers an agent's write in.
architect-commands = { workspace = true, features = ["ui"] }
crdt = { workspace = true }
dioxus = { workspace = true }
facet = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { workspace = true, features = ["web", "launch"] }
# The page's door to the Action List, as an agent (`a2ui` in src/main.rs).
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
futures = "0.3"

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../../workspace-hack" }
