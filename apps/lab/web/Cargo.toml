[package]
name = "architect-lab-web"
description = "The lab in a browser: the WASI Counter component (apps/lab/wasi-counter) run by the browser's WebAssembly, its view in the page, its primes in a Web Worker (`just lab-web`)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Its page runs on wasm32-unknown-unknown only; on a native workspace
# build it is empty.
[target.'cfg(target_arch = "wasm32")'.dependencies]
architect = { workspace = true, features = ["action-list"] }
architect-extensions = { workspace = true, features = ["web"] }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "Window", "Performance"] }

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../../workspace-hack" }
