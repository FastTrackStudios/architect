[package]
name = "architect-lab-ui"
description = "The app shell's lab: a made-up app on architect_shell, mounted by the lab apps (apps/lab/desktop, apps/lab/mobile), for designing the shell on every form factor with hot reload."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
architect-shell = { workspace = true, features = ["ui"] }
# The Embedded views' paint pane (src/paint.rs): the paint kind on Blitz.
architect-workspace = { workspace = true, features = ["ui", "paint-ui"] }
architect-commands = { workspace = true, features = ["native"] }
architect-settings = { workspace = true, features = ["ui", "store"] }
architect-orgs = { workspace = true, features = ["ui"] }
architect-extensions = { workspace = true, features = ["ui", "remote"] }
architect-canvas = { workspace = true, features = ["ui", "luau"] }
architect-scripting = { workspace = true, features = ["luau"] }
# Guided tours of the lab's scenarios, live in the window.
architect-guide = { workspace = true, features = ["ui"] }
serde_json = { workspace = true }
# An agent's generated UI (src/vault.rs, the "Agent UI" view), its
# surfaces on a Loro document.
architect-a2ui = { workspace = true, features = ["ui"] }
crdt = { workspace = true }
architect = { workspace = true, features = ["action-list", "settings"] }
dioxus = { workspace = true }
facet = { workspace = true }
dioxus-native = { workspace = true }
# The Dock icon and its badge, the menu-bar item, background mode, opening
# at login (src/presence.rs): the model everywhere, the platforms' side on
# a desk.
architect-presence = { workspace = true }
lucide-dioxus = { workspace = true }
futures-timer = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
architect-presence = { workspace = true, features = ["native"] }

[lints]
workspace = true

[target.'cfg(not(any(target_family = "wasm", no_workspace_hack)))'.dependencies]
architect-workspace-hack = { version = "0.1", path = "../../../workspace-hack" }
