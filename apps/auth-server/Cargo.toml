[package]
name = "auth-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone FastTrackStudio identity server: architect-auth as a deployable service (vox RPC + OIDC provider + session HTTP)."

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[lib]
name = "auth_server"
path = "src/lib.rs"

[[bin]]
name = "auth-server"
path = "src/main.rs"

[dependencies]
architect = { workspace = true, features = ["server", "host", "http", "http-client", "local", "connect", "iroh"] }
architect-auth = { workspace = true, features = ["full"] }
architect-telemetry.workspace = true
async-trait.workspace = true
base64.workspace = true
auth-proto = { workspace = true, features = ["vox"] }
auth-ui.workspace = true
axum.workspace = true
chrono.workspace = true
dioxus.workspace = true
dioxus-ssr.workspace = true
eyre.workspace = true
lettre.workspace = true
# Provider HTTP (GitHub/Google token exchange + profile): rustls, no
# native TLS, no blocking stack.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# PKCE challenges (social.rs) — TONE3000 requires S256.
sha2.workspace = true
tokio.workspace = true
tower-http = { workspace = true, features = ["cors", "trace"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
hex.workspace = true
k256.workspace = true
sha3.workspace = true
url = "2"
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
totp-rs.workspace = true
sha2.workspace = true
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
# The stand-in provider, so the real HTTP client can be driven against
# something that answers like GitHub, Google and TONE3000.
mock-oauth = { path = "../mock-oauth" }
# The cross-transport suite dials the vox router over iroh, loopback.
iroh.workspace = true
vox-core.workspace = true
futures = "0.3"

[lints]
workspace = true
